# Workspace Rust de hub (ARQUITECTURA.md §4, §11).
# Los miembros vigentes son la lista `members` de abajo; el estado de cada crate está en
# crates/README.md. Ninguno es un esqueleto (guest-sdk, wasm-host y sync dejaron de serlo).
[workspace]
resolver = "2"
members = [
    "crates/runtime",
    "crates/db",
    "crates/installer",
    "crates/source",
    "crates/cloud-client",
    "crates/guest-sdk",
    "crates/wasm-host",
    "crates/server",
    "crates/verifactu",
    "crates/sync",
    "crates/vector",
    "crates/peripherals",
    "apps/tauri/src-tauri",
    "crates/tauri-plugin-erplora-android",
]

[workspace.package]
edition = "2021"
# Versión semántica del hub (hub#515, ADR-0269 modelo de actualización). Fuente única de verdad:
# todos los crates la heredan vía `version.workspace = true`, y el runtime la reporta vía
# `env!("CARGO_PKG_VERSION")` (/api/system hubVersion, error-sink). El CI de release la reescribe
# desde el tag `v*` antes del build (build-hub.yml), así que en una release publicada este valor es
# el del último tag; en `main` entre releases es el "en desarrollo". Criterio MAJOR/MINOR/PATCH en
# architecture/hub/versioning.md (ADR-0275).
#
# 🔴 El tag NO se cree a ciegas: `scripts/image-tags.sh` corre ANTES del build y rechaza un tag
# que no sea semver, uno YA PUBLICADO o uno MENOR que la última release. Las versiones de
# Microsoft Store y Google Play son monótonas e irreversibles —el MISMO tag `v*` dispara
# `tauri-release.yml`—, así que un `v1.2.4` mal escrito quema ese número en las stores para
# siempre. La guarda es lo único que se interpone.
version = "1.0.0"
license = "MIT"

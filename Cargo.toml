# Workspace Rust de hub (ARQUITECTURA.md §4, §11).
# Los miembros vigentes son la lista `members` de abajo; el estado de cada crate está en
# crates/README.md. Ninguno es un esqueleto (guest-sdk, wasm-host y sync dejaron de serlo).
[workspace]
resolver = "2"
members = [
    "crates/runtime",
    "crates/db",
    "crates/installer",
    "crates/source",
    "crates/cloud-client",
    "crates/guest-sdk",
    "crates/wasm-host",
    "crates/server",
    "crates/verifactu",
    "crates/sync",
    "crates/vector",
    "crates/peripherals",
    "apps/tauri/src-tauri",
    "crates/tauri-plugin-erplora-android",
]

[workspace.package]
edition = "2021"
# 🔴 FUENTE ÚNICA de la versión del hub (hub#515 / ADR-0275). Todos los crates la heredan
# (`version.workspace = true`), así que esto es lo que reporta `env!("CARGO_PKG_VERSION")` en
# `/system` y en `error_sink`; y `scripts/image-tags.sh` lee ESTE fichero para nombrar la imagen,
# de modo que el tag del registro y el número que dice el binario no pueden separarse.
# Antes valía `0.0.0` y la imagen se llamaba como el ref de git: dos digests no dicen si el salto
# es un parche de seguridad o una versión nueva.
# El criterio de qué es MAJOR/MINOR/PATCH aquí: `architecture/hub/versioning.md`.
version = "1.0.0"
license = "MIT"

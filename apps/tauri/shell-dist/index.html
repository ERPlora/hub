<!doctype html>
<!-- Página DEGRADADA del shell (ADR-0159): solo se ve si la ventana no pudo navegar al SaaS/hub
     (sin red en el primer arranque, o fallo de arranque). El shell es un cliente fino: el
     contenido real vive en https://erplora.com (onboarding) y en la PWA del hub cloud. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERPlora</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: light-dark(#f6f8fa, #111418); color: light-dark(#1f2937, #e5e7eb);
      }
      main { text-align: center; padding: 2rem; max-width: 26rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: .25rem 0; color: light-dark(#6b7280, #9ca3af); font-size: .95rem; }
      button {
        margin-top: 1.25rem; padding: .6rem 1.4rem; border: 0; border-radius: .5rem;
        background: #2563eb; color: #fff; font-size: .95rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>ERPlora necesita internet para arrancar.</p>
      <p>Comprueba la red y vuelve a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

# apps/tauri — empaquetado desktop/Android (Tauri v2) de la app GRATUITA.
#
# NO está en `members` del workspace raíz todavía: requiere el toolchain Tauri v2 y el
# `dist` del frontend (`apps/web`), igual que indica el README. Cuando se estabilice el
# arranque (§11 / de-risk #2), añadir "apps/tauri/src-tauri" a `members` en `../../../Cargo.toml`.
[package]
name = "erplora-tauri"
edition = "2021"
version = "0.0.0"
license = "MIT"
description = "ERPlora Hub — free desktop/Android shell (Tauri v2) with the entitlement startup gate"

[lib]
name = "erplora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
erplora-cloud-client = { path = "../../../crates/cloud-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

# apps/tauri — shell CLIENTE FINO de escritorio (Tauri v2), ADR-0159.
#
# La webview carga el onboarding del SaaS y después la PWA del hub cloud (`hub_url`); el hardware
# local va por handlers `invoke` sobre `erplora-peripherals` (el shell ES el bridge, ADR-0050).
# SIN runtime embebido, SIN SQLite, SIN entitlement gate (ADR-0154 los retiró; este crate ya no
# depende de `erplora-server` ni de `erplora-cloud-client`).

[package]
name = "erplora-tauri"
edition = "2021"
version = "0.0.0"
license = "MIT"
description = "ERPlora Shell — thin desktop client (Tauri v2): SaaS onboarding + cloud hub PWA in a webview, local hardware via invoke"

[lib]
name = "erplora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Hardware POS (impresoras de red ESC/POS + cajón) — el shell ES el bridge (§2.7): los handlers
# `invoke` de hardware delegan en este crate, igual que el bridge standalone (`apps/bridge`)
# delega vía WS. Mismo contrato JSON (`protocol::{PrinterInfo,Device}`).
erplora-peripherals = { path = "../../../crates/peripherals" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Canales del worker de la PrintQueue + watchdog (tareas de fondo del shell).
tokio = { version = "1", features = ["sync"] }
# `device.id` estable por instalación (X-Device-Id del login, §2.9b / sesión única ADR-0154).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `tests/remote_acl.rs` valida los patrones de `capabilities/default.json` con el MISMO motor que
# Tauri usa en runtime (`RemoteUrlPattern`), en vez de reimplementar el matching en el test.
tauri-utils = "2"

# apps/tauri — empaquetado desktop/Android (Tauri v2) de la app GRATUITA.
#
# Miembro del workspace raíz (`../../../Cargo.toml`). Compilarlo requiere el toolchain Tauri v2
# (WebView del SO) y el `dist` del frontend (`apps/web` → `pnpm -F @erplora/web build`).

[package]
name = "erplora-tauri"
edition = "2021"
version = "0.0.0"
license = "MIT"
description = "ERPlora Hub — free desktop/Android shell (Tauri v2) with the entitlement startup gate"

[lib]
name = "erplora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
erplora-cloud-client = { path = "../../../crates/cloud-client" }
# Runtime del hub **embebido in-process** (§11): el shell arranca el mismo `erplora-server` (Axum)
# que en cloud, sobre SQLite local, y el webview le habla por loopback (127.0.0.1:8787) igual que
# en web. Arrastra runtime+db+axum. NO compilado aquí (apps/tauri fuera del workspace).
erplora-server = { path = "../../../crates/server" }
# Hardware POS (impresoras de red ESC/POS + cajón) — el shell Tauri ES el bridge en los combos
# Tauri (§2.7): los handlers `invoke` de hardware delegan en este crate, igual que el bridge
# standalone (`apps/bridge`) delega vía WS. Mismo contrato JSON (`protocol::{PrinterInfo,Device}`).
erplora-peripherals = { path = "../../../crates/peripherals" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

# Keychain del SO para el token de máquina del hub (secreto). SOLO desktop: el crate `keyring`
# no tiene backend en Android, y `sync-secret-service` arrastra dbus/zbus que no compilan para
# Android → se declara target-específica (no-android). En Android se usa el fichero 0600 dentro
# del sandbox por-app. Ver `src/lib.rs::persist_machine_token`. Features (keyring 3.x):
# macOS=apple-native, Windows=windows-native, Linux=sync-secret-service+crypto-rust (cifrado del
# transporte D-Bus en Rust puro, sin OpenSSL). NO compilado aquí: apps/tauri está fuera del
# workspace (necesita toolchain Tauri v2).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# erplora-bridge — bridge de hardware standalone (combo `cloud + web-PWA`). ARQUITECTURA.md §2.7.
# Servidor Axum `GET /status` + `WS /ws` sobre `erplora-peripherals`. Reemplaza al Bridge Python.
[package]
name = "erplora-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "erplora-bridge"
path = "src/main.rs"

[features]
# `tray` habilita el icono de la bandeja del sistema (`tray-icon`). OFF por defecto para que el
# binario headless y `cargo test`/`cargo check --workspace` compilen sin dependencias gráficas ni
# event-loop de plataforma (ADR-0154: el tray degrada limpio; el pairing NO depende de él).
tray = ["dep:tray-icon"]

[dependencies]
erplora-peripherals = { path = "../../crates/peripherals" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Token de emparejamiento del Bridge (ADR-0050 §seguridad): uuid v4 (CSPRNG vía getrandom) como
# secreto cuando no se inyecta `BRIDGE_TOKEN`. Mismo crate que usa el runtime para `:new_id`.
uuid = { version = "1", features = ["v4"] }
# Verificación de la credencial JWT firmada (RS256) contra una clave PÚBLICA configurada — misma
# versión y patrón que `crates/cloud-client` (user_jwt/entitlement). La clave pública NO es secreta:
# solo quien tiene la privada (SaaS/Hub) puede emitir tokens válidos → seguro para open source.
jsonwebtoken = "9"
# La clave pública se PIDE AL SAAS (`GET /api/v1/auth/public-key/`, mismo endpoint que el runtime
# del Hub). Mismas features/TLS que `crates/server` para no duplicar el árbol de deps.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
# Notificaciones de SO para `send_notification` (bridge#9): multiplataforma (Linux DBus /
# macOS / Windows Toast); si la plataforma no soporta, degradamos a log sin panic.
notify-rust = "4"
# Dir de datos por-usuario para `devices.json` (hub#121): bajo MSIX el install-dir es de solo
# lectura → %LOCALAPPDATA%\ERPloraBridge (Windows) / equivalente XDG/macOS.
dirs = "6"
# Errores tipados del cliente de pairing (ADR-0154) — mismo patrón que `crates/cloud-client`.
thiserror = "1"
# Abre el navegador del sistema en `verification_uri_complete` (device-code flow, ADR-0154).
# `open` delega en el gestor del SO (`open`/`xdg-open`/`start`): sin árbol de deps gráficas, el más
# ligero para "abre esta URL con la app por defecto".
open = "5"

# Icono de la bandeja del sistema (ADR-0154), OPCIONAL tras la feature `tray`: en el binario headless
# (CI/tests) no se compila, así el event-loop de plataforma no complica el build por defecto.
tray-icon = { version = "0.19", optional = true }

# Los tests de integración del handshake WS usan un cliente TCP crudo (sin deps extra): escriben
# la petición HTTP/1.1 de upgrade a mano y leen la línea de estado. Así se evita arrastrar un
# backend HTTP/TLS solo para los tests.

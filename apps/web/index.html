<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Un hub es la caja de un cliente: nunca se indexa. El servidor manda `X-Robots-Tag` en
         todas las respuestas (`with_noindex`), pero esta copia del documento viaja DENTRO de la
         app instalada, donde no hay cabecera que valga. Contrato: crates/server/tests/never_indexed.rs -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>ERPlora · Hub</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0091CE" />
    <!-- hub#2073: the shell mounts only after the hub answers (`bootHubContext`, the courier), and
         until then this is all there is on screen. Styled here, not in the bundle, because the
         bundle has not loaded yet; Vue replaces `#app`'s content when it mounts. No words: this
         document cannot translate. -->
    <style>
      .boot-progress {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-progress-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0, 145, 206, 0.2);
        border-top-color: #0091ce;
        border-radius: 50%;
        animation: boot-progress-spin 0.8s linear infinite;
      }
      @keyframes boot-progress-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-progress" role="status" aria-busy="true"><div class="boot-progress-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

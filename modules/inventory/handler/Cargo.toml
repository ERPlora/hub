# Guest WASM handler para el módulo `inventory` (Tier 2). Compila a wasm32 (cdylib)
# y exporta `bulk_create` y `receive_stock` — las dos operaciones batch del módulo
# (bulk_create_products cap 100, receive_stock cap 200 en el legacy). Crate
# independiente del workspace (el `[workspace]` vacío lo desacopla); extism-pdk
# solo compila a wasm.
#
# Build:  cargo build --target wasm32-unknown-unknown --release --features guest
# Output: target/wasm32-unknown-unknown/release/inventory_handler.wasm → dist/handler.wasm
[package]
name = "inventory-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
erplora-guest-sdk = { path = "../../../crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sin lto/strip: interfieren con los wrappers de export de extism-pdk.
[profile.release]
opt-level = "s"

[workspace]

# Guest WASM handler del módulo `customers` (Tier 2). Exporta los batch del legacy:
# bulk_create (cap 50), set_groups y set_tags (asignación M2M: clear + N adds).
# Crate independiente del workspace; extism-pdk solo compila a wasm.
[package]
name = "customers-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
erplora-guest-sdk = { path = "../../../crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

[workspace]

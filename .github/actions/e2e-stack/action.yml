name: The Hub's e2e stack
description: >-
  What scripts/nightly_e2e.py expects around a checkout of the Hub with its whole history, for the smoke of test.yml
  and the nightly: uv, pnpm and node; the SaaS of origin/main in ../saas (every login goes through erplora.com), the
  shared image library in ../blueprints and compose.yaml's Postgres in .., which the specs reach with
  `docker compose exec`, with PostgreSQL's client of its version, which copies a business's database; and Roboto as
  the browser's system-ui and sans-serif, as on the Android tablets the Hub is made for. Each checkout gets the .env of
  a new one. The job's token only needs to read.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - uses: ./.github/actions/postgres-client
    # Ubuntu draws system-ui with DejaVu Sans, much wider than Roboto: the specs that measure whether a text fits would
    # fail here and pass on a tablet. The step fails when fontconfig still picks another font.
    - name: Roboto, the tablets' font
      shell: bash
      run: |
        bash .github/scripts/apt-install.sh "$RUNNER_TEMP/apt-fonts" fonts-roboto-unhinted
        sudo install -m 644 "$GITHUB_ACTION_PATH/fonts.conf" /etc/fonts/local.conf
        for generic in system-ui sans-serif; do
          drawn="$(fc-match -f '%{family[0]}' "$generic")"
          echo "$generic is drawn with $drawn"
          [ "$drawn" = Roboto ] || { echo "::error::fontconfig draws $generic with $drawn, not Roboto"; exit 1; }
        done
    - name: The SaaS, the image library and Postgres beside the Hub
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/scripts/clone-repo.sh ERPlora/saas ../saas
        bash .github/scripts/clone-repo.sh ERPlora/blueprints ../blueprints img
        cp .env.example .env
        cp ../saas/.env.example ../saas/.env
        cat > ../compose.yaml <<'YAML'
        services:
          postgres:
            image: pgvector/pgvector:pg18
            environment:
              POSTGRES_USER: hub
              POSTGRES_PASSWORD: hub
              POSTGRES_DB: hub
            ports:
              - "5432:5432"
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
              interval: 2s
              timeout: 3s
              retries: 30
        YAML
        docker compose -f ../compose.yaml up -d --wait

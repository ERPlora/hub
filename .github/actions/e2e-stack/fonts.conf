<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed as /etc/fonts/local.conf, which Ubuntu reads before its own preference for DejaVu Sans: the browser of
     the specs draws system-ui and sans-serif with Roboto, as the Android tablets the Hub is made for do. -->
<fontconfig>
  <alias>
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>

name: PostgreSQL 18's client
description: >-
  PostgreSQL 18's client, as the Dockerfile's postgresql-client-18, first in the PATH of the steps after it:
  base/tenancy/dumps.py copies a hub's database with pg_dump (and its tests read the copy with pg_restore), pg_dump
  refuses a newer server, and the runner's own client is older than the CI's Postgres. It comes from PGDG, signed with
  the Dockerfile's key, through apt-install.sh, which retries apt and refreshes its lists without the runner's
  Microsoft sources (at times they answer 403). Its .deb files are not cached: apt only knows the package once PGDG's
  lists are refreshed. pytest's job of test.yml and the e2e stack both use it.

runs:
  using: composite
  steps:
    - name: PostgreSQL 18's client
      shell: bash
      run: |
        sudo install -m 644 docker/pgdg.asc /usr/share/keyrings/pgdg.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        bash .github/scripts/apt-install.sh "$RUNNER_TEMP/apt-pgdg" postgresql-client-18
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

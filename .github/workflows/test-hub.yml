# ==============================================================================
# ERPlora Hub (Rust) — Test suite (Postgres-only runtime, ADR-0154)
# ==============================================================================
#
# Corre `cargo test --workspace` del Hub contra un **Postgres 18** real (service
# container). Desde ADR-0154 el Hub es Postgres-only: los tests del runtime/server
# usan el helper `erplora_db::testutil` (feature `test-util`), que crea un ESQUEMA
# efímero por test sobre `DATABASE_URL` para aislar los tests en paralelo.
#
# Los e2e que instalan módulos reales (`postgres_install_e2e`, `sector_packs_pg_e2e`)
# se auto-omiten si `modules-workspace/` (repos hermanos) no está presente — como en
# este runner aislado — y corren en local, donde los módulos están al lado del hub.
# ==============================================================================

name: Hub tests (Rust · Postgres)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # El helper de test (erplora_db::testutil) usa este DSN; default idéntico si no se define.
      DATABASE_URL: postgres://postgres:test@localhost:5433/hub_test
      # Sin debuginfo: el `target/` del workspace (wasmtime/extism/sqlx + decenas de binarios de
      # test) desbordaba los ~14 GB del runner y el LINK moría con SIGBUS/ENOSPC. El debuginfo es
      # el grueso del target; quitarlo hace que `cargo test --workspace` quepa de sobra.
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Libera ~25-30 GB de imágenes/toolchains preinstalados que no usamos, para que el link del
      # workspace no se quede sin disco (SIGBUS/ENOSPC en `ld` durante los binarios de test).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # `--exclude erplora-tauri`: el shell de escritorio (ADR-0159) arrastra tauri/wry → GTK/
      # webkit2gtk, system-libs que este runner no tiene y que inflarían el target (el disco ya
      # iba justo: ver "Free disk space"). Sus tests corren en `test-shell.yml`, que instala las
      # deps GTK y se dispara SOLO cuando cambia `apps/tauri/**` (filtro por paths).
      - name: cargo test --workspace
        run: cargo test --workspace --exclude erplora-tauri

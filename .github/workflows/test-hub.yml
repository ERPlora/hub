# ==============================================================================
# ERPlora Hub (Rust) — Test suite (Postgres-only runtime, ADR-0154)
# ==============================================================================
#
# Corre `cargo test --workspace` del Hub contra un **Postgres 18** real (service
# container). Desde ADR-0154 el Hub es Postgres-only: los tests del runtime/server
# usan el helper `erplora_db::testutil` (feature `test-util`), que crea un ESQUEMA
# efímero por test sobre `DATABASE_URL` para aislar los tests en paralelo.
#
# 🔴 Los e2e que instalan módulos reales SE AUTO-OMITEN aquí y este run sale VERDE sin
# haberlos ejecutado: `actions/checkout@v4` trae solo este repo, `modules-workspace/`
# (~27 repos hermanos: el catálogo publicado entero) no está, y el guard ve `CI=true` y
# toma el skip legítimo (hub#253).
#
# No son dos ficheros: son **238 tests repartidos en 36 targets** de `crates/runtime/tests/`
# (medido el 2026-08-26). Toda la cadena fiscal, el TPV, la cocina y el inventario entran
# ahí. Este comentario decía «`postgres_install_e2e`, `sector_packs_pg_e2e`» y esa cifra
# hizo creer que el hueco era menor de lo que es.
#
# Y tampoco los cubre el gate local: `.githooks/pre-push` los salta POR DEFECTO desde
# hub#855 y solo los corre con `HUB_GATE_WITH_MODULES=1`. Estuvieron sin correr en ningún
# sitio automático hasta hub#1216 — y por eso un test caducado por ADR-0405 aguantó un día
# entero en rojo con este workflow en verde (hub#1215).
#
# ✅ **Los corre `test-hub-modules.yml`** (hub#1216): se trae el catálogo por su estado
# publicado y los ejecuta con `ERPLORA_E2E_REQUIRE_MODULES=1`, que hace FATAL la ausencia
# de módulos para que ese job no pueda repetir este mismo verde vacío. Va por `schedule`
# diario además de por push: el rojo de hub#1215 lo causó una release de MÓDULO, sin
# ningún commit del hub de por medio.
# ==============================================================================

# ── Lints (hub#1242) ─────────────────────────────────────────────────────────
# Este workflow es también el gate de lints del hub: corre `cargo clippy --workspace` ANTES de la
# suite. Los NIVELES no viven aquí sino en `[workspace.lints]` del `Cargo.toml` raíz, heredados
# por los 14 miembros con `[lints] workspace = true`.
#
# 🔒 RATCHET — promocionar un grupo a `deny` son DOS pasos, y ninguno toca este fichero:
#   1. dejar el grupo a cero hallazgos
#      (`cargo clippy -p <crate> --all-targets --fix` cubre casi todo);
#   2. cambiar su `level` a `"deny"` en `[workspace.lints.clippy]` del `Cargo.toml` raíz.
# Hoy: `correctness` = deny (0 hallazgos, así que el gate nace verde); `suspicious` = warn (58);
# style/complexity/perf en su warn por defecto (129) y 30 avisos propios de rustc. El paso NO
# lleva `-D warnings` justamente porque pasaría por encima de esa tabla y haría error todo lo
# anterior — un gate rojo el primer día se aprende a ignorar. El cableado lo vigila `scripts/tests/clippy-lints.test.sh`, que corre
# como primer paso de este mismo job.

name: Hub tests (Rust · Postgres)

# ── Sin `pull_request` desde el 2026-08-29 (pm#197) ───────────────────────────
# Historia, en pasado porque terminó. Este gate se quitó de las PR porque se llevaba el
# 96% de los minutos de Actions del repo (127 runs / 1.647 min en 3 días, con la
# organización en overage). Ese motivo caducó con hub#837 —desde el 2026-08-11 los jobs
# salen por runners propios de la org (`CI_RUNNER_LABEL`), cuyos minutos no se facturan—
# y el bloque volvió: entre esa fecha y el 2026-08-29 la suite sí se ejecutó en cada PR.
# pm#197 lo retiró otra vez (decisión de Ioan, con `ci-runner-1` saturado), y ESA es la
# situación de hoy.
#
# Qué prueba una PR HOY —lo que este bloque contaba al revés hasta hub#1438—: el gate
# LOCAL de `.githooks/pre-push`, y nada en la nube. Desde hub#1207 el local resuelve por
# alcance (solo los paquetes que toca el diff) bajo un lock de máquina que con la flota es
# el techo de todo (~8-10 issues/día).
# Ojo al contrato de atestación: el local publica `local-gate/hub-tests` SOLO cuando de
# verdad corrió el workspace; una pasada por alcance publica `local-gate/hub-tests-scoped`,
# que `merge-pr.sh` no acepta como prueba de la suite completa. Sin uno de los sellos
# válidos, `require_workspace_suite` corta el merge (pm#58/#60, pm#197).
#
# Lo que aporta ESTE workflow no es la puerta de la PR, sino la red de después: el `push` a
# develop/main, sobre el árbol que dejó el merge — y el hueco que cierra es real, un lote
# develop→main de 23 commits se integraba sin que la suite hubiera visto nunca esos commits
# JUNTOS. Es el mismo agujero que el SaaS cerró en saas#1020.
# ── Push to develop: the POST-MERGE check (hub#572) ──────────────────────────
# Two individually-green PRs can break develop when combined: the clash is
# semantic, not textual (one PR widens a struct the other constructs literally
# — no shared line, git merges clean, each gate ran the suite against the
# develop of ITS moment). Nothing ran the suite on the RESULTING develop, so
# the breakage surfaced on the next victim's pre-push, pointing at their diff.
# This trigger closes that hole: the suite runs on develop exactly as each
# merge left it. Prevention at merge time (option 1) lives in pm's merge-pr.sh
# (pm#74) — but that is `cargo check`, it does not EXECUTE; this run does.
on:
  # `pull_request` VOLVIÓ el 2026-09-03 (hub#1466). Estuvo fuera del 29/08 al 03/09 (pm#197): la
  # suite corría en el gate pre-push local y `merge-pr.sh` aceptaba su atestación. Medido en la
  # tanda R2 del 02/09: ese gate es UN lock para toda la máquina, ~20 min por pasada, y cada
  # arreglo del revisor lo paga entero — 6 pasadas en serie fueron las 2 h de la tanda. Ahora el
  # gate local se queda solo con check + fmt + clippy (sin atestación) y la suite pesada corre AQUÍ,
  # en `ci-runner-1`, 4 PRs a la vez. Este check es el que autoriza el merge (`merge-pr.sh`).
  # Con su filtro de borradores en cada job que cuesta minutos: medido el 29/08, la mitad de los
  # minutos del runner se iban en runs cancelados por el re-push del revisor sobre PRs en borrador.
  # `ready_for_review` está en `types` porque el filtro se salta `opened`/`synchronize` del borrador.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `push` a develop/main sigue: es la red POST-MERGE de hub#572 (dos PRs verdes por separado
  # pueden romper develop juntas, y eso solo se ve sobre el árbol resultante).
  push:
    branches: [main, develop]
  workflow_dispatch:

# Per-ref group + cancel-in-progress. What that means per event:
# - push to develop: the group is the develop ref, so two merges in a row
#   cancel the first run and test the FINAL develop — the tree that matters —
#   instead of queueing ~20 min runs on the single serialized runner (hub#572).
# - pull_request: the group is the PR's own merge ref (refs/pull/N/merge), so
#   a run is only ever cancelled by a newer push to the SAME PR. Unchanged.
# - push to main: unchanged (per-ref, latest state wins).
concurrency:
  group: test-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test --workspace
    # Borrador = 0 minutos de CI (hub#1466; medido 29/08). El revisor lo pone listo con `gh pr ready`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Mismo interruptor que `build-hub.yml`: `CI_RUNNER_LABEL` o los runners de GitHub. Ojo: el
    # runner es UNA máquina, así que esta suite (la más larga) serializa con el build de la imagen.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 🔴 Este número NO es el presupuesto de la suite: es el BACKSTOP del job (hub#1519).
    # Un job que agota `timeout-minutes` lo marca GitHub como `cancelled`, indistinguible de una
    # cancelación por concurrencia o por un push más nuevo: no nombra un test, no señala una línea,
    # y `merge-pr.sh` lo lee como no-verde y se niega a mergear sin explicar por qué. Así murió el
    # run 33787341170 a los 40m20s, con la suite entera en verde y los doc-tests como última línea
    # del log: la cola bloqueada por un rojo que no era un rojo.
    #
    # Un PASO que agota SU `timeout-minutes` FALLA (el job queda en `failure`, no en `cancelled`),
    # así que el presupuesto vive ahora en cada paso caro, y este de aquí solo cubre lo que queda
    # FUERA de ellos (arranque del contenedor, checkout, caché). Por eso tiene que quedar
    # ESTRICTAMENTE por encima de la suma de los presupuestos de los pasos — si no, el hachazo mudo
    # del job vuelve a llegar primero. Lo fija `scripts/tests/test-hub-workflow.test.sh`.
    #
    # 70 medido, no elegido a ojo: las cinco pasadas verdes del 03/09 sobre este mismo runner
    # duraron 33m07s, 33m09s, 32m32s, 33m37s y 32m46s (jobs de los runs 33815145661, 33811810476,
    # 33811694999, 33802962820 y 33788925868). 70 deja >50% de margen sobre la peor. Mismo número
    # que `test-hub-modules.yml`, que ya lo usa.
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write   # open/refresh the develop-broken alert issue (hub#572)

    services:
      postgres:
        # pgvector, NO `postgres:18` a secas: `crates/vector/tests/pg_store.rs` hace
        # `CREATE EXTENSION vector` (ADR-0282) y sobre la imagen de stock sus 9 tests mueren con
        #   type "public.vector" does not exist
        # Eso tuvo `main` en ROJO 7 runs seguidos el 2026-08-09, desde que esos tests llegaron ahí.
        #
        # ⚠️ El gate local (`.githooks/pre-push`) tenía el MISMO defecto y se arregló en hub#647 —
        # pero solo esa mitad. Son dos Postgres distintos para la misma suite: si uno cambia de
        # imagen, el otro también. Cambiar solo uno es lo que produjo esta ventana.
        #
        # Mismo major (18) → el data dir es compatible; la extensión queda solo DISPONIBLE y los
        # tests la siguen creando ellos.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hub_test
        # DYNAMIC host port (hub#898): the org's twin runners (`ci-runner-1`/`ci-runner-1b`,
        # identical labels) live on the SAME machine. With a pinned host port (`5433:5432`),
        # whenever two test-hub jobs overlapped the second one could not bind 5433 and died in
        # ~9 s with "Docker start fail with exit code 1" — a message that only shows up in the
        # check-run ANNOTATIONS, not in the log. Publishing only the container port lets Docker
        # pick a free host port per job.
        #
        # ⚠️ The job context (`job.services.postgres.ports['5432']`) reports the port assigned
        # at container START and is FROZEN afterwards — and the lock-limits step below does a
        # `docker restart`, which REBINDS the ephemeral port to a new value (proven in run
        # 31660118661: context said 32768, tests got Connection refused there). The one source
        # of truth for later steps is `docker port` AFTER that restart; the lock-limits step
        # resolves it and exports DATABASE_URL to $GITHUB_ENV.
        #
        # ⚠️ Two Postgres for the same suite (hub#647): this CI service AND the local pre-push
        # gate (`.githooks/pre-push`), which keeps its own pinned localhost:5433 in a separate
        # file. Only the CI side is dynamic — only CI shares one host between concurrent jobs.
        # If one changes image, the other must too (that drift already broke `main` once).
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # DATABASE_URL is NOT set here on purpose: the Postgres host port is dynamic (hub#898)
      # and only known for sure AFTER the lock-limits step restarts the container (the restart
      # rebinds the ephemeral port). That step resolves the real port with `docker port` and
      # exports DATABASE_URL to $GITHUB_ENV for the test steps.
      # A thin `target/` (infra#294): the runner builds this suite in six slots at once on a 301 GB
      # disk, one `target/` each. 91 % of a target is the ~318 linked test executables, and with
      # the old `RUSTFLAGS=-C debuginfo=0` each one still carried std's precompiled DWARF, the
      # DWARF of the C libraries `cc` builds with `-g` (it follows the PROFILE, not RUSTFLAGS) and
      # a symbol table only a printed backtrace reads — CI never sets `RUST_BACKTRACE`. A panic
      # still names its `file:line:col` (`Location`, in `.rodata`). Measured on Linux with this
      # job's clippy + test build: 35.5 GB → 14.9 GB (38 GB → ~16 GB on the runner), so six fit.
      # Profile env, not rustflags: the `test` profile inherits `dev`, and local builds keep their
      # debuginfo. Need a symbolised backtrace from CI? Set `CARGO_PROFILE_DEV_STRIP: none` and
      # `RUST_BACKTRACE: 1` on that run. Guarded by `scripts/tests/test-hub-workflow.test.sh` §6.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_TERM_COLOR: always

    steps:
      # Sin `fetch-depth`: el default (1 commit) basta. Los dos commits que se pedían aquí eran
      # para el `git diff HEAD^1 HEAD` del paso de alcance, y ese paso se fue con hub#1463 — nada
      # más en este workflow lee historia.
      - name: Checkout
        uses: actions/checkout@v4

      # Contrato del cableado de lints (hub#1242): que la tabla `[workspace.lints]` exista, que
      # TODOS los miembros la hereden y que el paso de clippy de más abajo siga aquí y antes de la
      # suite. Es bash puro y tarda milisegundos, así que va lo primero: un cable suelto no debe
      # esperar 20 min detrás de los tests para notarse.
      - name: Contrato del gate de lints (hub#1242)
        run: bash scripts/tests/clippy-lints.test.sh

      # Contrato del alcance (hub#1207): el resolutor que decide qué paquetes corre una pasada
      # existe y respeta las reglas (dependientes, transversal, no reclamado). Quien lo CONSUME es
      # el gate pre-push; aquí ya no se acota nada (hub#1463), y la batería incluye los casos que
      # lo fijan. Se ejecuta desde este workflow porque una batería que no invoca nadie no deja
      # rojo en ningún sitio (hub#1392). Mismo motivo que arriba: va antes de la suite.
      - name: Contrato del alcance de la suite (scripts/ci/test-scope.py)
        run: bash scripts/tests/test-scope.test.sh
      - name: Contrato de test-hub.yml (scripts/tests/test-hub-workflow.test.sh)
        run: bash scripts/tests/test-hub-workflow.test.sh

      # Contrato del suelo de bash (hub#1468): que TODOS los scripts del repo —los de
      # `scripts/`, y el hook `pre-push`— sigan parseando con el bash más viejo de la máquina.
      # Este runner es Ubuntu con bash 5, así que aquí la comprobación es la genérica; la de
      # verdad (bash 3.2, el de macOS) la hace el gate pre-push, que corre donde vive la flota.
      # Aun así este paso corre AQUÍ porque una batería que no invoca nadie no deja rojo en
      # ningún sitio (hub#1392) y porque su control portable —un error de sintaxis normal—
      # prueba en cualquier máquina que el checker no está vacío. Bash puro, milisegundos.
      - name: Contrato del suelo de bash (hub#1468)
        run: bash scripts/tests/shell-syntax.test.sh

      # Contrato de publicación de los SDK (hub#1236): que `@erplora/module-sdk` siga siendo
      # publicable, que `erplora-guest-sdk` siga resolviendo en un clon por git tag y que
      # `scripts/stamp-version.sh` escriba de verdad el número en los TRES ficheros que lo llevan.
      # Corre AQUÍ, en cada PR, y no solo en `build-hub.yml`: ese workflow no se dispara en una PR,
      # así que un cambio que rompiera la publicación no daría rojo hasta el día de la release —
      # cuando ya no hay a quién preguntarle. Bash + python3 puros, milisegundos.
      - name: Contrato de publicación de los SDK (hub#1236)
        run: bash scripts/tests/publish-sdks.test.sh

      # 🔴 Este job resuelve los módulos por la ruta RELATIVA al checkout
      # (`crates/runtime/../../../modules-workspace/modules`), que cae FUERA del workspace y
      # PERSISTE entre jobs del runner. Cualquier cosa que otro job deje ahí cambia lo que este
      # ejecuta: si aparece un catálogo, `installer::every_published_manifest_*` deja de saltarse
      # y mide contra lo que haya.
      #
      # Ya pasó (hub#1216): la primera versión de `test-hub-modules.yml` clonó ahí 13 de los ~27
      # módulos y los dejó, y `develop` y `main` se pusieron ROJOS con
      # «expected the published catalogue (~25 modules), only 13 checked» — un fallo que no tenía
      # NADA que ver con el diff de quien empujaba. Aquel job ya clona en `$RUNNER_TEMP`, pero esta
      # defensa se queda: este job no puede depender de la higiene de sus vecinos, y sin ella el
      # runner envenenado no se cura solo.
      - name: Quitar restos de `modules-workspace` en el runner (hub#1216)
        run: |
          STRAY="$GITHUB_WORKSPACE/../modules-workspace"
          if [ -e "$STRAY" ]; then
            # `modules-workspace/modules/<mod>/module.json` → profundidad 3 desde $STRAY.
            # La primera versión contaba a profundidad 2 y por eso dijo «0 módulos» borrando 13:
            # un contador que no puede ver el positivo no sirve para diagnosticar nada.
            n=$(find "$STRAY" -mindepth 3 -maxdepth 3 -name module.json 2>/dev/null | wc -l | tr -d ' ')
            echo "::warning::restos de modules-workspace en el runner (${n} módulos) — se borran."
            rm -rf "$STRAY"
          fi

      # Libera ~25-30 GB de imágenes/toolchains preinstalados que no usamos, para que el link del
      # workspace no se quede sin disco (SIGBUS/ENOSPC en `ld` durante los binarios de test).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      # El contenedor de servicio nace con la configuración de fábrica de Postgres
      # (`max_locks_per_transaction = 64`, `max_connections = 100`), o sea un techo GLOBAL de
      # 6.400 cerrojos — la tabla se dimensiona `max_locks × (max_connections + prepared)`, no
      # por transacción. La suite del hub crea un ESQUEMA EFÍMERO POR TEST con todas las tablas
      # de sistema dentro, así que ese techo se agota y revienta **quien pase por ahí**: fallan
      # tests distintos en cada corrida y ninguno guarda relación con el diff (hub#526).
      #
      # Así tumbó `main` en 8f54663 un único `permission_is_enforced` con
      # `53200 out of shared memory` — con el resto del workspace en verde.
      #
      # Se cambia EN SITIO en vez de recrear el contenedor: los servicios de Actions no admiten
      # pasarle argumentos al comando del contenedor, y estos tres ajustes necesitan reinicio.
      - name: Raise Postgres lock limits (hub#526) + export dynamic port (hub#898)
        run: |
          # Find the container by the HOST PORT this same workflow published — dynamic since
          # hub#898, read from the job context, which is accurate HERE (before the restart
          # below) and never hardcoded again. It used to be
          # `--filter ancestor=postgres:18`, and when the service above moved to
          # `pgvector/pgvector:pg18` the filter stopped matching: `docker ps` came back empty,
          # `docker exec ""` failed with "invalid container name or ID" and the job died with
          # exit 1 **before running a single test**. `main` stayed like that for 10 straight
          # runs, ~11 h, unnoticed — the failure looks nothing like a broken test.
          #
          # The irony: the service comment, 50 lines up, warns about this exact class of
          # failure ("if one changes image, the other must too")… and was written in the same
          # change that left this filter untouched.
          #
          # The port stays coupled to this file on purpose: it comes from the service's `ports`
          # mapping via the expression below. The image name never appears here.
          PG_PORT="${{ job.services.postgres.ports['5432'] }}"
          PG=$(docker ps --filter "publish=${PG_PORT}" --format '{{.ID}}' | head -1)
          if [ -z "$PG" ]; then
            echo "::error::no Postgres container found publishing host port ${PG_PORT}."
            echo "Containers currently running:"
            docker ps --format '  {{.ID}}  {{.Image}}  {{.Ports}}'
            exit 1
          fi
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 4096;"
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300;"
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET shared_buffers = '512MB';"
          docker restart "$PG"
          for i in $(seq 1 30); do
            docker exec "$PG" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          echo "lock ceiling now:"
          docker exec "$PG" psql -U postgres -tAc \
            "SELECT current_setting('max_locks_per_transaction')::int * (current_setting('max_connections')::int + current_setting('max_prepared_transactions')::int);"

          # ⚠️ The restart above REBINDS the ephemeral host port: the value the job context
          # reported at container start is stale from here on (run 31660118661: context said
          # 32768, Postgres came back on a different port, 16 tests died with Connection
          # refused in 0.03 s — while every in-container check above kept passing, because
          # `docker exec` never crosses the host port). Ask Docker for the CURRENT binding and
          # only export the DSN once a real TCP connect from the host proves it.
          HOST_PORT=$(docker port "$PG" 5432/tcp | head -1 | sed 's/.*://')
          if [ -z "$HOST_PORT" ]; then
            echo "::error::docker port returned no host binding for 5432/tcp on ${PG}."
            docker port "$PG" || true
            exit 1
          fi
          echo "Postgres host port after restart: ${HOST_PORT} (was ${PG_PORT} at container start)"
          ok=""
          for i in $(seq 1 15); do
            if timeout 2 bash -c "exec 3<>/dev/tcp/localhost/${HOST_PORT}" 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Postgres is not reachable from the host on localhost:${HOST_PORT} after restart."
            docker ps --format '  {{.ID}}  {{.Image}}  {{.Ports}}'
            exit 1
          fi
          # Same DSN shape as the `erplora_db::testutil` default — only the port varies.
          echo "DATABASE_URL=postgres://postgres:test@localhost:${HOST_PORT}/hub_test" >> "$GITHUB_ENV"

      # `rustup` viene de serie en la imagen de GitHub, pero en `ci-runner-1` es un fichero más
      # que algo puede borrar — y algo lo borró (ver el `cache-bin: false` de abajo).
      - name: Toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup ausente en este runner — instalándolo (no toca ni el PATH ni los toolchains)"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show

      # 🔴 `cache-bin: false`: el paso `Post` de esta acción limpia `$CARGO_HOME/bin` y se lleva
      # por delante el binario `rustup` del runner propio, rompiendo el job SIGUIENTE con
      # `rustup: command not found`. Explicación larga en `test-shell.yml`.
      #
      # 🔴 `save-if` off on our own runner: the same `Post` also `rmRF`s `~/.cargo/registry/src`
      # (`cleanRegistry`), and the two slots of `ci-runner-1` share ONE `$HOME` — so it deletes
      # the sources the job on the other slot is compiling from. That is what killed the Android
      # release build of v1.1.1 (hub#886); this workflow reaches the same registry, so it carries
      # the same guard. Long version in `test-shell.yml`.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      # Third-party handler contract (hub#2115): `scripts/package-guest-sdk.sh` emits the
      # guest-sdk as a self-contained crate, and a minimal vendor handler builds to wasm32
      # against it in a directory OUTSIDE this checkout. Here, after the toolchain step, because
      # it needs cargo and the wasm32 target; it compiles ~10 small crates (seconds, cached in
      # `target/guest-sdk-standalone`).
      - name: Contrato del handler de terceros (hub#2115)
        run: bash scripts/tests/guest-sdk-standalone.test.sh

      # `--exclude erplora-tauri`: el shell de escritorio (ADR-0159) arrastra tauri/wry → GTK/
      # webkit2gtk, system-libs que este runner no tiene y que inflarían el target (el disco ya
      # iba justo: ver "Free disk space"). Sus tests corren en `test-shell.yml`, que instala las
      # deps GTK y se dispara SOLO cuando cambia el shell o el plugin (filtro por paths).
      #
      # `--exclude tauri-plugin-erplora-android`: mismo motivo — depende de `tauri`, así que
      # también arrastra GTK en Linux. Su valor real son los tests KOTLIN (`testDebugUnitTest`),
      # que es donde vive la lógica; la parte Rust es el registro del plugin.
      # ── clippy (hub#1242) ────────────────────────────────────────────────────────────────
      # Antes de la suite A PROPÓSITO: un error de lint es instantáneo y la suite tarda ~20 min;
      # detrás de ella el aviso llega cuando ya no lo mira nadie.
      #
      # Los NIVELES no están aquí: los manda `[workspace.lints]` del `Cargo.toml` raíz, que es
      # donde está documentado el ratchet y donde se promociona un grupo. Por eso este paso NO
      # lleva `-D warnings`: ese flag pasaría por encima de la tabla y convertiría en error los
      # grupos que hoy siguen sucios (58 `suspicious`, 129 entre style/complexity/perf) más los 30
      # avisos propios de rustc — o sea, entregaría el gate rojo el primer día. `correctness`
      # está en `deny` en la tabla y eso ya es un error de compilación: este paso falla con él.
      #
      # `--all-targets`: los tests son donde más código nuevo entra; sin esto no se miran.
      #
      # Mismas exclusiones que el paso de tests, y por el mismo motivo: `erplora-tauri` y el
      # plugin Android arrastran tauri/wry → GTK/webkit2gtk, system-libs que este runner no
      # tiene. Ambos SÍ heredan la tabla de lints; quien los linta es `test-shell.yml`.
      #
      # `--no-deps`: linta el workspace, no las ~600 cajas de terceros (sus avisos no los
      # arreglamos y solo ensucian el log).
      #
      # Presupuesto propio (hub#1519): medido en 2m33s el 03/09, 8 min es 3× ese reloj. El
      # `timeout` de shell salta un minuto ANTES que el del paso para poder decir en voz alta que
      # lo que se agotó fue el TIEMPO y no un lint — el `timeout-minutes` de abajo es la red por si
      # el propio `timeout` no llegara a arrancar.
      - name: cargo clippy --workspace
        id: clippy
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # 🔴 `set +e` NO sobra: Actions corre este bloque como `bash -e {0}` (este workflow no
          # fija `shell:`) y `set -uo pipefail` NO apaga ese `-e`. Sin esta línea, el `timeout` al
          # saltar abortaría el bloque en la línea de abajo y ni el `rc=$?`, ni el `overrun=true`,
          # ni el `::error::` llegarían a ejecutarse: el paso saldría rojo MUDO, que es justo lo que
          # hub#1519 viene a quitar. Lo fija `scripts/tests/test-hub-workflow.test.sh`.
          set +e
          timeout 7m cargo clippy --workspace --all-targets --no-deps \
            --exclude erplora-tauri --exclude tauri-plugin-erplora-android
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "overrun=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Presupuesto de tiempo agotado (clippy)::clippy pasó de 7 min. NO es un lint roto: es el reloj (hub#1519)."
          fi
          exit "$rc"

      # `--lib --bins --tests` = todo lo que EJECUTA menos los doc-tests, que se van al paso de
      # abajo (hub#1519). El workspace no tiene ni un target `example`, así que la selección
      # explícita no deja nada fuera respecto al `cargo test` pelado que había aquí.
      #
      # El presupuesto de 50 min sale del reloj real: este paso midió 29m49s el 03/09 (run
      # 33811810476). El `timeout` de shell es el que manda porque es el único que puede EXPLICARSE:
      # devuelve 124, y con eso el paso muere en rojo diciendo que se acabó el tiempo, en vez de
      # dejar el `cancelled` mudo que bloqueaba la cola.
      - name: cargo test --workspace (sin doc-tests)
        id: tests
        timeout-minutes: 50
        run: |
          set -uo pipefail
          # `set +e` por lo mismo que en `clippy`: bajo el `bash -e` de Actions, el `timeout` al
          # saltar abortaría aquí y el mensaje de abajo no se imprimiría nunca.
          set +e
          timeout 48m cargo test --workspace --lib --bins --tests \
            --exclude erplora-tauri --exclude tauri-plugin-erplora-android
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "overrun=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Presupuesto de tiempo agotado (suite)::La suite pasó de 48 min. NO hay ningún test roto: se acabó el presupuesto (hub#1519). Antes de re-lanzar, mira cuántos jobs comparten el runner."
          fi
          exit "$rc"

      # Los doc-tests, en su propio paso y CONTADOS (hub#1519). Eran la última línea del log cuando
      # cayó el hachazo del run 33787341170 y nada lo dijo; aquí un exceso de tiempo se lee como lo
      # que es, y su resultado no queda escondido detrás de los 30 min de la suite.
      #
      # Se cuentan porque un paso de doc-tests que no ejecuta NINGUNO sale tan verde como uno que
      # los pasa — el verde vacío que este repo ya se comió en hub#1216. Hoy son 4 (los de
      # `erplora_guest_sdk`, medidos en el run 33811810476); si la selección de targets deja de
      # coger nada, esto se pone rojo en vez de mentir.
      - name: cargo test --doc (doc-tests, contados)
        id: doctests
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # `set +e` por lo mismo que en `clippy`: bajo el `bash -e` de Actions, el `timeout` al
          # saltar abortaría aquí y el mensaje de abajo no se imprimiría nunca.
          set +e
          log="$RUNNER_TEMP/doctests.log"
          timeout 7m cargo test --workspace --doc \
            --exclude erplora-tauri --exclude tauri-plugin-erplora-android 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "overrun=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Presupuesto de tiempo agotado (doc-tests)::Los doc-tests pasaron de 7 min. NO es un test roto: es el reloj (hub#1519)."
            exit "$rc"
          fi
          total=$(sed 's/\x1b\[[0-9;]*m//g' "$log" \
                    | awk '/^test result: ok\./ { s += $4 } END { print s+0 }')
          echo "doc-tests ejecutados: ${total}"
          if [ "$rc" -eq 0 ] && [ "$total" -eq 0 ]; then
            echo "::error title=Doc-tests vacíos::cargo test --doc salió verde sin ejecutar un solo doc-test (hub#1519): la selección de targets dejó de coger nada."
            exit 1
          fi
          exit "$rc"

      # When the POST-MERGE run on develop goes red (hub#572), make it loud:
      # open (or refresh, idempotently — one open issue, never one per run) an
      # alert issue, same pattern as image-freshness.yml (hub#652) — native
      # Actions notifications demonstrably reached nobody there; an issue
      # notifies watchers and lands on the board. Gated on the TEST step's own
      # outcome so an environmental failure (disk, service container) does not
      # fake a "develop is broken" verdict; a run cancelled by a newer merge
      # never triggers it (`failure()` excludes cancellation).
      #
      # Desde hub#1519 mira los DOS pasos de la suite (se partió en tests + doc-tests: un doc-test
      # roto en develop tiene que abrir la alerta igual) y descarta explícitamente el exceso de
      # presupuesto: un `timeout` deja el paso en `failure` igual que un test roto, y decir
      # «develop está roto» porque el runner iba lento es exactamente el veredicto falso que este
      # `if:` lleva desde el principio evitando.
      - name: Open or refresh the develop-broken alert issue (hub#572)
        if: >-
          failure() && github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
          (steps.tests.outcome == 'failure' || steps.doctests.outcome == 'failure') &&
          steps.tests.outputs.overrun != 'true' && steps.doctests.outputs.overrun != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          body="Detected by the post-merge suite on develop (hub#572).

          - develop HEAD: \`${SHA}\` — '${subject}'
          - failed run: ${RUN_URL}

          Two individually-green PRs can break develop when combined: the clash is semantic, not textual, so neither PR's gate could see it — each ran the suite against the develop of ITS moment. This run is the first that saw them together, so the culprit is the INTERACTION of this merge with what develop already had, not necessarily this merge's own diff.

          Until develop is green again, every local pre-push gate fails with an error unrelated to the pusher's diff, and a develop→main batch would promote the breakage. Fix forward on develop (hub#572 is the class; the original case was fixed in hub#547).

          This issue is reused (one comment per detection) while develop stays red; close it once develop is green again."

          # scripts/ci/alert-issue.sh lists and matches LOCALLY, never `--search` (hub#1246):
          # that reads GitHub's search index, which lags behind reality. MATCH=prefix because
          # the title's `: <subject>` suffix changes on every commit — only the stable part
          # before it is the idempotency key (a colon in the suffix is exactly what broke
          # `--search`, which reads `:` as search syntax; `startswith()` does not care).
          TITLE="develop is broken after a merge: ${subject}" \
            MATCH=prefix MATCH_VALUE="develop is broken after a merge" \
            LABEL=area:ci-cd BODY="$body" \
            ./scripts/ci/alert-issue.sh

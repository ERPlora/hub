# ==============================================================================
# ERPlora Hub (Rust) — Build & Push image to GHCR  (ghcr.io/erplora/hub:latest)
# ==============================================================================
#
# Construye la imagen del runtime del Hub (docker/Dockerfile: pnpm build del shell web +
# cargo release de erplora-server → debian-slim) y la publica en el GitHub Container
# Registry (GHCR). Sustituye a ECR (AWS apagado, migración a Hetzner/Dokploy).
#
# Tags publicados (repo GHCR `ghcr.io/erplora/hub`, PRIVADO):
#   - ghcr.io/erplora/hub:latest      (tag móvil que consumen los HUBS REALES: el provisioning
#                                      del Cloud/Dokploy registra el servicio con `…/hub:latest`).
#                                      ESTE es el tag canónico — sin él no se puede hacer pull.
#                                      SOLO se mueve desde `main` o un tag `v*` (hub#872).
#   - ghcr.io/erplora/hub:<git-sha>   (tag inmutable por commit, para pin/rollback)
#   - ghcr.io/erplora/hub:<semver>    (solo en tag v*: :1.2.3 inmutable + :1.2 y :1 móviles,
#                                      para poder decir "la última 1.x" y distinguir un parche de
#                                      seguridad de una versión nueva — hub#515, ADR-0269)
#
# Pipeline:
#   push a main       ─► build ─► push GHCR (:latest + :<sha>)
#   tag v*            ─► build ─► push GHCR (:latest + :<sha> + :<semver>)  + reescribe Cargo
#   workflow_dispatch ─► build ─► push GHCR (manual). Desde `main`/`v*` etiqueta como arriba;
#                        desde CUALQUIER otra rama publica SOLO `:<sha>` (hub#872): un build
#                        manual de `develop` no debe mover `:latest` — cambiaría el código de
#                        TODA la flota. El `:<sha>` inmutable sirve para probar esa imagen en
#                        UN hub concreto repuntando su servicio.
#
# Auth: `GITHUB_TOKEN` del propio workflow (permiso `packages: write`). No hacen falta claves
# estáticas ni OIDC de AWS. El paquete queda PRIVADO por defecto; para que Dokploy/provisioning
# haga pull necesita un PAT con `read:packages` (o dar acceso al paquete a esas cajas).
# ==============================================================================

name: Build Hub Image (latest)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# En `main` cada push debe PUBLICAR su imagen (16-19 min de build). Como la flota mergea cada
# ~10 min, `cancel-in-progress: true` cancelaba el build anterior antes de terminar → cero
# imágenes publicadas (hub#265). En `main` se deja correr hasta el final para no perder la
# publicación; el resto de ramas sí se cancelan para ahorrar minutos.
concurrency:
  group: build-hub-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push erplora/hub
    # Dónde corre: lo decide la Variable `CI_RUNNER_LABEL`, y sin ella se queda en los runners de
    # GitHub como siempre. El 2026-08-11 la org agotó el presupuesto de Actions y los jobs dejaron
    # de ARRANCAR — `The job was not started because an Actions budget is preventing further use`,
    # que desde la PR no se distingue de un fallo de build. Con la imagen sin construir no hay nada
    # que rodar a la flota. `ci-runner-1` (Hetzner, dedicado) sale de ese presupuesto.
    # Un interruptor y no un valor fijo porque el runner es UNA máquina: si se cae o se recicla,
    # borrar la Variable devuelve la CI a GitHub sin tocar ningún workflow.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push a GHCR con GITHUB_TOKEN

    env:
      # Nombre del paquete GHCR. Minúsculas obligatorio. Default: ghcr.io/<owner>/hub.
      IMAGE: ghcr.io/${{ github.repository_owner }}/hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El propio guardarraíl tiene tests, y corren aquí: ~2 s, y esto es el único camino a
      # producción de la imagen. Un guardarraíl sin probar es una creencia.
      - name: Contrato del guardarraíl de versión
        run: ./scripts/tests/image-tags.test.sh

      # 🔴 LO PRIMERO tras el login, y ANTES de estampar o compilar.
      #
      # El MISMO tag `v*` dispara también `tauri-release.yml`, que publica la app en **Microsoft
      # Store y Google Play**, donde las versiones son monótonas e IRREVERSIBLES: no se republica
      # ni se retira. Un `git tag v1.2.4` mal escrito no «etiqueta mal una imagen» — quema ese
      # número para siempre. Esta guarda es lo único que se interpone.
      #
      # Rechaza: tag que no es semver · versión YA publicada · versión MENOR o igual que la última ·
      # registro ilegible (refuse-by-default; override `IMAGE_TAGS_ALLOW_UNVERIFIED=1`).
      #
      # Devuelve `version` y `tags` — sustituye a los pasos «Compute image tags» y «Compute app
      # version», que calculaban lo mismo en bash inline y sin probar.
      - name: Guarda de versión (semver · no publicada · monótona)
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/image-tags.sh \
            --image "${IMAGE}" --ref "${GITHUB_REF}" --sha "${GITHUB_SHA}"

      # En un tag `v*`, lo que el runtime reporta (`env!("CARGO_PKG_VERSION")` → `/system`,
      # el latido, `error_sink`) debe ser la versión del TAG, no el «en desarrollo» del commit.
      # Va DESPUÉS de la guarda: no se reescribe nada por un tag que se va a rechazar.
      - name: Estampar la versión en Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          V: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          v = os.environ["V"]
          p = pathlib.Path("Cargo.toml")
          s = p.read_text()
          s2 = re.sub(r'(\[workspace\.package\][^\[]*?version\s*=\s*)"[^"]*"',
                      rf'\1"{v}"', s, count=1, flags=re.DOTALL)
          if s == s2:
              raise SystemExit("no se encontró [workspace.package].version para estampar")
          p.write_text(s2)
          print(f'Cargo.toml [workspace.package].version = "{v}"')
          PY

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # UN SOLO `build-args`: son claves de un mapa YAML, así que declararlo dos veces
          # invalida el workflow entero (Actions lo rechaza al procesarlo: 0 jobs, 0 s, sin
          # minutos facturados) y ningún build llega a ejecutarse.
          #
          # OUTFITKIT_CACHEBUST único por run → invalida la capa `pnpm add @erplora/outfitkit@latest`
          # del Dockerfile en CADA build, forzando que la imagen coja SIEMPRE la última OutfitKit
          # publicada (el tag npm `latest` lo mueve la GH action de release de outfitkit).
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            OUTFITKIT_CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Un único manifest por build (sin índice OCI ni attestation-manifest sin tag), para que
          # `:latest` no quede como referencia colgante si una retention policy expira sub-manifests.
          provenance: false
          sbom: false

      # Prints the tags the guard actually computed: after hub#872 a dispatch from a
      # non-main branch publishes only `:<sha>`, so hardcoding `:latest` here would lie.
      - name: Output image URIs
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "Imagen publicada (GHCR, privada):"
          printf '%s\n' "$TAGS" | sed 's/^/  /'
          echo ""
          echo "(:latest = hubs reales — solo se mueve desde main o un tag v*, hub#872)"
          echo "Para pull desde Dokploy/provisioning: PAT con read:packages, o dar acceso al paquete."

# ==============================================================================
# Pendiente (requiere credenciales/acceso reales que hoy solo tiene Ioan, no una decisión de diseño):
#   - El provisioning del Cloud/Dokploy debe apuntar la task/servicio del hub a
#     `ghcr.io/erplora/hub:latest` (antes era el URI de ECR) y hacer login en GHCR con un PAT
#     `read:packages` (el paquete es PRIVADO). Alternativa: hacer el paquete público.
# ==============================================================================

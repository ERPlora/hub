# ==============================================================================
# ERPlora Hub (Rust) — Build & Push image to GHCR  (ghcr.io/erplora/hub:latest)
# ==============================================================================
#
# Construye la imagen del runtime del Hub (docker/Dockerfile: pnpm build del shell web +
# cargo release de erplora-server → debian-slim) y la publica en el GitHub Container
# Registry (GHCR). Sustituye a ECR (AWS apagado, migración a Hetzner/Dokploy).
#
# Canales de imagen (repo GHCR `ghcr.io/erplora/hub`, PRIVADO) — hub#1170, decisión 2026-08-25.
# Todos llevan además `:<git-sha>` (inmutable por commit, para pin/rollback). La lógica y sus tests
# de contrato viven en `scripts/image-tags.sh` + `scripts/tests/image-tags.test.sh`:
#
#   - `stable` = `latest`   tag `vX.Y.Z` final → :X.Y.Z (inmutable) :X.Y :X :latest :stable.
#                            `latest` es el tag que el provisioning registra en TODO hub real y el
#                            que estrena un hub nuevo; `stable` es su alias (mismo digest).
#   - `canary`              tag `vX.Y.Z-rc.N` → :X.Y.Z-rc.N (inmutable) + :canary. La candidata que
#                            el SaaS promueve a un SUBCONJUNTO de hubs de prod. NO mueve :latest.
#   - `dev`                 push a `develop` (o `workflow_dispatch` desde develop) → :dev. Es lo que
#                            despliega PRE. La versión horneada es la prerelease
#                            `X.Y.Z-dev.<n>+g<sha>` (de `git describe --tags --long`), no el hueco
#                            del Cargo: servir `1.0.0` desde develop era el bug de hub#1170.
#   - `main`                push a `main` → :latest + :<sha>, como siempre (main = prod).
#   - otra rama             `workflow_dispatch` → SOLO :<sha> (hub#872): sirve para probar esa
#                            imagen en UN hub concreto sin cambiar el código de la flota.
#
# La versión (`steps.tags.outputs.version`) se estampa en Cargo.toml antes de compilar en todo canal
# salvo `main`, así `/readyz`, `/api/hub/context`, el latido y `error_sink` dicen el número con el
# que se llama la imagen.
#
# Auth: `GITHUB_TOKEN` del propio workflow (permiso `packages: write`). No hacen falta claves
# estáticas ni OIDC de AWS. El paquete queda PRIVADO por defecto; para que Dokploy/provisioning
# haga pull necesita un PAT con `read:packages` (o dar acceso al paquete a esas cajas).
# ==============================================================================

name: Build Hub Image (latest)

on:
  push:
    branches: [main, develop]
    tags: ['v*']   # vX.Y.Z (stable) y vX.Y.Z-rc.N (canary); el guard rechaza cualquier otra forma
  workflow_dispatch:

# En `main` cada push debe PUBLICAR su imagen (16-19 min de build). Como la flota mergea cada
# ~10 min, `cancel-in-progress: true` cancelaba el build anterior antes de terminar → cero
# imágenes publicadas (hub#265). En `main` se deja correr hasta el final para no perder la
# publicación; el resto de ramas sí se cancelan para ahorrar minutos. En `develop` eso es a
# propósito: `:dev` es un tag móvil y solo importa el ÚLTIMO commit (hub#1170).
concurrency:
  group: build-hub-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push erplora/hub
    # Dónde corre: lo decide la Variable `CI_RUNNER_LABEL`, y sin ella se queda en los runners de
    # GitHub como siempre. El 2026-08-11 la org agotó el presupuesto de Actions y los jobs dejaron
    # de ARRANCAR — `The job was not started because an Actions budget is preventing further use`,
    # que desde la PR no se distingue de un fallo de build. Con la imagen sin construir no hay nada
    # que rodar a la flota. `ci-runner-1` (Hetzner, dedicado) sale de ese presupuesto.
    # Un interruptor y no un valor fijo porque el runner es UNA máquina: si se cae o se recicla,
    # borrar la Variable devuelve la CI a GitHub sin tocar ningún workflow.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push a GHCR con GITHUB_TOKEN

    env:
      # Nombre del paquete GHCR. Minúsculas obligatorio. Default: ghcr.io/<owner>/hub.
      IMAGE: ghcr.io/${{ github.repository_owner }}/hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial y tags completos: la versión de `dev` sale de `git describe --tags --long`
          # (último tag `v*` alcanzable + nº de commits). Con el checkout superficial por defecto
          # no hay tags, y el guard se NIEGA a publicar antes que hornear el hueco del Cargo.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El propio guardarraíl tiene tests, y corren aquí: ~2 s, y esto es el único camino a
      # producción de la imagen. Un guardarraíl sin probar es una creencia.
      - name: Contrato del guardarraíl de versión
        run: ./scripts/tests/image-tags.test.sh

      # El otro guardarraíl del mismo número: que la versión del tag llegue a los TRES ficheros que
      # la llevan (Cargo.toml, el package.json del SDK y su `version.ts`) y que el paquete npm sea
      # publicable. ~1 s, y sin él una release estampa el binario y publica un SDK que dice otra
      # cosa — un desfase que solo se ve en el hub de un cliente (hub#1236).
      - name: Contrato de publicación de los SDK (hub#1236)
        run: bash ./scripts/tests/publish-sdks.test.sh

      # El otro lado del mismo paquete: el CABLEADO del job que lo publica (hub#1308) — permiso,
      # registro, scope, token, `--tag` y la ausencia de `continue-on-error`. `publish-sdks.test.sh`
      # comprueba que el paquete es publicable; este, que el job que lo publica sigue apuntando a
      # GitHub Packages y no al npmjs público. ~1 s.
      - name: Contrato del job publish-module-sdk (hub#1308)
        run: bash ./scripts/tests/publish-module-sdk-workflow.test.sh

      # 🔴 LO PRIMERO tras el login, y ANTES de estampar o compilar.
      #
      # El MISMO tag `v*` dispara también `tauri-release.yml`, que publica la app en **Microsoft
      # Store y Google Play**, donde las versiones son monótonas e IRREVERSIBLES: no se republica
      # ni se retira. Un `git tag v1.2.4` mal escrito no «etiqueta mal una imagen» — quema ese
      # número para siempre. Esta guarda es lo único que se interpone.
      #
      # Rechaza: tag que no es semver · versión YA publicada · versión MENOR o igual que la última ·
      # registro ilegible (refuse-by-default; override `IMAGE_TAGS_ALLOW_UNVERIFIED=1`).
      #
      # Devuelve `version`, `channel`, `stamp` y `tags` — sustituye a los pasos «Compute image
      # tags» y «Compute app version», que calculaban lo mismo en bash inline y sin probar.
      - name: Guarda de versión (semver · no publicada · monótona) y canal
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/image-tags.sh \
            --image "${IMAGE}" --ref "${GITHUB_REF}" --sha "${GITHUB_SHA}" \
            --describe "$(git describe --tags --long --match 'v*' 2>/dev/null || true)"

      # Lo que el runtime reporta (`env!("CARGO_PKG_VERSION")` → `/readyz`, `/api/hub/context`,
      # el latido, `error_sink`) debe ser la versión con la que se llama la imagen: la del TAG
      # (`X.Y.Z` o `X.Y.Z-rc.N`) o la prerelease de `develop` (`X.Y.Z-dev.<n>+g<sha>`), no el
      # «en desarrollo» del Cargo. `main` no se estampa (como siempre). Va DESPUÉS de la guarda:
      # no se reescribe nada por un tag que se va a rechazar.
      #
      # Desde hub#1236 el estampado NO es un `python3` inline sino `scripts/stamp-version.sh`, y
      # escribe los TRES ficheros que llevan el número: el `Cargo.toml` del workspace (de donde lo
      # heredan los 14 crates, `erplora-guest-sdk` incluido), el `package.json` del SDK y su
      # `src/version.ts` — lo único que un `dist/<id>.esm.js` YA COMPILADO puede imprimir sobre el
      # SDK contra el que se construyó. El job `publish-module-sdk` corre exactamente el mismo
      # script con el mismo número, así que imagen y paquete npm no pueden decir cosas distintas.
      #
      # La versión entra por `env:` y no interpolada en la línea de `run:`: un `${{ … }}` dentro
      # del shell se sustituye ANTES de que bash lo lea, así que un valor con metacaracteres
      # ejecutaría lo que llevase dentro. Es la misma forma que ya usaba el paso que sustituye.
      - name: Estampar la versión (Cargo.toml + SDK npm + SDK_VERSION)
        if: steps.tags.outputs.stamp == '1'
        env:
          V: ${{ steps.tags.outputs.version }}
        run: ./scripts/stamp-version.sh --version "$V"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # UN SOLO `build-args`: son claves de un mapa YAML, así que declararlo dos veces
          # invalida el workflow entero (Actions lo rechaza al procesarlo: 0 jobs, 0 s, sin
          # minutos facturados) y ningún build llega a ejecutarse.
          #
          # OUTFITKIT_CACHEBUST único por run → invalida la capa `pnpm add @erplora/outfitkit@latest`
          # del Dockerfile en CADA build, forzando que la imagen coja SIEMPRE la última OutfitKit
          # publicada (el tag npm `latest` lo mueve la GH action de release de outfitkit).
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            OUTFITKIT_CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Un único manifest por build (sin índice OCI ni attestation-manifest sin tag), para que
          # `:latest` no quede como referencia colgante si una retention policy expira sub-manifests.
          provenance: false
          sbom: false

      # Prints the tags the guard actually computed: the channel decides them (hub#1170), so
      # hardcoding `:latest` here would lie.
      - name: Output image URIs
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          CHANNEL: ${{ steps.tags.outputs.channel }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          echo "Imagen publicada (GHCR, privada) — canal: $CHANNEL · versión servida: $VERSION"
          printf '%s\n' "$TAGS" | sed 's/^/  /'
          echo ""
          echo "(:latest/:stable = hubs reales, solo desde main o un tag vX.Y.Z · :canary = tag rc · :dev = develop → pre)"
          echo "Para pull desde Dokploy/provisioning: PAT con read:packages, o dar acceso al paquete."

  # ── ¿Sabe el toolkit qué flota acaba de salir? (ERPlora/module-toolkit#226) ────────────────
  #
  # `module-toolkit` lleva `HUB_OUTFITKIT`: una fila por tag de release con el OutfitKit que carga
  # esa imagen, y `erplora validate` mide contra ella las pantallas de los 27 módulos. La fila solo
  # se puede escribir DESPUÉS de crear el tag, así que publicar es exactamente lo que la deja
  # obsoleta — y lo que sale entonces no es un fallo sino un aviso que no bloquea: la comprobación
  # deja de hacerse y no se entera nadie. Medido el 07/09, con `v1.1.16` ya publicado:
  #
  #     ✖ the NEWEST hub tag is in HUB_OUTFITKIT: publishing the hub adds its row (#201)
  #     ℹ tests 20 · pass 19 · fail 1
  #
  # Esa afirmación ya existía y ya era correcta. Lo que no tenía era dónde correr: en la CI del
  # toolkit se SALTA —los tags son refs y allí el hub llega como TARBALL de action, sin `.git`— y
  # `canonical-mirrors.yml` solo dispara por su filtro de `paths`, que crear un tag no toca. Entre
  # publicar la release y la siguiente PR que roce una ruta espejada, la alarma no sonaba en ningún
  # sitio. `build-hub.yml` es el único que corre con `v*`, y ya hace checkout con `fetch-tags: true`,
  # que es justo lo que el espejo de tags necesita para existir.
  #
  # 🔴 POR QUÉ NO REUSA `canonical-mirrors.yml`. Ese workflow no publica su propio veredicto: lo
  # reescribe `scripts/canonical-mirrors-verdict.sh` (hub#1296), que degrada el fallo de la action
  # a AVISO en cuanto alguna copia vendorizada va por detrás. Correcto para una PR de contrato —la
  # copia vive en otro repo y no puede ir por delante—, y ruinoso aquí: el día que el toolkit vaya
  # rezagado (que es su estado normal durante horas), esa degradación se tragaría TAMBIÉN la fila
  # que falta y volveríamos al fallo mudo que este job viene a cerrar. En una release no hay PR de
  # contrato en vuelo, así que el reparto de hub#1296 no aplica: aquí la comparación se lee cruda.
  #
  # 🔴 Y NO BLOQUEA LA RELEASE: sin `needs`, corre en paralelo a `build-and-push` y nadie lo espera.
  # Retener una imagen que la flota aguarda porque la tabla de OTRO repo va por detrás sería la
  # forma más rápida de que este job acabe borrado. Rojo = señal, no puerta.
  canonical-mirrors:
    name: la tabla del toolkit conoce este tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # `fetch-tags` es la precondición del espejo, no un detalle: los tags son refs, y sin ellos
      # `hubTags` se salta el caso —honestamente, pero se lo salta— y el job saldría verde sin
      # haber comparado nada.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Sin `with: token`: la action se resuelve por el Actions-sharing de module-toolkit con la
      # organización. Si eso desapareciera, este paso falla en ROJO en vez de degradar a verde.
      - uses: ERPlora/module-toolkit/.github/actions/check-canonical-mirrors@main
        with:
          hub-dir: ${{ github.workspace }}

  # ============================================================================
  # `@erplora/module-sdk` → GitHub Packages, en cada tag `v*` (hub#1236)
  # ============================================================================
  #
  # QUÉ ARREGLA. El paquete era `private: true, version "0.0.0"` y los 24 repos de módulo lo
  # declaraban `workspace:*`. Un `dist/<id>.esm.js` publicado no tenía forma de decir contra qué
  # SDK se compiló: la respuesta honesta era «contra el checkout del hub que tuviera el
  # desarrollador». Publicarlo con la versión del tag le pone NOMBRE a ese número.
  #
  # 🔴 QUÉ **NO** ARREGLA, y hay que decirlo aquí para que nadie lo dé por hecho: esto NO cambia
  # por dónde instalan el SDK los 26 repos de módulo en CI. GitHub Packages exige credencial
  # también para LEER un paquete de un repo privado, y en el plan Free los secretos de
  # organización no llegan a un repo privado. El camino de instalación sigue siendo la composite
  # action `ERPlora/hub/.github/actions/module-sdk` (hub#1097), que es lo único que GitHub resuelve
  # sin credencial. Lo que se gana aquí es la IDENTIDAD del SDK (versión publicada y verificable,
  # `npm view @erplora/module-sdk@X.Y.Z`) y el desarrollo local fuera del monorepo.
  #
  # `needs: build-and-push` a propósito: `scripts/image-tags.sh` es quien rechaza un tag que no es
  # semver, uno ya publicado o uno que retrocede. Una versión npm tampoco se despublica pasadas
  # 72 h, así que no se publica ninguna que esa guarda no haya aprobado antes.
  publish-module-sdk:
    name: Publicar @erplora/module-sdk (GitHub Packages)
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write   # publicar en GitHub Packages con GITHUB_TOKEN
      issues: write     # abrir/refrescar la incidencia de alerta si la publicación falla (hub#1308)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `registry-url` + `scope` son lo que escribe el `.npmrc` con
      # `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`. Sin este paso, `npm publish` iría al
      # registro público de npmjs — el SDK de un repo privado, en abierto y sin vuelta atrás.
      - name: Node + registro de la organización
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@erplora'

      # El MISMO script que estampa la imagen, con el MISMO número: el del tag. Estampa los tres
      # ficheros y se NIEGA si alguno no tiene dónde escribir, así que aquí no puede publicarse un
      # paquete cuya `SDK_VERSION` diga otra cosa que su `package.json`.
      - name: Estampar la versión del tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/stamp-version.sh --version "${GITHUB_REF_NAME#v}"

      # 🔴 hub#1308 — POR QUÉ ESTE PASO CLASIFICA EL FALLO EN VEZ DE LIMITARSE A MORIR.
      #
      # Cada tag dejaba el run en rojo con la imagen ya publicada, y el motivo que enseñaba la UI
      # era `Permission permission_…`: truncado. Sobre esa media línea se diagnosticó que faltaba
      # `packages: write`. NO faltaba — el mismo run imprime `Packages: write` en su grupo
      # `GITHUB_TOKEN Permissions`. La línea entera, que solo está en el log crudo, dice:
      #
      #   403 Forbidden - PUT https://npm.pkg.github.com/@erplora%2fmodule-sdk
      #   Permission permission_denied: Account has reached its billing limit.
      #
      # Es la CUOTA DE PAGO de la organización, no un permiso: `ERPlora/hub` es privado, así que
      # el paquete npm que publica es privado, y los paquetes privados consumen esa cuota (los
      # públicos no consumen nada). Ningún cambio en este fichero lo levanta: hace falta subir el
      # límite de gasto de la org, o hacer PÚBLICO el paquete.
      #
      # Lo que sí arregla este paso es que la causa deje de esconderse. `--dry-run` NO autentica
      # —en el run 33228750255 pasó en verde justo antes del 403 del PUT real—, así que ninguna
      # comprobación previa puede anticiparlo: la única señal honesta es clasificar la respuesta
      # del registro cuando llega y NOMBRARLA. El paso sigue fallando (nada de
      # `continue-on-error`: una release que no publica no está en verde), y el paso siguiente
      # abre la incidencia, porque un run de tag en rojo no avisa a nadie por sí solo (hub#652).
      #
      # `--tag` SIEMPRE explícito: sin él `npm publish` mueve el dist-tag `latest` a lo último que
      # se publica, así que una candidata `vX.Y.Z-rc.N` (canal canary) dejaría `latest` apuntando a
      # la rc y un `npm install @erplora/module-sdk` a secas se llevaría la candidata. Es el mismo
      # criterio que `image-tags.sh` aplica a la imagen: una rc NUNCA mueve `:latest`. Las
      # prereleases van a `next` (la convención de npm); las finales, a `latest`.
      #
      # Sin `npm install`: el paquete se publica como FUENTE TypeScript (`main: src/index.ts`), no
      # hay build ni artefacto que generar, y su única devDependency (`typescript`) solo la usa
      # `contract:check`. `--dry-run` primero para que el contenido del tarball quede en el log:
      # `files` es lo único que decide qué sale, y un tarball vacío se publica igual de bien.
      - name: Publicar en GitHub Packages
        id: publish
        working-directory: packages/module-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sin `-e` a propósito: el fallo de `npm publish` hay que LEERLO y clasificarlo, no
          # abortar en la línea. Cada camino de error termina en un `exit` explícito.
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) dist_tag="next" ;;
            *)   dist_tag="latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "dist-tag npm: $dist_tag (versión $version)"

          if ! npm publish --dry-run --tag "$dist_tag"; then
            echo "blocked_by=pack" >> "$GITHUB_OUTPUT"
            echo "::error title=El paquete del SDK no se puede ni empaquetar::npm publish --dry-run ha fallado, así que no se intenta la publicación real. Mira el log de este paso: el problema está en packages/module-sdk (package.json, files, versión)."
            exit 1
          fi

          log="${RUNNER_TEMP}/npm-publish.log"
          npm publish --tag "$dist_tag" > "$log" 2>&1
          status=$?
          cat "$log"

          if [ "$status" -eq 0 ]; then
            echo "blocked_by=" >> "$GITHUB_OUTPUT"
            echo ""
            echo "Publicado @erplora/module-sdk@${version} (dist-tag ${dist_tag}) en https://npm.pkg.github.com"
            echo "Consumir (requiere un token con read:packages sobre ERPlora/hub):"
            echo "  .npmrc → @erplora:registry=https://npm.pkg.github.com"
            echo "  package.json → \"@erplora/module-sdk\": \"^${version}\""
            exit 0
          fi

          # La respuesta del registro, clasificada. `billing limit` es la literal que devuelve
          # GitHub Packages cuando la cuota de la organización está agotada; es un bloqueo
          # OPERATIVO de la org, no un defecto de esta release, y distinguirlo es lo único que
          # evita que el siguiente lector vuelva a tocar `packages: write` como hizo hub#1308.
          if grep -qi 'billing limit' "$log"; then
            echo "blocked_by=billing" >> "$GITHUB_OUTPUT"
            echo "::error title=GitHub Packages ha rechazado la publicación por CUOTA de la organización::403 permission_denied - Account has reached its billing limit. NO es un permiso que falte (este job declara packages: write y el run lo confirma). ERPlora/hub es privado, así que el paquete es privado y consume la cuota de pago de la org. Se levanta subiendo el límite de gasto de la org o haciendo PÚBLICO el paquete @erplora/module-sdk; no hay nada que arreglar en build-hub.yml. La imagen del hub SÍ está publicada: mira el job «Build & Push erplora/hub»."
          else
            echo "blocked_by=other" >> "$GITHUB_OUTPUT"
            echo "::error title=npm publish ha fallado contra GitHub Packages::La causa NO es la cuota de la organización. El motivo exacto está en el log de este paso, unas líneas más arriba."
          fi
          exit "$status"

      # Un run de tag en rojo no avisa a nadie: las notificaciones de Actions no llegan a ningún
      # humano (lo que ya obligó a `image-freshness.yml` a abrir incidencia, hub#652). Y el
      # lookup lo hace `scripts/ci/alert-issue.sh` —REST + filtro local, nunca `--search`, cuyo
      # índice va por detrás de la realidad (hub#1246)—, con `MATCH=prefix` porque el `: <versión>`
      # del título cambia en cada tag y solo la parte estable es la clave de idempotencia.
      - name: Abrir/refrescar la incidencia de publicación del SDK (hub#1308)
        if: failure() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
          BLOCKED_BY: ${{ steps.publish.outputs.blocked_by }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          case "$BLOCKED_BY" in
            billing)
              cause="**Cuota de GitHub Packages de la organización agotada** — el registro responde \`403 permission_denied: Account has reached its billing limit\`.

          No falta ningún permiso: este job declara \`packages: write\` y el run lo imprime en su grupo \`GITHUB_TOKEN Permissions\`. \`ERPlora/hub\` es un repo PRIVADO, así que el paquete npm que publica es PRIVADO y consume la cuota de pago de la organización; los paquetes públicos no consumen nada.

          Se levanta de una de estas dos formas, ambas fuera de este repositorio:

          - subir el límite de gasto de la organización, o
          - hacer PÚBLICO el paquete \`@erplora/module-sdk\` (es MIT y su razón de ser es que lo consuman desarrolladores de módulos de fuera)." ;;
            pack)
              cause="**El paquete no se puede ni empaquetar** — \`npm publish --dry-run\` ha fallado, así que no se intentó la publicación real. El defecto está en \`packages/module-sdk\` (su \`package.json\`, su \`files\` o su versión) y sí se arregla en este repositorio." ;;
            *)
              cause="**El registro ha rechazado la publicación por un motivo que no es la cuota.** El log del paso «Publicar en GitHub Packages» lleva la respuesta entera de npm." ;;
          esac

          body="La imagen del hub de este tag SÍ se publicó (job «Build & Push erplora/hub»); lo que falló es solo el paquete npm.

          - versión: \`${VERSION}\`
          - run: ${RUN_URL}

          Causa: ${cause}

          Mientras esto siga rojo, \`@erplora/module-sdk@${VERSION}\` no existe en el registro. Eso NO rompe a los 26 repos de módulo —instalan el SDK por la composite action \`ERPlora/hub/.github/actions/module-sdk\` (hub#1097), que es lo único que GitHub resuelve sin credencial—; lo que se pierde es la IDENTIDAD verificable del SDK (\`npm view @erplora/module-sdk@X.Y.Z\`) y el desarrollo local fuera del monorepo.

          Esta incidencia se reutiliza (un comentario por tag fallido) mientras el bloqueo siga en pie; ciérrala cuando un tag publique el SDK."

          TITLE="El SDK @erplora/module-sdk no se pudo publicar en GitHub Packages: ${VERSION}" \
            MATCH=prefix MATCH_VALUE="El SDK @erplora/module-sdk no se pudo publicar en GitHub Packages" \
            LABEL=area:ci-cd BODY="$body" \
            ./scripts/ci/alert-issue.sh

      # `erplora-guest-sdk` no se publica en ningún registro: se consume por GIT TAG
      # (`crates/guest-sdk/Cargo.toml` lleva `publish = false`). El tag ya existe —es el que ha
      # disparado este workflow—, así que no hay nada que hacer salvo dejar escrita la línea que
      # un módulo tiene que poner en su `handler/Cargo.toml`.
      - name: Cómo se consume erplora-guest-sdk
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "erplora-guest-sdk se consume por git tag (sin registro, publish = false):"
          echo "  erplora-guest-sdk = { git = \"https://github.com/ERPlora/hub\", tag = \"${GITHUB_REF_NAME}\" }"


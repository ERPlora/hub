# ==============================================================================
# ERPlora Hub — e2e CON LOS MÓDULOS REALES (hub#1216)
# ==============================================================================
#
# `test-hub.yml` corre `cargo test --workspace`, pero los e2e que instalan módulos
# reales SE AUTO-OMITEN allí: `actions/checkout` trae solo este repo, el guard ve
# `CI=true` y toma el skip legítimo (hub#253). Son los targets de `tests/` que declara
# `scripts/ci/kernel-e2e-targets.txt` (eran 36 al abrir hub#1216; hub#1264 los va
# devolviendo a la batería de cada módulo, así que el número se lee de la lista y no
# se escribe aquí), más los guardados en `src/` (`installer::every_published_manifest_*`)
# — toda la cadena fiscal, el TPV, la cocina y el inventario— y el gate local también
# los salta por defecto (`HUB_GATE_WITH_MODULES`, hub#855). O sea que hasta este
# workflow NO CORRÍAN EN NINGÚN SITIO automático: un test caducado por ADR-0405
# estuvo un día entero en rojo con Actions en verde (hub#1215).
#
# Este workflow se trae el catálogo de módulos (~27 repos) por su estado PUBLICADO (`main`) y
# corre esos targets más el `--lib` del runtime.
#
# ── Los CUATRO disparadores, y por qué hacen falta los cuatro (hub#1239, hub#1438) ──
# La ADR «El Hub se CIERRA como KERNEL» (2026-08-27) fija la regla que esta pasada mide —el
# kernel no rompe a un módulo publicado, nunca—: es el «crater/runbot» del hub, los 27 módulos
# PUBLICADOS contra este runtime. El contrato completo: `architecture/hub/kernel-contract.md`.
#
# 🔴 La pasada PRE-MERGE no está aquí, está en el GATE LOCAL. Hasta el 2026-08-29 este fichero
# llevaba además un bloque `pull_request:` con las seis superficies que la ADR congela
# (`crates/runtime`, `crates/server`, `schemas`, `crates/db`, `crates/guest-sdk`,
# `crates/wasm-host`), y era esa la puerta de una PR `kind:contract`. pm#197 la retiró (decisión
# de Ioan, con `ci-runner-1` saturado): el gate pre-push materializa el catálogo PUBLICADO y
# ejecuta estos mismos e2e por defecto (hub#1353), rojo = push abortado, y sin push no hay PR.
# Antes de mergear, lo que `merge-pr.sh` exige es el sello `local-gate/hub-tests` — nunca un run
# de este workflow. Lo que queda aquí es la red de FUERA de la PR:
#
#   · `push` a `main`/`develop`: la red POST-MERGE (hub#572), que el gate local no puede dar —
#     dos PRs verdes por separado pueden romper `develop` juntas, y eso solo se ve sobre el
#     árbol resultante.
#
#   · `schedule` diario: el rojo de hub#1215 lo causó una RELEASE DE MÓDULO
#     (`invoice` v1.2.27, ADR-0405), no un commit del hub, y ningún trigger por
#     push lo habría cazado — el hub no se movió.
#
#   · `repository_dispatch: [module-published]`: el `release.yml` del módulo avisa
#     al publicar, así el rojo sale EN EL MOMENTO de publicar y con el nombre del
#     culpable en el título del run, en vez de a las horas y en el push de otro.
#     (El emisor está pendiente: module-toolkit, el workflow de release reutilizable.)
#
#   · `workflow_dispatch`: la vía a mano, para reverificar el catálogo sin esperar al cron.
#
# Y en los tres casos el fallo es RUIDOSO: hasta hub#1239 este job fallaba MUDO —
# nadie mira un cron, y hub#1215 aguantó un día entero en rojo con Actions en verde.
# El paso de la issue de alerta es el mismo patrón idempotente de `test-hub.yml`.
#
# ⚠️ TERCERA copia de la config de Postgres del repo (las otras: `test-hub.yml` y
# `.githooks/pre-push`). Si una cambia de imagen o de ajustes, las tres. Esa deriva
# ya tumbó `main` una vez (hub#647).
# ==============================================================================

name: Hub module e2e (módulos reales)

# El disparo por `repository_dispatch` viene de la release de UN módulo concreto, y sin esto
# el run se titula igual que la pasada nocturna: hay que abrirlo para saber a qué versión de
# qué módulo culpa. El payload va también al summary del job (paso de abajo).
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('módulo publicado — {0} v{1}', github.event.client_payload.module, github.event.client_payload.version)
      || format('e2e con módulos reales — {0}', github.ref_name) }}

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * *'   # diario, fuera de la hora en punto (pico de carga de GitHub)
  workflow_dispatch:
  # Lo dispara el `release.yml` de cada módulo al publicar (hub#1239). Cae siempre sobre la rama
  # POR DEFECTO del repo (`main`) — así se lee: «lo publicado contra lo desplegado».
  repository_dispatch:
    types: [module-published]
  # Las seis superficies del kernel (ver la cabecera). `crates/runtime/**` ya cubre el antiguo
  # `crates/runtime/src/e2e_support.rs`, que por eso deja de listarse aparte.
  # Sin `pull_request` desde el 2026-08-29 (Ioan): estos e2e los corre el gate pre-push, que
  # materializa el catálogo PUBLICADO y los ejecuta POR DEFECTO (hub#1353 — medido sobre develop
  # limpio: 30 binarios, 1 365 tests, 0 fallos, 5m07s; la nota de «120 fallos» era anterior a
  # hub#1153, cuando el catálogo se leía de `modules-workspace`). Rojo = push abortado, y sin
  # push no hay PR: la prueba no se pierde, cambia de sitio.
  # Si vuelve, vuelve CON su filtro de borradores: las PRs nacen en borrador y, medido el 29/08,
  # la mitad de los minutos del runner se iban en runs cancelados por el re-push del revisor. El
  # `if:` que lo aplicaba se retiró con el trigger (hub#1443): sin `pull_request` era constante.
  # `push` a develop/main se queda: es la red POST-MERGE (hub#572) y el sitio donde el
  # `repository_dispatch` de un módulo recién publicado sigue midiendo contra el kernel.

# El grupo NO puede ser solo `github.ref` desde que existe el dispatch: los avisos de dos módulos
# distintos llegan sobre la MISMA rama por defecto, y con un grupo común el segundo cancelaría la
# verificación del primero — que es justo la señal que se quería. Un módulo, un grupo.
concurrency:
  group: >-
    test-hub-modules-${{ github.event_name == 'repository_dispatch'
      && format('published-{0}', github.event.client_payload.module) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-e2e:
    name: e2e con módulos reales
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 45 → 70 con el corredor de baterías (hub#1381): levanta UN hub por módulo con el catálogo
    # publicado entero, y eso son 11 arranques — las **26** baterías en 11 módulos desde que
    # hub#1483 borró la última exención (`verifactu`: hub#1477 le dio el backend de disco para sus
    # `static_files` y el módulo ya instala sin token de máquina). Medido el 2026-09-03 en local:
    # **13 min 40 s** con 25 de ellas — el arranque de `verifactu` ya estaba en esa medición (la
    # exenta también arrancaba su hub: así caducó la exención); la 26ª solo añade su batería. El
    # techo se sube por encima de la suma y no se ajusta al minuto a propósito — un timeout que
    # corta a mitad de la pasada no deja veredicto, deja un rojo sin causa, que es lo más caro de
    # diagnosticar de este job.
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write   # abrir/refrescar la issue de alerta cuando esto falla (hub#1239)

    services:
      postgres:
        # pgvector, NO `postgres:18` a secas (hub#647). Ver el aviso de la cabecera.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hub_test
        # Puerto de host DINÁMICO (hub#898): las dos ranuras de `ci-runner-1` viven en
        # la MISMA máquina y un puerto fijo hace morir al segundo job en ~9 s.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TERM_COLOR: always
      # 🔴 La razón de ser de este job: aquí los módulos son OBLIGATORIOS. Sin esto, si
      # el clonado fallara, los 238 e2e se saltarían solos y el job saldría VERDE sin
      # haber probado nada — el agujero exacto que viene a cerrar.
      ERPLORA_E2E_REQUIRE_MODULES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags completos, y no el checkout superficial por defecto (hub#1619): sin ellos este
          # job no sabe qué versión de hub ES —cae al placeholder de `[workspace.package]`, que
          # está por debajo de toda la flota— y refusaría cualquier módulo que declare
          # `compatibility.min_erplora_version`, leyendo su propio despiste como un manifest roto.
          # El barrido lo detecta y se pone ROJO en voz alta si esto falta, en vez de dejar de
          # comprobar los suelos en silencio.
          fetch-depth: 0
          fetch-tags: true

      # Un aviso sin `module` correría como una pasada nocturna anónima: el run no diría a quién
      # culpar y la issue de alerta tampoco. Se rechaza en voz alta, que es barato (el emisor lo
      # ve en su propia release) y deja el contrato del payload escrito en un solo sitio.
      - name: Aviso de módulo publicado — validar y publicar el payload
        if: github.event_name == 'repository_dispatch'
        env:
          MODULE: ${{ github.event.client_payload.module }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [ -z "${MODULE}" ]; then
            # Comillas SIMPLES: con dobles, las comillas invertidas de abajo serían sustitución
            # de comandos y bash intentaría EJECUTAR el nombre del evento.
            echo '::error::repository_dispatch (module-published) sin client_payload.module.'
            echo 'El emisor (el release.yml del módulo) tiene que mandar al menos:'
            echo '  {"event_type":"module-published","client_payload":{"module":"sales","version":"2.16.39"}}'
            exit 1
          fi
          {
            echo "### Módulo publicado: \`${MODULE}\` v${VERSION:-?}"
            echo
            echo "Esta pasada comprueba el catálogo PUBLICADO contra \`${GITHUB_REF_NAME}\`"
            echo "tras la release de ese módulo (hub#1239)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      # ⚠️ El secreto es de REPO, no de organización: con la org en plan Free los
      # secretos de organización NO llegan a los repos privados (por eso
      # `ANDROID_KEYSTORE_*` está duplicado en los dos sitios). Un secreto ausente
      # llega como cadena VACÍA, no como error — el mismo modo de fallo que dejó
      # `CI_RUNNER_LABEL` vacía y mandó jobs a `ubuntu-latest` en verde. Por eso se
      # comprueba explícitamente antes de usarlo.
      #
      # El clonado en sí NO vive aquí: lo hace `scripts/materialize-published-modules.sh`,
      # el MISMO script que el gate local invoca desde `.githooks/pre-push` (hub#1153). Antes
      # el bucle de clonado, el suelo de ≥25 y el fallo ruidoso estaban escritos dentro de
      # este `run:`, así que el gate local no tenía forma de reutilizarlos y medía contra el
      # checkout aparcado de `modules-workspace`. Una sola copia: la deriva entre copias de
      # la misma lógica ya tumbó `main` una vez con la config de Postgres (hub#647).
      - name: Traer el catálogo de módulos por su estado PUBLICADO (main)
        env:
          MODULES_DEPLOY_KEYS: ${{ secrets.MODULES_DEPLOY_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${MODULES_DEPLOY_KEYS}" ]; then
            echo "::error::el secreto MODULES_DEPLOY_KEYS llegó VACÍO."
            echo "Tiene que ser secreto DEL REPO ERPlora/hub (los de organización no"
            echo "alcanzan a repos privados con la org en plan Free). Regenerarlo:"
            echo "  ver hub#1216 — una deploy key read-only por módulo, en tar+base64."
            exit 1
          fi

          # La lista de módulos SALE DEL PROPIO PAQUETE DE CLAVES, no de una lista escrita aquí:
          # cada módulo necesita su deploy key de todas formas, así que el paquete es la única
          # fuente que no puede quedarse corta. Una lista a mano sí: la primera versión traía 13 de
          # los 27 y `module_manifest_contract` lo cazó — pero solo porque exige un MÍNIMO (≥20).
          # Un módulo nuevo que faltase sin bajar de ese umbral no se habría probado, en silencio.
          # Quien lee el paquete es el script; aquí solo se desempaqueta.
          KEYS="$HOME/.erplora-module-keys"
          rm -rf "$KEYS"
          mkdir -p "$KEYS" && chmod 700 "$KEYS"
          printf '%s' "$MODULES_DEPLOY_KEYS" | base64 -d | tar xz -C "$KEYS"
          chmod 600 "$KEYS"/*

          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          # 🔴 En `$RUNNER_TEMP`, que se vacía en cada job — NUNCA junto al checkout.
          #
          # La primera versión clonaba en `$GITHUB_WORKSPACE/../modules-workspace`, que PERSISTE
          # entre jobs del runner, y eso rompió dos cosas a la vez:
          #   1. su propio run siguiente — `git clone` sobre un directorio no vacío
          #      («destination path ... already exists and is not an empty directory»);
          #   2. `test-hub.yml` EN LA MISMA MÁQUINA (las dos ranuras de `ci-runner-1`), que resuelve
          #      los módulos por la ruta relativa por defecto: encontró el catálogo a medias que
          #      este job dejó, dejó de saltarse `installer::every_published_manifest_*` y falló
          #      con «only 13 checked». Un job que ensucia el runner rompe al vecino, no a sí mismo,
          #      y eso es carísimo de diagnosticar.
          DEST="$RUNNER_TEMP/modules-workspace/modules"
          rm -rf "$DEST"

          # Y se limpia lo YA filtrado por la versión anterior en este runner, que si no se queda
          # ahí envenenando a `test-hub.yml` para siempre.
          rm -rf "$GITHUB_WORKSPACE/../modules-workspace"

          # El `dist/` va COMMITEADO en cada repo de módulo, así que no hay nada que compilar —
          # lo que se prueba es exactamente lo que se publica. El suelo de ≥25 manifests y el
          # fallo ruidoso por módulo inalcanzable los aplica el script (`--floor 25`): el catálogo
          # publicado son ~27 módulos y `module_manifest_contract` exige ≥20, así que por sí solo
          # NO caza que falten unos pocos.
          # El `::error::` se pone AQUÍ y no dentro del script: es sintaxis de anotación de
          # Actions, y el script también lo corre el gate local, donde solo sería ruido.
          if ! RESOLVED=$(bash scripts/materialize-published-modules.sh \
              --dest "$DEST" --keys "$KEYS" --floor 25); then
            echo "::error::no se pudo materializar el catálogo PUBLICADO (el detalle, arriba en"
            echo "este mismo paso). Si se publicó un módulo nuevo, hay que añadir su deploy key"
            echo "al paquete MODULES_DEPLOY_KEYS (hub#1216)."
            exit 1
          fi

          rm -rf "$KEYS"
          echo "ERPLORA_MODULES_DIR=$RESOLVED" >> "$GITHUB_ENV"

      # ── hub#1381 · la cobertura que hub#1264 muda tiene que ESTAR donde el slice prometió ──
      # hub#1264 saca del hub los e2e que afirman comportamiento de un MÓDULO y los devuelve a su
      # repo como baterías `erplora test`. La premisa es que la cobertura CAMBIA DE SITIO; el
      # 2026-08-30 no cambió de sitio, se cayó por un hueco: hub#1372 borró
      # `services_package_redeem_e2e.rs` —391 líneas que ESTE job ejecutaba— y su relevo,
      # `services/tests/package_redeem.hub.test.py`, no lo corría NADIE. Las dos CI en verde.
      #
      # Este paso es el único sitio del repo donde eso se puede contrastar, y sale gratis: el
      # catálogo PUBLICADO ya está en disco del paso de arriba. La lista revisada
      # (`scripts/ci/module-hub-batteries.txt`) es la otra mitad de `kernel-e2e-targets.txt`: el
      # slice borra una línea allí y añade aquí la batería que hereda la cobertura, en la MISMA
      # PR. Ese par de ediciones es el acto revisable.
      #
      # 🔴 Comprueba que la batería EXISTE, no que pase: un verde aquí se lee «la batería está
      # donde dijeron». Quien la EJECUTA es el paso `run-batteries` de más abajo (hub#1381), y son
      # dos guardias distintas a propósito — una batería que se dejó de publicar y una que falla
      # se arreglan en sitios distintos, y esta corre gratis mucho antes que aquella.
      - name: Las baterías de módulo cuadran con la lista revisada (hub#1381)
        id: batteries
        run: |
          set -uo pipefail
          # El catálogo lo toma de `ERPLORA_MODULES_DIR`, que exportó el paso anterior.
          # stdout es la lista de módulos con batería (el futuro worklist del corredor) y stderr
          # el veredicto: se separan para que la issue de alerta pueda CITAR el veredicto en vez
          # de mandar al lector de vuelta al log.
          rc=0
          bash scripts/ci/module-hub-batteries.sh \
            > "$RUNNER_TEMP/module-batteries.out" \
            2> "$RUNNER_TEMP/module-batteries.err" || rc=$?
          cat "$RUNNER_TEMP/module-batteries.err" >&2
          if [ "$rc" -ne 0 ]; then
            # El `::error::` se pone AQUÍ y no dentro del script: es sintaxis de anotación de
            # Actions, y el guard se corre también en local, donde solo sería ruido.
            echo "::error::la lista revisada de baterías de módulo no cuadra con el catálogo"
            echo "::error::PUBLICADO (el detalle, arriba en este mismo paso). Se edita"
            echo "::error::scripts/ci/module-hub-batteries.txt en la MISMA PR que borra el e2e"
            echo "::error::del hub — ver hub#1381."
            exit "$rc"
          fi
          echo "módulos con batería \`*.hub.test.py|sh\`: $(grep -c . "$RUNNER_TEMP/module-batteries.out")"

      - name: Raise Postgres lock limits (hub#526) + export dynamic port (hub#898)
        run: |
          set -euo pipefail
          # La suite crea un ESQUEMA EFÍMERO POR TEST, así que el techo global de
          # cerrojos de fábrica se agota y revienta quien pase por ahí (hub#526).
          PG_PORT="${{ job.services.postgres.ports['5432'] }}"
          PG=$(docker ps --filter "publish=${PG_PORT}" --format '{{.ID}}' | head -1)
          if [ -z "$PG" ]; then
            echo "::error::no Postgres container found publishing host port ${PG_PORT}."
            docker ps --format '  {{.ID}}  {{.Image}}  {{.Ports}}'
            exit 1
          fi
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 4096;"
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300;"
          docker exec "$PG" psql -U postgres -c "ALTER SYSTEM SET shared_buffers = '512MB';"
          docker restart "$PG"
          for i in $(seq 1 30); do
            docker exec "$PG" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          # ⚠️ El restart REBINDEA el puerto efímero: el valor del contexto del job queda
          # obsoleto desde aquí (hub#898). Se pregunta a Docker y se comprueba con un
          # TCP real antes de exportar el DSN.
          HOST_PORT=$(docker port "$PG" 5432/tcp | head -1 | sed 's/.*://')
          if [ -z "$HOST_PORT" ]; then
            echo "::error::docker port returned no host binding for 5432/tcp on ${PG}."
            exit 1
          fi
          ok=""
          for i in $(seq 1 15); do
            if timeout 2 bash -c "exec 3<>/dev/tcp/localhost/${HOST_PORT}" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::Postgres unreachable on localhost:${HOST_PORT}."; exit 1; }
          echo "DATABASE_URL=postgres://postgres:test@localhost:${HOST_PORT}/hub_test" >> "$GITHUB_ENV"
          # El corredor de baterías (hub#1381) necesita crear una BD por módulo, y el runner no
          # trae `psql` garantizado: se lo pide al MISMO contenedor por `docker exec`, que este
          # paso ya usa arriba. Se exporta después del restart a propósito — el id no cambia, pero
          # el puerto sí, y leerlo antes fue el bug de hub#898.
          echo "PG_CONTAINER=${PG}" >> "$GITHUB_ENV"

      - name: Toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show

      # `cache-bin: false` y `save-if` off en runner propio: el paso `Post` de esta
      # acción borra `$CARGO_HOME/bin` (se lleva `rustup`) y `~/.cargo/registry/src`,
      # que las DOS ranuras de `ci-runner-1` comparten. Explicación en `test-shell.yml`.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      # La lista de targets se DERIVA del código, no se escribe a mano: un e2e nuevo
      # entra solo, y no hay una lista que se quede obsoleta en silencio (que es la
      # clase de mentira que hub#1215 vino a arreglar). La lista revisada de más abajo
      # NO sustituye a esa derivación: la CONTRASTA.
      #
      # Porque un conjunto derivado también puede ENCOGER en silencio, y el suelo que lo
      # cubría era un número mágico (`[ "$count" -ge 30 ]`, hub#1229): una foto, no un
      # contrato. hub#1264 está sacando del hub los e2e que afirman comportamiento de un
      # módulo —se van a la batería `erplora test` de ese módulo—, el séptimo slice dejó
      # la cuenta en 29 y `develop` se puso en rojo para toda la flota acusando al grep de
      # no encontrar los e2e cuando funcionaba perfectamente (hub#1354). Y el único arreglo
      # que ofrecía el número era bajarlo, que es el reflejo contrario al que debe enseñar
      # un guardia de cobertura (hub#1359).
      #
      # Ahora el suelo es una LISTA REVISADA (`scripts/ci/kernel-e2e-targets.txt`) que
      # `scripts/ci/kernel-e2e-targets.sh` compara con el árbol EN LAS DOS DIRECCIONES:
      # falla si falta del árbol algo declarado (borrado sin avisar) y si sobra en el árbol
      # algo no declarado (cobertura que nadie firmó — la dirección que un suelo numérico
      # nunca puede cazar, porque ahí la cuenta solo sube). Quitar un target exige editar la
      # lista EN LA MISMA PR, y ese diff es el acto revisable.
      #
      # `--no-fail-fast` porque `cargo test` corta en el primer binario que falla y
      # esconde el resto.
      - name: cargo test — los targets que necesitan módulos
        id: tests
        run: |
          set -euo pipefail
          # El `::error::` se pone AQUÍ y no dentro del script: es sintaxis de anotación de
          # Actions, y el script se corre también en local, donde solo sería ruido.
          if ! targets=$(bash scripts/ci/kernel-e2e-targets.sh); then
            echo "::error::la lista revisada de e2e del kernel no cuadra con crates/runtime/tests"
            echo "::error::(el detalle, arriba en este mismo paso). Se edita scripts/ci/kernel-e2e-targets.txt"
            echo "::error::en la MISMA PR que añade o quita el .rs — ver hub#1359."
            exit 1
          fi
          count=$(printf '%s\n' "$targets" | grep -c .)
          echo "targets con módulos: $count"
          args=""
          for t in $targets; do args="$args --test $t"; done
          # `--lib` además de los targets de integración: hay tests guardados en `src/` que un grep
          # sobre `tests/` no ve — `installer::every_published_manifest_*` valida el catálogo entero
          # y solo corre con módulos. Se colaron fuera de la cuenta inicial de «238 en 36 targets»,
          # y son justo los que cazaron el catálogo incompleto.
          # El log se guarda para que la issue de alerta pueda NOMBRAR los targets rotos: un aviso
          # que solo enlaza el run devuelve al lector al log, que es de donde venía. `PIPESTATUS`
          # porque `tee` se traga el código de salida de cargo.
          set +e
          # shellcheck disable=SC2086  # `$args` es una lista de `--test x` a propósito
          cargo test -p erplora-runtime --lib $args --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/module-e2e.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      # ── hub#1381 · y ahora las baterías se EJECUTAN, no solo se cuentan ──────────────────────
      # El paso `batteries` de arriba prueba que la batería ESTÁ donde el slice prometió. Es medio
      # guardia: una batería que no ejecuta nadie es documentación. `services/…/package_redeem.hub`
      # heredó 391 líneas de cobertura el 30/08 y estuvo CUATRO DÍAS sin correr en ningún sitio,
      # con las dos CI en verde — el gate del módulo la reporta como `⚠ … no se ha corrido` y pasa
      # igual (`run-batteries.mjs`, `notRun`).
      #
      # Se corre contra el servidor compilado DE ESTE REF, no contra la imagen publicada. Es lo que
      # hace que la pasada signifique lo que este workflow dice que mide: el kernel bajo prueba
      # contra los módulos tal como se publican. Y `erplora test --against-hub` no sirve aquí por
      # tres bloqueos MEDIDOS (instala UN módulo — module-toolkit#135; el toolkit es `private` con
      # dependencias `file:`; y ningún secreto de este repo alcanza esos checkouts): el detalle
      # completo, en la cabecera de `scripts/ci/run-module-hub-batteries.sh`.
      #
      # `!cancelled()` en los dos pasos: si `cargo test` se pone rojo, la pasada de baterías tiene
      # que darse IGUAL. Lo contrario esconde media señal detrás de la otra, y son cosas distintas
      # —el kernel contra sus e2e, y el kernel contra los módulos publicados—. Lo único que las
      # salta es una cancelación.
      - name: Compilar erplora-server para las baterías (hub#1381)
        if: ${{ !cancelled() }}
        run: cargo build -p erplora-server

      - name: Las baterías de módulo pasan contra ESTE kernel (hub#1381)
        id: run-batteries
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # stdout es el detalle por batería y stderr el veredicto: separados para que la issue de
          # alerta pueda CITAR el veredicto en vez de mandar al lector de vuelta al log.
          rc=0
          bash scripts/ci/run-module-hub-batteries.sh \
            --catalogue "$ERPLORA_MODULES_DIR" \
            --database-url "$DATABASE_URL" \
            --pg-container "$PG_CONTAINER" \
            --server target/debug/erplora-server \
            > "$RUNNER_TEMP/run-batteries.out" \
            2> "$RUNNER_TEMP/run-batteries.err" || rc=$?
          cat "$RUNNER_TEMP/run-batteries.out"
          cat "$RUNNER_TEMP/run-batteries.err" >&2
          if [ "$rc" -ne 0 ]; then
            # El `::error::` se pone AQUÍ y no dentro del script: es sintaxis de anotación de
            # Actions, y el corredor se ejecuta también en local, donde solo sería ruido.
            echo "::error::una batería \`*.hub.test.py|sh\` del catálogo PUBLICADO no pasa contra"
            echo "::error::este kernel (el detalle, arriba en este mismo paso). Es el módulo y el"
            echo "::error::kernel discrepando sobre el contrato entre ambos — ver hub#1381."
            exit "$rc"
          fi

      # Mismo problema mudo que sus dos vecinos: una batería que se rompe en el cron o en el
      # `module-published` de un módulo no la mira nadie.
      - name: Alerta — las baterías de módulo no pasan (hub#1381)
        if: >-
          failure() && steps.run-batteries.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' ||
           github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `[ -s ]` primero: el corredor puede morir ANTES de escribir su veredicto (un
          # `ERPLORA_MODULES_DIR` vacío sale por otra rama). `cat` sobre un fichero ausente mata
          # este paso bajo `set -e` y la issue no se abriría — el rojo mudo que viene a abolir.
          VERDICT="(el corredor no dejó veredicto: murió antes de escribirlo — mira el log del run)"
          if [ -s "$RUNNER_TEMP/run-batteries.err" ]; then
            VERDICT=$(head -c 3000 "$RUNNER_TEMP/run-batteries.err")
          fi

          title="Las baterías de módulo del catálogo publicado NO pasan contra el kernel"
          body="Detectado por \`test-hub-modules.yml\` — disparo \`${GITHUB_EVENT_NAME}\` (hub#1381).

          - rama probada: \`${GITHUB_REF_NAME}\` — commit \`${GITHUB_SHA}\`
          - run que falló: ${RUN_URL}

          **Veredicto del corredor:**

          \`\`\`
          ${VERDICT}
          \`\`\`

          Cada batería \`*.hub.test.py|sh\` afirma comportamiento de un MÓDULO que el hub afirmaba antes y ya no (hub#1264). Un rojo aquí es el módulo y el kernel discrepando sobre el contrato entre ambos: se arregla en el repo del módulo, o en el kernel si el que se movió fue el kernel.

          Reproducirlo en local (una BD y un hub por módulo, igual que la CI):

          \`\`\`
          cargo build -p erplora-server
          scripts/ci/run-module-hub-batteries.sh --catalogue <catálogo publicado> \\
              --database-url postgres://postgres:test@localhost:5433/hub_test \\
              --pg-container erplora-test-pg-5433
          \`\`\`

          Esta issue se REUTILIZA (un comentario por detección) mientras siga el rojo; ciérrala cuando vuelvan a pasar."

          TITLE="$title" MATCH=exact LABEL=area:ci-cd BODY="$body" \
            ./scripts/ci/alert-issue.sh

      # Sin esto el fallo es MUDO: nadie mira un cron y hub#1215 aguantó un día entero en rojo con
      # Actions en verde. Mismo patrón idempotente que `test-hub.yml` (hub#572) e `image-freshness`
      # (hub#652): UNA issue abierta que se refresca con un comentario, nunca una por run.
      #
      # No se dispara en `pull_request`: ahí el rojo ya es visible como check de la PR, y una issue
      # por cada PR roja sería ruido. Se dispara en lo que nadie mira: el cron, el push y el aviso
      # de un módulo recién publicado.
      #
      # Anclado al `outcome` del propio paso de tests para que un fallo de ENTORNO (disco, clonado,
      # contenedor de servicio) no falsifique un veredicto de «los módulos están rotos»; y
      # `failure()` excluye la cancelación, que aquí pasa a diario.
      - name: Abrir o refrescar la issue de alerta (hub#1239)
        if: >-
          failure() && steps.tests.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' ||
           github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          MODULE: ${{ github.event.client_payload.module }}
          MODULE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail

          # Qué targets fallaron, sacados del log: cargo imprime `Running tests/<x>.rs (…)` antes
          # de cada binario y `test <nombre> ... FAILED` por cada caso, así que se van asociando.
          #
          # `[ -s ]` first: the tests step can die BEFORE `tee` creates the log (the `>= 30 targets`
          # guard, the grep pipeline). awk on an absent file exits 2 and, under `set -e`, that
          # would kill THIS step before the issue opens — the mute red it exists to abolish.
          FAILING_TARGETS=""
          if [ -s "$RUNNER_TEMP/module-e2e.log" ]; then
            FAILING_TARGETS=$(awk '
              /^ *Running / { t=$0; sub(/^ *Running /, "", t); sub(/ \(target.*/, "", t); cur=t }
              / \.\.\. FAILED$/ { if (cur != "") n[cur]++ }
              END { for (k in n) printf "- `%s` — %d test(s)\n", k, n[k] }
            ' "$RUNNER_TEMP/module-e2e.log" | sort)
          fi
          if [ -z "$FAILING_TARGETS" ]; then
            # Compiló mal, o murió antes de ejecutar un solo caso: se dice, no se calla.
            FAILING_TARGETS="- (ningún test individual marcado \`FAILED\`: la suite murió antes de ejecutarlos — mira el log del run)"
          fi

          origin="disparo \`${TRIGGER}\`"
          if [ "$TRIGGER" = "repository_dispatch" ]; then
            origin="la publicación de \`${MODULE}\` v${MODULE_VERSION:-?}"
          fi

          # The title is the idempotency key: stable, matched EXACTLY, and colon-free.
          title="Los módulos publicados ROMPEN contra develop"
          body="Detectado por \`test-hub-modules.yml\` — ${origin} (hub#1239, hub#1246).

          - rama probada: \`${GITHUB_REF_NAME}\` — commit \`${GITHUB_SHA}\`
          - run que falló: ${RUN_URL}

          **Targets rotos:**

          ${FAILING_TARGETS}

          Este job clona los ~27 módulos por su estado PUBLICADO (\`main\`) y los corre contra este runtime, que es la regla del kernel: **el hub no rompe a un módulo publicado, nunca** (ADR «El Hub se CIERRA como KERNEL»). Así que hay dos salidas, y solo dos: se revierte el cambio del hub, o —si el contrato tenía que cambiar de verdad— se convierte en una PR \`kind:contract\` y el módulo se adapta DESPUÉS (orden core → flota → módulo).

          Mientras esto siga rojo, el CRATER NO SE EJECUTA: el guard de baterías corre ANTES de \`cargo test\`, así que ningún módulo publicado se está verificando contra el kernel y una regresión real queda tapada por un fallo de contabilidad. En hub#1396 fue un día entero, 14 runs. Esto NO bloquea ninguna PR —la puerta pre-merge es el sello \`local-gate/hub-tests\` del gate pre-push (pm#197)—, y por eso el rojo hay que mirarlo: nada más lo va a parar.

          Esta issue se REUTILIZA (un comentario por detección) mientras siga el rojo; ciérrala cuando el catálogo vuelva a verde."

          # scripts/ci/alert-issue.sh lists and matches LOCALLY, never `--search` (hub#1246):
          # that reads GitHub's search index, which lags behind reality (it returned ZERO with
          # open issues on 2026-08-16). Two failures minutes apart — push develop then push
          # main, two module releases — would open two issues otherwise. Now the shared script
          # used by every alert step in this repo (test-hub.yml, image-freshness.yml, and this
          # one) instead of a fourth copy of the same list-and-filter logic.
          TITLE="$title" MATCH=exact LABEL=area:ci-cd BODY="$body" \
            ./scripts/ci/alert-issue.sh

      # Una batería que un módulo publica (o retira) rompe este guard en el CRON y en el aviso
      # `module-published` — justo donde no mira nadie. Ese es el rojo mudo en el que hub#1215
      # estuvo un día entero, así que lleva la MISMA alerta idempotente que la suite de al lado:
      # una issue que se reutiliza, nunca una por run. Título propio porque el arreglo es otro —
      # aquí no se ha roto un módulo, se ha desparejado la lista— y quien la lee es otro.
      - name: Abrir o refrescar la issue de las baterías de módulo (hub#1381)
        if: >-
          failure() && steps.batteries.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' ||
           github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `[ -s ]` primero: el paso del guard puede morir ANTES de escribir su stderr (un
          # `ERPLORA_MODULES_DIR` vacío sale por otra rama). `cat` sobre un fichero ausente mata
          # este paso bajo `set -e` y la issue no se abriría — el rojo mudo que viene a abolir.
          VERDICT="(el guard no dejó veredicto: murió antes de escribirlo — mira el log del run)"
          if [ -s "$RUNNER_TEMP/module-batteries.err" ]; then
            VERDICT=$(head -c 3000 "$RUNNER_TEMP/module-batteries.err")
          fi

          title="La lista de baterías de módulo no cuadra con el catálogo publicado"
          body="Detectado por \`test-hub-modules.yml\` — disparo \`${GITHUB_EVENT_NAME}\` (hub#1381).

          - rama probada: \`${GITHUB_REF_NAME}\` — commit \`${GITHUB_SHA}\`
          - run que falló: ${RUN_URL}

          **Veredicto del guard:**

          \`\`\`
          ${VERDICT}
          \`\`\`

          \`scripts/ci/module-hub-batteries.txt\` empareja cada e2e del kernel que hub#1264 retiró con la batería \`*.hub.test.py|sh\` que heredó su cobertura. Que no cuadre significa una de dos: un módulo publicó o retiró una batería sin que nadie tocara la lista, o un slice borró el e2e del hub apuntando a una batería que no está. Las dos se arreglan editando la lista **y** diciendo en la PR dónde quedó la cobertura.

          🔴 Ojo con lo que este guard NO dice: comprueba que la batería EXISTE, no que pase. Quien la ejecuta es el paso \`run-batteries\` de este mismo job (hub#1381), y tiene su propia alerta.

          Esta issue se REUTILIZA (un comentario por detección) mientras siga el rojo; ciérrala cuando la lista vuelva a cuadrar."

          TITLE="$title" MATCH=exact LABEL=area:ci-cd BODY="$body" \
            ./scripts/ci/alert-issue.sh

      # `always()`: si el job se cancela a media suite (`cancel-in-progress` lo hace a diario), el
      # residuo se quedaría en el runner envenenando al vecino. La limpieza no puede depender de
      # que el job termine bien.
      - name: Limpiar los módulos del runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/modules-workspace" "$HOME/.erplora-module-keys" \
                 "$GITHUB_WORKSPACE/../modules-workspace" || true

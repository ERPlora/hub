# ==============================================================================
# ERPlora Shell (apps/tauri) — tests del cliente fino de escritorio (ADR-0159)
# ==============================================================================
#
# El shell está EXCLUIDO de `cargo test --workspace` en test-hub.yml: compilar
# tauri/wry exige system-libs GTK/webkit2gtk que el job principal no instala (y
# su target desbordaría el disco del runner). Este workflow las instala y corre
# `cargo test -p erplora-tauri`, pero SOLO cuando cambia el shell — así los PRs
# que no lo tocan no pagan los ~minutos de compilar el stack Tauri.
#
# Corre además los tests unitarios KOTLIN del plugin de Android (hub#933). No es
# lo mismo que el `cargo test`: la política de permisos y el transporte SPP son
# Kotlin, y hasta hub#933 sus 34 tests solo se ejecutaban al publicar un tag —
# `develop` aguantó un día en rojo sin que nada avisara. Se corren contra la raíz
# mínima `crates/tauri-plugin-erplora-android/android-tests/`, sin `:app` y por
# tanto sin NDK ni tauri-cli: segundos, no el job de release.
# ==============================================================================

name: Shell tests (Tauri thin client)

on:
  push:
    branches: [main]
    paths:
      - "apps/tauri/**"
      - "crates/tauri-plugin-erplora-android/**"
      - ".github/workflows/test-shell.yml"
      # `android_local_network.rs` lee este workflow: comprueba que el job de release sigue
      # leyendo los permisos DEL APK construido (hub#337). Sin esta ruta, un PR que solo tocase
      # el release podría quitar ese paso sin que la guarda llegase a correr.
      - ".github/workflows/tauri-release.yml"
      # Las reglas del `release-gate` (hub#895) y su test: viven en `scripts/`, así que un cambio
      # que solo las tocase no dispararía nada sin esta ruta — y el gate es lo único que impide
      # que un tag que no publica nada salga verde.
      - "scripts/release-gate.sh"
      - "scripts/release-gate.test.sh"
  pull_request:
    paths:
      - "apps/tauri/**"
      - "crates/tauri-plugin-erplora-android/**"
      - ".github/workflows/test-shell.yml"
      # `android_local_network.rs` lee este workflow: comprueba que el job de release sigue
      # leyendo los permisos DEL APK construido (hub#337). Sin esta ruta, un PR que solo tocase
      # el release podría quitar ese paso sin que la guarda llegase a correr.
      - ".github/workflows/tauri-release.yml"
      # Las reglas del `release-gate` (hub#895) y su test: viven en `scripts/`, así que un cambio
      # que solo las tocase no dispararía nada sin esta ruta — y el gate es lo único que impide
      # que un tag que no publica nada salga verde.
      - "scripts/release-gate.sh"
      - "scripts/release-gate.test.sh"
  workflow_dispatch:

concurrency:
  group: test-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `setup-android` baja las command line tools de `dl.google.com`, y desde `ci-runner-1` ese host
  # contesta **404 por IPv6**, que Node prefiere. Es de la máquina, no del paso: le pasa a
  # cualquier acción JS que descargue de Google (hub#878, vivido en `v1.1.0`).
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  test:
    name: cargo test -p erplora-tauri + Kotlin del plugin
    # El único workflow del repo que la PR del interruptor (#837) dejó fuera. No tiene nada de
    # especial: instala él mismo sus deps GTK con `sudo apt-get`, cosa que el usuario `runner`
    # puede hacer en `ci-runner-1`.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30

    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ANTES de las deps de sistema a propósito: dura menos de un segundo y no necesita nada de
      # la máquina, así que un fallo suyo se ve enseguida en vez de después de compilar el stack
      # Tauri entero. Son las reglas del `release-gate` de `tauri-release.yml` (hub#895) — el job
      # que hace que «tag verde» signifique «publicado». Su único otro sitio de ejecución sería un
      # tag, que no se puede re-lanzar.
      - name: Release gate rules (scripts/release-gate.test.sh)
        run: ./scripts/release-gate.test.sh

      # Deps de sistema de tauri v2 en Linux (webview + GTK). Sin appindicator/librsvg:
      # el shell no usa tray y aquí no se bundlea.
      - name: System deps (webkit2gtk + GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # `rustup` viene de serie en la imagen de GitHub, pero en `ci-runner-1` es un fichero más
      # que algo puede borrar — y algo lo borró (ver el `cache-bin: false` de abajo). Un runner
      # que se repara solo es lo que separa «un job en rojo» de «media tarde de CI parada».
      - name: Toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup ausente en este runner — instalándolo (no toca ni el PATH ni los toolchains)"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show

      # 🔴 `cache-bin: false` NO es una optimización. Por defecto esta acción cachea
      # `$CARGO_HOME/bin`, y su paso `Post` lo LIMPIA («... Cleaning cargo/bin ...») borrando el
      # binario `rustup` y dejando los 13 shims (`cargo`, `rustc`, …) apuntando a la nada.
      # En un runner de GitHub da igual: la máquina se tira al acabar el job. En `ci-runner-1`
      # persiste, así que el job SIGUIENTE —cualquiera, de cualquier repo— muere con
      # `rustup: command not found` en 12 s, un rojo que no se parece en nada a su causa.
      # Vivido el 2026-08-11 a las 20:48 UTC: dejó sin CI de Rust a toda la máquina.
      #
      # 🔴 `save-if` off on our own runner, and it is not an optimisation either. The same `Post`
      # also runs `cleanRegistry`, which `rmRF`s every non-`-sys` directory under
      # `~/.cargo/registry/src`. The two slots of `ci-runner-1` share ONE `$HOME`, so that delete
      # lands on whatever the OTHER slot is compiling right now: on v1.1.1 a `Cleaning cargo
      # registry` at 00:54:22 killed the concurrent Android release build 8 s later with `could
      # not parse/generate dep info ... No such file or directory` (hub#886). `tauri-release.yml`
      # was guarded first; this workflow prunes the very same registry, so it needs the same
      # guard. `save-if: false` returns BEFORE cleaning anything (rust-cache `save.ts`), so the
      # restore still works and hosted runners — which die with the job — still save.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ runner.environment != 'self-hosted' }}

      - name: cargo test -p erplora-tauri
        run: cargo test -p erplora-tauri -p tauri-plugin-erplora-android

      # ── Tests Kotlin del plugin de Android (hub#933) ────────────────────────────────────────
      #
      # `cargo test` de arriba es RUST. La lógica de qué permiso se pide en cada nivel de API y de
      # cómo se habla con una impresora SPP vive en KOTLIN, con sus 34 tests — y hasta hub#933 el
      # ÚNICO sitio donde se ejecutaban era el job `build-android` de `tauri-release.yml`, que
      # dispara con tag o a mano. Un test que solo corre al publicar no protege nada: el SPP
      # (`48f2b0e1`) dejó una expectativa caducada y `develop` estuvo un día entero en rojo sin que
      # un solo check se pusiera en ámbar. El siguiente tag se lo habría comido en plena release.
      #
      # Van como PASOS de este job, no como job aparte, a propósito: desde el 2026-08-12 el CI
      # serializa en una sola máquina y un job nuevo es una ranura más de cola. Aquí no cuestan
      # ranura, y el disparador ya es el correcto — este workflow filtra por
      # `crates/tauri-plugin-erplora-android/**`, que es justo el árbol que cubren.
      #
      # No se paga el build de Android: `android-tests/` es una raíz Gradle mínima sin `:app`, así
      # que NO hace falta NDK, ni tauri-cli, ni compilar Rust para cuatro triples. Medido en este
      # árbol: 22 s en frío, 1 s en caliente.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Solo la plataforma y las build-tools: el NDK es para compilar Rust a Android y aquí no se
      # compila Rust. Es la diferencia entre un paso de segundos y el job de release.
      - name: Android platform 36 (sin NDK)
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Después del `cargo test`: el script saca el SDK Kotlin de `tauri` del crate ya
      # DESEMPAQUETADO en el registry, y quien lo desempaqueta es el build de arriba.
      - name: Kotlin unit tests (plugin de permisos + SPP)
        run: ./scripts/kotlin-plugin-tests.sh

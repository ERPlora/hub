name: rollback

# Manual: puts the hub's services of one environment back on the ACTIVE revision right before the
# one they run and records its image tag (ecs-rollback.sh): hub and worker in prod (run it on main),
# hub-pre and worker-pre in pre (run it on pre; deploy-env.sh checks the branch). Migrations are not
# undone. Scheduled hub tasks of prod run the latest ACTIVE worker revision, so they keep the newer
# image: to go back everywhere, run deploy with the previous release instead.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment of the branch the run starts from (main = prod, pre = pre)
        type: choice
        options: [prod, pre]
        default: prod
      confirm:
        description: Type ROLLBACK to put the hub's services back on their previous revision (migrations are not undone)
        type: string
        required: true

permissions:
  contents: read

# Shares the deploy group of its branch: a rollback never runs during a deploy of the same
# environment, nor the other way round.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # gha-deploy-hub or gha-deploy-hub-pre (OIDC)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # Before assuming the role; ecs-rollback.sh checks CONFIRM again.
      - name: Check the confirmation and the repository variables
        run: |
          if [ "$CONFIRM" != ROLLBACK ]; then
            echo "::error::type ROLLBACK to confirm, not '$CONFIRM'; nothing was changed"
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "::error::empty repository variables: AWS_REGION (aws-next README, step 19)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same check as deploy.yml: main -> prod, pre -> pre, the environment asked must be the
      # branch's, and its deploy role must be set (never the other environment's).
      - name: Pick the environment of the branch
        id: target
        env:
          PROJECT: hub
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN_PRE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRE }}
        run: bash .github/scripts/deploy-env.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll the hub's services back
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: bash .github/scripts/ecs-rollback.sh

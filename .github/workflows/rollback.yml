name: rollback

# Manual: puts hub and worker back on the ACTIVE revision right before the one they run and
# records its image tag (ecs-rollback.sh). Migrations are not undone. Scheduled hub tasks run the
# latest ACTIVE worker revision, so they keep the newer image: to go back everywhere, run deploy
# with the previous release instead.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ROLLBACK to put hub and worker back on their previous revision (migrations are not undone)
        type: string
        required: true

permissions:
  contents: read

# Shares the deploy group: a rollback never runs during a deploy, nor the other way round.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # gha-deploy-hub (OIDC)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # Before assuming the role; ecs-rollback.sh checks CONFIRM again.
      - name: Check the confirmation, the repository variables and the branch
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ "$CONFIRM" != ROLLBACK ]; then
            echo "::error::type ROLLBACK to confirm, not '$CONFIRM'; nothing was changed"
            exit 1
          fi
          missing=""
          for var in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::empty repository variables:$missing (aws-next README, step 19)"
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::rollbacks run only from main, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll hub and worker back
        run: bash .github/scripts/ecs-rollback.sh

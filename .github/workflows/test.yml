name: test

# The tests of every push (ci.yml on any branch but main and pre, and on each entry of the merge queue;
# deploy.yml on main and pre before it deploys), in four jobs that run side by side: python (pytest over Postgres, in a matrix of shards,
# each spread over its runner's CPUs with pytest-xdist, on the tests the job select chose), frontend (the SPA's lint, typecheck, Vitest and build),
# scripts (workflow and script lints and the script tests) and smoke (the browser smoke). The job `test` waits for the
# four: called as the job `test`, its check is "test / test", the one main and pre require.

on:
  workflow_call:
    inputs:
      affected-base:
        description: >-
          The ref a working branch is compared with, so that pytest runs only the tests of the apps it changes and of
          the apps that depend on them (scripts/affected_tests.py). Empty runs the whole suite, as main, pre and the
          merge queue do.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Which tests python runs and in how many shards: the whole suite, or for a branch whose changes stay inside the apps'
  # folders, its own test modules and the few files only some tests read (the size allow list, the e2e specs, the
  # WORKBOOKs), the tests of those apps and of the apps that depend on them, those test modules and the tests that read
  # those files, in as few shards as they need. Anything it cannot work out runs the whole suite, with a warning in the log.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      paths: ${{ steps.affected.outputs.paths }}
      shards: ${{ steps.affected.outputs.shards }}
    steps:
      # The whole history, origin/main included: the branch is compared with where it left it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tests this push runs
        id: affected
        env:
          AFFECTED_BASE: ${{ inputs.affected-base }}
        run: python3 scripts/affected_tests.py --base "$AFFECTED_BASE" --shards 3 >> "$GITHUB_OUTPUT"

  # pytest in shards (hub#1185): the suite grows every day and GitHub's runners take from 18 to 29 min over the same
  # commit, so a single job of 30 minutes was cut without a failing test, PRs and main's deploy with it. Each job of
  # the matrix runs its share of the tests select chose (.github/scripts/pytest-shard.sh, from the job's index and the
  # matrix's size, so the shards always cover all of them) and warns past 20 minutes: then the whole suite needs
  # another shard (select's --shards). A failing shard cancels none of the others, so every failure shows; "test / test"
  # needs them all.
  python:
    needs: [select]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # DEBUG is off unless set: the suite runs with the development settings, like a local .env.
      DEBUG: "True"
      # The defaults of config/settings/backends.py, spelled out; pytest creates test_hub_next_gw<N>, one per
      # xdist worker.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: hub
      DB_USER: hub
      DB_PASSWORD: hub
    steps:
      # packages/live and packages/ui are public submodules (ERPlora/live, ERPlora/ui): no token. The whole history,
      # origin/main included: tests/test_guardrails_size.py compares the size allow list with the one where the branch
      # left main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      # WeasyPrint's libraries (base/pdf.py), as the Dockerfile installs them. Their .deb files live in GitHub's
      # cache, one entry per runner image and per version of this file (where the package list is), so a run installs
      # them without Ubuntu's mirror: a DNS outage of the mirror kept every run red for hours (hub#1222). Without the
      # cache, apt-install.sh downloads them, retrying the mirror, and they are saved right away: the end of the job
      # would only save them once every test of the shard passed, minutes later.
      - name: The runner image
        id: runner-image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: WeasyPrint's libraries from GitHub's cache
        id: apt-archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: WeasyPrint's libraries
        run: bash .github/scripts/apt-install.sh ~/.cache/apt-archives libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: WeasyPrint's libraries into GitHub's cache
        if: steps.apt-archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      # PostgreSQL 18's client, as the Dockerfile's postgresql-client-18: base/tenancy/dumps.py copies a hub's database
      # with pg_dump (and its tests read the copy with pg_restore). The runner's own client is older, and pg_dump refuses
      # a newer server, so 18's bin goes first in the PATH.
      - name: PostgreSQL 18's client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      # apps/verifactu/tests/test_producer.py checks the producer's constants against the signed declaration
      # the SaaS publishes, and fails in CI without it: its public/declaracion is fetched next to the Hub
      # (../saas), as in the erplora-next tree. Every clone goes through clone-repo.sh, as the job's read-only
      # token and with retries: GitHub refuses anonymous clones from its runners at times.
      - name: The SaaS's signed declaration
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/clone-repo.sh ERPlora/saas ../saas public/declaracion
      # The seeds' images must be in the shared image library's manifest (base/tests/test_seed_images.py), and the
      # templates load them from it: its img/ is fetched beside the Hub (../blueprints), where config/settings/web.py
      # looks for it without a bucket (CATALOG_DIR).
      - name: The shared image library
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/clone-repo.sh ERPlora/blueprints ../blueprints img
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: uv.lock must match pyproject.toml.
      - run: uv sync --locked
      # This job's shard of the paths select chose (none: the whole suite), with one xdist worker per vCPU of the
      # runner (4), each on its own test database, and its slowest tests at the end of the log.
      - name: pytest, this job's shard of the suite
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          PYTEST_PATHS: ${{ needs.select.outputs.paths }}
        run: |
          read -ra paths <<< "$PYTEST_PATHS"
          bash .github/scripts/pytest-shard.sh "$SHARD_INDEX" "$SHARD_TOTAL" 20 -q -n 4 --durations=20 "${paths[@]}"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # packages/ui is part of the pnpm workspace; packages/live, of the uv project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # tests/e2e/fernet-keys.test.ts (Vitest) asks the Hub's settings through `uv run python`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # tests/e2e/saas-names.ts (Vitest) checks the scripts the e2e runs inside the SaaS, as the real-provider seed,
      # against the SaaS of main, cloned beside the Hub (../saas) as in the erplora-next tree: with its live submodule,
      # the .env of a new checkout and its dependencies.
      - name: The SaaS beside the Hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/clone-repo.sh ERPlora/saas ../saas
      # Without the token: these run the SaaS's own setup.
      - name: The SaaS's dependencies
        run: |
          git -C ../saas submodule update --init --depth 1 packages/live
          cp ../saas/.env.example ../saas/.env
          uv sync --locked --directory ../saas
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The workflows and .github/scripts only: no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # download-tool.sh retries a passing error of GitHub (a 5xx, a cut connection) and checks the pin.
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bash .github/scripts/download-tool.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint the scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh
      - name: Script tests
        run: for t in .github/scripts/*.test.sh; do bash "$t"; done

  # The browser smoke (smoke-e2e.sh, README «El humo de navegador»): the tests tagged @smoke, in the runner's Chrome, on
  # the stack scripts/nightly_e2e.py builds around this commit, so a change that breaks one of those walks cannot be merged.
  # The smoke's groups enter here one at a time, each after three green runs in a row of this job: --spec names the
  # specs already in. Every group is in, so the job runs every @smoke test, as on the Mac.
  smoke:
    runs-on: ubuntu-24.04
    # Measured from 14 min 12 s to 16 min 34 s a run, the stack included: twice the slowest, as GitHub's runners vary
    # that much on the same commit. A spec that enters measures it again.
    timeout-minutes: 34
    permissions:
      contents: read
    steps:
      # The whole history, as nightly_e2e.py expects of a clone: it fetches origin and checks this commit out in a
      # worktree of its own, with its submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The erplora-next tree nightly_e2e.py expects around the Hub: the SaaS of origin/main in ../saas (every login
      # goes through erplora.com), the shared image library in ../blueprints and compose.yaml's Postgres in .., which
      # the specs reach with `docker compose exec`. Each checkout gets the .env of a new one.
      - name: The SaaS, the image library and Postgres beside the Hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/clone-repo.sh ERPlora/saas ../saas
          bash .github/scripts/clone-repo.sh ERPlora/blueprints ../blueprints img
          cp .env.example .env
          cp ../saas/.env.example ../saas/.env
          cat > ../compose.yaml <<'YAML'
          services:
            postgres:
              image: pgvector/pgvector:pg18
              environment:
                POSTGRES_USER: hub
                POSTGRES_PASSWORD: hub
                POSTGRES_DB: hub
              ports:
                - "5432:5432"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
                interval: 2s
                timeout: 3s
                retries: 30
          YAML
          docker compose -f ../compose.yaml up -d --wait
      - name: The browser smoke
        env:
          NIGHTLY_DIR: ${{ runner.temp }}/hub-smoke-e2e
        run: >-
          bash .github/scripts/smoke-e2e.sh
          --spec tests/e2e/login-and-shell.spec.ts
          --spec tests/e2e/base-access.spec.ts
          --spec tests/e2e/base-sign-out.spec.ts
          --spec tests/e2e/base-session-revoke.spec.ts
          --spec tests/e2e/employee-permissions.spec.ts
          --spec tests/e2e/two-orgs-isolated.spec.ts
          --spec tests/e2e/hub-suspended.spec.ts
          --spec tests/e2e/sale-pos.spec.ts
          --spec tests/e2e/sale-cash-gate.spec.ts
          --spec tests/e2e/cash-register-shift.spec.ts
          --spec tests/e2e/printing-sale.spec.ts
          --spec tests/e2e/sale-fiscal-qr.spec.ts
          --spec tests/e2e/sale-invoice-chain.spec.ts
          --spec tests/e2e/invoice-sale.spec.ts
          --spec tests/e2e/invoice-manual.spec.ts
          --spec tests/e2e/verifactu-records.spec.ts
          --spec tests/e2e/kitchen-pos.spec.ts
          --spec tests/e2e/sale-table.spec.ts
          --spec tests/e2e/table-floor.spec.ts
          --spec tests/e2e/appointment-agenda.spec.ts
          --spec tests/e2e/appointment-charge.spec.ts
          --spec tests/e2e/service-catalog.spec.ts
          --spec tests/e2e/service-vouchers.spec.ts
          --spec tests/e2e/sale-voucher.spec.ts
          --spec tests/e2e/base-sign-up-taxes-on.spec.ts
          --spec tests/e2e/base-app-activation.spec.ts
          --spec tests/e2e/demo.spec.ts
          --spec tests/e2e/two-tabs-live.spec.ts
      # The run's log, both runservers' logs and Playwright's output (each failed test's trace and screenshot).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: ${{ runner.temp }}/hub-smoke-e2e/runs/
          if-no-files-found: ignore
          retention-days: 14

  # The check main and pre require ("test / test"): green only when the four jobs are. It runs even
  # when one fails or is skipped, so the check never ends up skipped (which counts as passed). Not in a
  # cancelled run (a newer push to the branch replaces it): it would wait for a runner and hold the new run.
  test:
    needs: [python, frontend, scripts, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every test job passed
        env:
          RESULTS: >-
            python=${{ needs.python.result }} frontend=${{ needs.frontend.result }} scripts=${{ needs.scripts.result }}
            smoke=${{ needs.smoke.result }}
        run: |
          failed=""
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              failed="$failed $result"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::not every test job passed:$failed"
            exit 1
          fi
          echo "python, frontend, scripts and smoke passed"

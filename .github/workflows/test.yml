name: test

# The tests of every push (ci.yml on any branch but main and pre; deploy.yml on main and pre before
# it deploys), in three jobs that run side by side: python (pytest over Postgres, spread over the
# runner's CPUs with pytest-xdist), frontend (the SPA's lint, typecheck, Vitest and build) and
# scripts (workflow and script lints and the script tests). The job `test` waits for the three: called
# as the job `test`, its check is "test / test", the one main and pre require.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # DEBUG is off unless set: the suite runs with the development settings, like a local .env.
      DEBUG: "True"
      # The defaults of config/settings.py, spelled out; pytest creates test_hub_next_gw<N>, one per
      # xdist worker.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: hub
      DB_USER: hub
      DB_PASSWORD: hub
    steps:
      # packages/live and packages/ui are public submodules (ERPlora/live, ERPlora/ui): no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # WeasyPrint's libraries (apps/invoice/pdf.py), as the Dockerfile installs them.
      - name: WeasyPrint's libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      # apps/verifactu/tests/test_producer.py checks the producer's constants against the signed declaration
      # the SaaS publishes, and fails in CI without it: ERPlora/saas is public, so its public/declaracion is
      # fetched next to the Hub (../saas), as in the erplora-next tree. No token.
      - name: The SaaS's signed declaration
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/ERPlora/saas.git ../saas
          git -C ../saas sparse-checkout set public/declaracion
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: uv.lock must match pyproject.toml.
      - run: uv sync --locked
      # One xdist worker per vCPU of the runner (4), each on its own test database.
      - run: uv run --locked pytest -q -n 4

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # packages/ui is part of the pnpm workspace; packages/live, of the uv project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # tests/e2e/certificate-key.test.ts (Vitest) asks the Hub's settings through `uv run python`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The workflows and .github/scripts only: no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint the scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh
      - name: Script tests
        run: for t in .github/scripts/*.test.sh; do bash "$t"; done

  # The check main and pre require ("test / test"): green only when the three jobs are. It runs even
  # when one fails or the run is cancelled, so the check never ends up skipped (which counts as passed).
  test:
    needs: [python, frontend, scripts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every test job passed
        env:
          RESULTS: python=${{ needs.python.result }} frontend=${{ needs.frontend.result }} scripts=${{ needs.scripts.result }}
        run: |
          failed=""
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              failed="$failed $result"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::not every test job passed:$failed"
            exit 1
          fi
          echo "python, frontend and scripts passed"

name: test

# The tests of every push (ci.yml on any branch but main and pre; deploy.yml on main and pre before
# it deploys), in three jobs that run side by side: python (pytest over Postgres, in a matrix of shards,
# each spread over its runner's CPUs with pytest-xdist), frontend (the SPA's lint, typecheck, Vitest and build) and
# scripts (workflow and script lints and the script tests). The job `test` waits for the three: called
# as the job `test`, its check is "test / test", the one main and pre require.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # pytest in shards (hub#1185): the suite grows every day and GitHub's runners take from 18 to 29 min over the same
  # commit, so a single job of 30 minutes was cut without a failing test, PRs and main's deploy with it. Each job of
  # the matrix runs its share (.github/scripts/pytest-shard.sh, from the job's index and the matrix's size, so the
  # shards always cover the whole suite) and warns past 20 minutes: then the matrix gets another shard. A failing shard
  # cancels none of the others, so every failure shows; "test / test" needs them all.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # DEBUG is off unless set: the suite runs with the development settings, like a local .env.
      DEBUG: "True"
      # The defaults of config/settings.py, spelled out; pytest creates test_hub_next_gw<N>, one per
      # xdist worker.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: hub
      DB_USER: hub
      DB_PASSWORD: hub
    steps:
      # packages/live and packages/ui are public submodules (ERPlora/live, ERPlora/ui): no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # WeasyPrint's libraries (apps/invoice/pdf.py), as the Dockerfile installs them. Their .deb files live in GitHub's
      # cache, one entry per runner image and per version of this file (where the package list is), so a run installs
      # them without Ubuntu's mirror: a DNS outage of the mirror kept every run red for hours (hub#1222). Without the
      # cache, apt-install.sh downloads them, retrying the mirror, and they are saved right away: the end of the job
      # would only save them once every test of the shard passed, minutes later.
      - name: The runner image
        id: runner-image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: WeasyPrint's libraries from GitHub's cache
        id: apt-archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: WeasyPrint's libraries
        run: bash .github/scripts/apt-install.sh ~/.cache/apt-archives libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: WeasyPrint's libraries into GitHub's cache
        if: steps.apt-archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-archives.outputs.cache-primary-key }}
      # PostgreSQL 18's client, as the Dockerfile's postgresql-client-18: base/tenancy/dumps.py copies a hub's database
      # with pg_dump (and its tests read the copy with pg_restore). The runner's own client is older, and pg_dump refuses
      # a newer server, so 18's bin goes first in the PATH.
      - name: PostgreSQL 18's client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      # apps/verifactu/tests/test_producer.py checks the producer's constants against the signed declaration
      # the SaaS publishes, and fails in CI without it: ERPlora/saas is public, so its public/declaracion is
      # fetched next to the Hub (../saas), as in the erplora-next tree. No token.
      - name: The SaaS's signed declaration
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/ERPlora/saas.git ../saas
          git -C ../saas sparse-checkout set public/declaracion
      # The seeds' images must be in the shared image library's manifest (base/tests/test_seed_images.py), and the
      # templates load them from it: ERPlora/blueprints is public, so its img/ is fetched beside the Hub
      # (../blueprints), where config/settings.py looks for it without a bucket (CATALOG_DIR). No token.
      - name: The shared image library
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/ERPlora/blueprints.git ../blueprints
          git -C ../blueprints sparse-checkout set img
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: uv.lock must match pyproject.toml.
      - run: uv sync --locked
      # This job's shard, with one xdist worker per vCPU of the runner (4), each on its own test database, and its
      # slowest tests at the end of the log.
      - name: pytest, this job's shard of the suite
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: bash .github/scripts/pytest-shard.sh "$SHARD_INDEX" "$SHARD_TOTAL" 20 -q -n 4 --durations=20

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # packages/ui is part of the pnpm workspace; packages/live, of the uv project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # tests/e2e/fernet-keys.test.ts (Vitest) asks the Hub's settings through `uv run python`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The workflows and .github/scripts only: no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # download-tool.sh retries a passing error of GitHub (a 5xx, a cut connection) and checks the pin.
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bash .github/scripts/download-tool.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint the scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh
      - name: Script tests
        run: for t in .github/scripts/*.test.sh; do bash "$t"; done

  # The check main and pre require ("test / test"): green only when the three jobs are. It runs even
  # when one fails or the run is cancelled, so the check never ends up skipped (which counts as passed).
  test:
    needs: [python, frontend, scripts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every test job passed
        env:
          RESULTS: python=${{ needs.python.result }} frontend=${{ needs.frontend.result }} scripts=${{ needs.scripts.result }}
        run: |
          failed=""
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              failed="$failed $result"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::not every test job passed:$failed"
            exit 1
          fi
          echo "python, frontend and scripts passed"

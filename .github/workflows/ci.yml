name: ci

# Every push to a working branch runs the tests (test.yml), with the same check as deploy.yml:
# "test / test". main and pre run them in deploy.yml, before they deploy.

on:
  push:
    branches-ignore: [main, pre]

permissions:
  contents: read

# A newer push to the same branch supersedes the run of the older one (as in the SaaS).
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

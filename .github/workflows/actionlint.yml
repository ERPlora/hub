# ==============================================================================
# actionlint — PR gate for the workflow files themselves (hub#652)
#
# Why this exists: three times a broken `build-hub.yml` froze the fleet image
# (`ghcr.io/erplora/hub:latest`) in TOTAL silence — ~2 days in July (duplicate
# `build-args` key, #238), 4 days in August (vue-tsc, now covered by test-web),
# ~13.5 h on 08-09 (duplicate `id: tags`, hub#515). When GitHub cannot parse a
# workflow the run "fails" with 0 jobs, 0 s, no logs — and no PR check watched
# these files, so the breakage merged unnoticed every time.
#
# actionlint catches BOTH historical parse-killers before merge (verified with
# this exact invocation, 2026-08-13):
#   - duplicate map key   → `key "build-args" is duplicated ... [syntax-check]`
#   - duplicate step id   → `step ID "tags" duplicates ... [id]`
#
# It lints ALL workflows, not only the changed ones: a develop→main batch can
# resurrect an old broken step in a file the PR does not list as changed.
#
# External-tool integrations (`shellcheck`, `pyflakes`) are DISABLED on purpose:
#   - they depend on what happens to be installed on the runner (a clean
#     self-hosted Ubuntu has no shellcheck; GitHub's ubuntu-latest does), which
#     would make the gate's verdict depend on where it ran;
#   - this gate exists to catch what makes GitHub refuse to RUN a workflow, not
#     to lint shell style — and the existing workflows carry two pre-existing
#     shellcheck warnings (tauri-release.yml, test-hub.yml) that would turn the
#     gate red on files out of its scope.
#
# Where it runs: same `CI_RUNNER_LABEL` switch as the other workflows — the
# dedicated `ci-runner-1` when the org Variable is set, GitHub's cheap default
# `ubuntu-latest` otherwise. The job is seconds long either way.
# ==============================================================================

name: Lint Workflows (actionlint)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # El test de contrato de abajo vive fuera de `.github/`, así que sin esto una PR que
      # SOLO tocara el test no lo ejecutaría.
      - 'scripts/tests/test-hub-modules-workflow.test.sh'
      - 'scripts/tests/canonical-mirrors-workflow.test.sh'
      - 'scripts/tests/visual-baselines-workflow.test.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (all workflows)
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned version + official downloader (a ~3 MB static Go binary; no
      # package manager involved, so it works the same on ci-runner-1 and on
      # ubuntu-latest). Bump the version deliberately, not via a moving tag.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"

      - name: Lint all workflows
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color -shellcheck= -pyflakes=

      # ── Contrato de `test-hub-modules.yml` (hub#1239) ────────────────────────────────
      # actionlint comprueba que un workflow es EJECUTABLE; esto comprueba que uno concreto
      # sigue diciendo lo que la ADR «El Hub se CIERRA como KERNEL» le exige decir: que corre
      # en las PRs que tocan las seis superficies del kernel, que su fallo abre una issue en
      # vez de callarse, y que acepta el aviso de un módulo recién publicado.
      #
      # Vive AQUÍ y no dentro del propio `test-hub-modules.yml` a propósito: ese job se
      # dispara por su propio filtro `paths`, así que una PR que borrase esa entrada del
      # filtro tampoco ejecutaría al guardia que lo protege. Este workflow se dispara con
      # CUALQUIER cambio bajo `.github/workflows/`, que es lo que rompe el círculo. Y cuesta
      # segundos, no los 45 min del job de módulos.
      - name: Python (el test parsea el YAML de verdad, no lo grepea)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `pip install` explícito en vez de fiarse del `python3-yaml` del sistema: un Ubuntu
      # limpio NO es la imagen de GitHub (ci-runner-1 ya nos costó eso con `gh` y con `python`),
      # y un rojo por una librería ausente es el rojo más caro de diagnosticar.
      - name: Contrato de test-hub-modules.yml (hub#1239)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash ./scripts/tests/test-hub-modules-workflow.test.sh

      # ── Contrato de `canonical-mirrors.yml` (hub#1261) ───────────────────────────────
      # Mismo razonamiento y misma razón para vivir AQUÍ: `canonical-mirrors.yml` se dispara
      # por su propio filtro `paths`, así que una PR que borrase una ruta de ese filtro
      # tampoco ejecutaría al guardia que lo protege. Lo que comprueba: que las rutas de las
      # superficies vendorizadas por el toolkit —`contracts/kernel/**` incluida— siguen en el
      # filtro, en los DOS bloques (`pull_request` y `push`), y que el paso que gatean sigue
      # siendo la comparación de los espejos.
      #
      # pyyaml ya está instalado por el paso de arriba.
      - name: Contrato de canonical-mirrors.yml (hub#1261)
        run: |
          set -euo pipefail
          bash ./scripts/tests/canonical-mirrors-workflow.test.sh

      # ── Contrato de `visual-baselines.yml` (hub#1250) ────────────────────────────────
      # Mismo razonamiento: sin este paso, una PR que rompiera el workflow de regeneración de
      # baselines visuales (trigger automático colado, grupo de concurrencia compartido con
      # test-web.yml, filtro de specs perdido) no lo notaría nadie hasta el primer dispatch real
      # — y ese dispatch es manual y poco frecuente, así que el hueco podría durar semanas.
      - name: Contrato de visual-baselines.yml (hub#1250)
        run: |
          set -euo pipefail
          bash ./scripts/tests/visual-baselines-workflow.test.sh

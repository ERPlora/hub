# ==============================================================================
# actionlint — PR gate for the workflow files themselves (hub#652)
#
# Why this exists: three times a broken `build-hub.yml` froze the fleet image
# (`ghcr.io/erplora/hub:latest`) in TOTAL silence — ~2 days in July (duplicate
# `build-args` key, #238), 4 days in August (vue-tsc, now covered by test-web),
# ~13.5 h on 08-09 (duplicate `id: tags`, hub#515). When GitHub cannot parse a
# workflow the run "fails" with 0 jobs, 0 s, no logs — and no PR check watched
# these files, so the breakage merged unnoticed every time.
#
# actionlint catches BOTH historical parse-killers before merge (verified with
# this exact invocation, 2026-08-13):
#   - duplicate map key   → `key "build-args" is duplicated ... [syntax-check]`
#   - duplicate step id   → `step ID "tags" duplicates ... [id]`
#
# It lints ALL workflows, not only the changed ones: a develop→main batch can
# resurrect an old broken step in a file the PR does not list as changed.
#
# External-tool integrations (`shellcheck`, `pyflakes`) are DISABLED on purpose:
#   - they depend on what happens to be installed on the runner (a clean
#     self-hosted Ubuntu has no shellcheck; GitHub's ubuntu-latest does), which
#     would make the gate's verdict depend on where it ran;
#   - this gate exists to catch what makes GitHub refuse to RUN a workflow, not
#     to lint shell style — and the existing workflows carry two pre-existing
#     shellcheck warnings (tauri-release.yml, test-hub.yml) that would turn the
#     gate red on files out of its scope.
#
# Where it runs: same `CI_RUNNER_LABEL` switch as the other workflows — the
# dedicated `ci-runner-1` when the org Variable is set, GitHub's cheap default
# `ubuntu-latest` otherwise. The job is seconds long either way.
# ==============================================================================

name: Lint Workflows (actionlint)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      # Las composite actions son el OTRO sitio donde vive un `run:`. Sin esta entrada, una PR que
      # solo tocara una de ellas no ejecutaría la guardia de abajo — que ahora también las escanea.
      - '.github/actions/**'
      # El test de contrato de abajo vive fuera de `.github/`, así que sin esto una PR que
      # SOLO tocara el test no lo ejecutaría.
      - 'scripts/tests/test-hub-modules-workflow.test.sh'
      - 'scripts/tests/canonical-mirrors-workflow.test.sh'
      - 'scripts/tests/visual-baselines-workflow.test.sh'
      # The verdict `canonical-mirrors.yml` delegates to, and its tests (hub#1296): a PR that
      # only touched the classifier would otherwise run none of its cases.
      - 'scripts/canonical-mirrors-verdict.sh'
      - 'scripts/tests/canonical-mirrors-verdict.test.sh'
      # Contrato del lookup compartido de alertas (hub#1246): sin esto, una PR que solo tocara
      # `scripts/ci/alert-issue.sh` o uno de sus dos tests no ejecutaría ninguno de los dos.
      - 'scripts/ci/alert-issue.sh'
      - 'scripts/tests/alert-issue.test.sh'
      - 'scripts/tests/alert-issue-workflows.test.sh'
      # La lista revisada de e2e del kernel y su resolutor (hub#1359). Es lo que `test-hub-modules.yml`
      # ejecuta contra el catálogo publicado, así que una PR que solo tocara la lista —justo lo que
      # hace cada slice de hub#1264— no correría ninguno de sus casos sin estas tres rutas.
      - 'scripts/ci/kernel-e2e-targets.sh'
      - 'scripts/ci/kernel-e2e-targets.txt'
      - 'scripts/tests/kernel-e2e-targets.test.sh'
      # Y la OTRA mitad de esa lista (hub#1381): las baterías `*.hub.test.py|sh` que heredan la
      # cobertura de cada e2e retirado. Un slice de hub#1264 toca las dos listas en la misma PR,
      # así que sin estas rutas la PR que solo mueve la cobertura no correría sus casos.
      - 'scripts/ci/module-hub-batteries.sh'
      - 'scripts/ci/module-hub-batteries.txt'
      - 'scripts/tests/module-hub-batteries.test.sh'
      # Y el CORREDOR que las ejecuta (hub#1381). Sus casos son herméticos —servidor falso,
      # baterías falsas, admin de BD de mentira— y corren en segundos, así que no tienen por qué
      # esperar a los 45 min del job de módulos: una PR que solo toque el corredor se entera aquí.
      - 'scripts/ci/run-module-hub-batteries.sh'
      - 'scripts/tests/run-module-hub-batteries.test.sh'
      # El contrato del job que publica el SDK (hub#1308): vive fuera de `.github/`, así que sin
      # esta ruta una PR que solo tocara el guardarraíl no lo ejecutaría.
      - 'scripts/tests/publish-module-sdk-workflow.test.sh'
      # El guardia de los puertos de los service containers (hub#898). La regla que vigila vive
      # bajo `.github/workflows/**`, que ya está arriba: esta ruta es solo para que una PR que
      # toque ÚNICAMENTE el guardia ejecute sus propios casos.
      - 'scripts/tests/service-container-ports.test.sh'
      # La prosa de CI contra el `on:` real (hub#1438). Las DOS rutas hacen falta y por motivos
      # distintos: el guardia mismo, para que una PR que solo lo toque corra sus casos; y
      # `.githooks/pre-push`, porque es el ÚNICO fichero vigilado que no vive bajo
      # `.github/workflows/**` — y es justo donde estaba la afirmación peligrosa, la que describía
      # el gate local como una copia redundante de algo que ya corría gratis en Actions.
      - 'scripts/tests/ci-prose-matches-triggers.test.sh'
      - '.githooks/pre-push'
      # Y los propios e2e del kernel: la lista SOLO puede romperla una PR que añada o borre un
      # `crates/runtime/tests/*.rs`, y esa PR puede no tocar ninguna de las rutas de arriba. Lo
      # cubría el `pull_request` de `test-hub-modules.yml`, que hub#1362 retira (esos e2e pasan al
      # gate pre-push, y el gate resuelve con `cargo test --workspace`: nunca consulta la lista).
      # Sin esta entrada, un slice de hub#1264 que borra el `.rs` y olvida el `.txt` no encuentra
      # NINGÚN guardia antes de mergear y tumba `develop` en el push — el rojo de hub#1354 (hub#1369).
      - 'crates/runtime/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Borrador = sin CI. Las PRs nacen en borrador: se revisan y se corrigen SIN runs en marcha y la
    # suite corre UNA vez, al marcarlas listas (ready_for_review). Medido el 29/08: la mitad de los
    # minutos del runner se tiraban en runs cancelados por el re-push del revisor.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: actionlint (all workflows)
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned version + official downloader (a ~3 MB static Go binary; no
      # package manager involved, so it works the same on ci-runner-1 and on
      # ubuntu-latest). Bump the version deliberately, not via a moving tag.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"

      - name: Lint all workflows
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color -shellcheck= -pyflakes=

      # ── Contrato de `test-hub-modules.yml` (hub#1239) ────────────────────────────────
      # actionlint comprueba que un workflow es EJECUTABLE; esto comprueba que uno concreto
      # sigue diciendo lo que la ADR «El Hub se CIERRA como KERNEL» le exige decir: que corre
      # en las PRs que tocan las seis superficies del kernel, que su fallo abre una issue en
      # vez de callarse, y que acepta el aviso de un módulo recién publicado.
      #
      # Vive AQUÍ y no dentro del propio `test-hub-modules.yml` a propósito: ese job se
      # dispara por su propio filtro `paths`, así que una PR que borrase esa entrada del
      # filtro tampoco ejecutaría al guardia que lo protege. Este workflow se dispara con
      # CUALQUIER cambio bajo `.github/workflows/`, que es lo que rompe el círculo. Y cuesta
      # segundos, no los 45 min del job de módulos.
      - name: Python (el test parsea el YAML de verdad, no lo grepea)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `pip install` explícito en vez de fiarse del `python3-yaml` del sistema: un Ubuntu
      # limpio NO es la imagen de GitHub (ci-runner-1 ya nos costó eso con `gh` y con `python`),
      # y un rojo por una librería ausente es el rojo más caro de diagnosticar.
      - name: Contrato de test-hub-modules.yml (hub#1239)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash ./scripts/tests/test-hub-modules-workflow.test.sh

      # ── La PROSA de CI contra el `on:` real (hub#1438) ───────────────────────────────
      # Los contratos de arriba fijan la FORMA de un workflow; este fija lo que los ficheros
      # DICEN de sí mismos y unos de otros. Hacía falta porque nada ataba un comentario a su
      # bloque `on:`: `test-hub-modules.yml` documentaba un `pull_request` retirado por pm#197 y
      # lo repetía en la issue de alerta que abre —replicando la falsedad en cada detección—, y
      # `.githooks/pre-push` afirmaba que `test-hub.yml` corría la suite en cada PR, que es un
      # argumento para BORRAR el gate escrito dentro del propio gate. Sin él no queda nada
      # probando la Rust del hub antes de mergear.
      - name: Contrato de la prosa de CI (hub#1438)
        run: |
          set -euo pipefail
          bash ./scripts/tests/ci-prose-matches-triggers.test.sh

      # ── Contrato de `canonical-mirrors.yml` (hub#1261) ───────────────────────────────
      # Mismo razonamiento y misma razón para vivir AQUÍ: `canonical-mirrors.yml` se dispara
      # por su propio filtro `paths`, así que una PR que borrase una ruta de ese filtro
      # tampoco ejecutaría al guardia que lo protege. Lo que comprueba: que las rutas de las
      # superficies vendorizadas por el toolkit —`contracts/kernel/**` incluida— siguen en el
      # filtro, en los DOS bloques (`pull_request` y `push`), y que el paso que gatean sigue
      # siendo la comparación de los espejos.
      #
      # pyyaml ya está instalado por el paso de arriba.
      - name: Contrato de canonical-mirrors.yml (hub#1261)
        run: |
          set -euo pipefail
          bash ./scripts/tests/canonical-mirrors-workflow.test.sh

      # ── Contrato de `visual-baselines.yml` (hub#1250) ────────────────────────────────
      # Mismo razonamiento: sin este paso, una PR que rompiera el workflow de regeneración de
      # baselines visuales (trigger automático colado, grupo de concurrencia compartido con
      # test-web.yml, filtro de specs perdido) no lo notaría nadie hasta el primer dispatch real
      # — y ese dispatch es manual y poco frecuente, así que el hueco podría durar semanas.
      - name: Contrato de visual-baselines.yml (hub#1250)
        run: |
          set -euo pipefail
          bash ./scripts/tests/visual-baselines-workflow.test.sh
      # ── The verdict on the toolkit's copies (hub#1296) ──────────────────────────────────
      # `canonical-mirrors.yml` no longer takes the toolkit's byte-for-byte outcome as the
      # verdict: `scripts/canonical-mirrors-verdict.sh` re-reads it — a copy behind an additive
      # change warns, a retirement or a hand-edited copy fails. That script decides what merges,
      # so its cases (hermetic: a scratch git repo and a scratch toolkit) run here, on every PR
      # that can change it. Same reason as the two contracts above: seconds, and a guard nobody
      # runs is a shopping list.
      - name: Verdict on the toolkit's vendored copies (hub#1296)
        run: |
          set -euo pipefail
          bash ./scripts/tests/canonical-mirrors-verdict.test.sh
      # ── Contrato del lookup compartido de alertas (hub#1246) ─────────────────────────
      # `scripts/ci/alert-issue.sh` reemplaza el `gh issue list --search` (índice que va por
      # detrás de la realidad) por REST + filtro local en TODOS los pasos de alerta. Sin este
      # paso AQUÍ, el arreglo entero es memoria, no guardia: una PR que reintrodujera
      # `--search` en cualquiera de ellos, o rompiera el propio script, no ejecutaría ninguno
      # de sus dos tests — exactamente el hueco que `canonical-mirrors.yml` ya sufrió una vez
      # (hub#1260) por un filtro `paths` sin ensanchar.
      - name: Contrato de scripts/ci/alert-issue.sh (hub#1246)
        run: |
          set -euo pipefail
          bash ./scripts/tests/alert-issue.test.sh

      # pyyaml ya está instalado por el paso de arriba.
      # El contrato ya no lleva lista fija de workflows: recorre `.github/workflows/**` y
      # `.github/actions/**` y exige la delegación a CUALQUIER paso que toque una issue, así que
      # ni un workflow nuevo ni una composite action pueden quedarse fuera de la guardia por no
      # estar apuntados (hub#1327).
      - name: Contrato de los pasos de alerta de todos los workflows (hub#1246, hub#1327)
        run: |
          set -euo pipefail
          bash ./scripts/tests/alert-issue-workflows.test.sh

      # ── La lista revisada de e2e del kernel (hub#1359) ────────────────────────────────
      # `test-hub-modules.yml` ya no decide qué correr con un número mágico (`>= 30`), que era
      # una foto y no un contrato: cada slice de hub#1264 lo rompía y el único arreglo que
      # ofrecía era bajarlo. Ahora lo decide `scripts/ci/kernel-e2e-targets.txt`, comparada con
      # el árbol en las dos direcciones. Sus casos corren AQUÍ, en segundos, y no dentro del job
      # de módulos (45 min y su propio filtro `paths`): el último caso del fichero es la lista
      # real contra el árbol real, así que una PR que borre un `.rs` sin tocar la lista —o que
      # añada uno sin declararlo— se entera al revisar, no a las 3 de la mañana.
      - name: Lista revisada de e2e del kernel (hub#1359)
        run: |
          set -euo pipefail
          bash ./scripts/tests/kernel-e2e-targets.test.sh

      # ── La lista de baterías de módulo (hub#1381) ─────────────────────────────────────
      # La lista de arriba dice qué e2e del kernel SE FUERON; esta dice a qué batería se fueron,
      # y el guard comprueba que esa batería está de verdad en el módulo PUBLICADO. Sin ella, el
      # borrado del e2e apunta a nada comprobable: así se perdieron los 391 de
      # `services_package_redeem_e2e.rs` el 2026-08-30, con las dos CI en verde (hub#1372).
      # Sus casos corren AQUÍ, en segundos y sin catálogo (son herméticos); el contraste contra
      # los 27 módulos de verdad lo hace `test-hub-modules.yml`, que ya los materializa.
      - name: Lista de baterías de módulo (hub#1381)
        run: |
          set -euo pipefail
          bash ./scripts/tests/module-hub-batteries.test.sh

      # ── Y el corredor que las EJECUTA (hub#1381) ─────────────────────────────────────
      # La lista de arriba prueba que la batería ESTÁ; esta prueba que alguien la CORRE. Los casos
      # son herméticos y cubren justo los modos de fallo que dejan un verde vacío: un hub por
      # módulo (medido — compartirlo hace que las ventas de `cash_register` quemen números de
      # ticket que `invoice` afirma), una batería que sale 0 imprimiendo `SKIPPED`, un módulo que
      # no llegó a instalarse, una exención caducada, y un `docker exec -i` que se come la lista
      # de trabajo y deja la pasada a medias diciendo que pasó.
      - name: Corredor de baterías de módulo (hub#1381)
        run: |
          set -euo pipefail
          bash ./scripts/tests/run-module-hub-batteries.test.sh

      # ── El job que publica @erplora/module-sdk (hub#1308) ─────────────────────────────
      # El 403 de cada tag no era un permiso que faltara —el run imprime `Packages: write`—
      # sino la cuota de paquetes de la organización. Ese diagnóstico equivocado es justo el
      # que lleva a "arreglarlo" quitando `packages: write`, el `registry-url` o el `scope`,
      # o a taparlo con `continue-on-error`. Cada una de esas tres cosas rompe algo que hoy
      # está bien, y ninguna deja rojo en ningún otro sitio. Segundos, y corre también como
      # paso de `build-hub.yml`, que es el camino real a producción.
      - name: Contrato del job publish-module-sdk (hub#1308)
        run: |
          set -euo pipefail
          bash ./scripts/tests/publish-module-sdk-workflow.test.sh

      # ── Los puertos de los service containers (hub#898) ───────────────────────────────
      # hub#898 quitó los puertos de host fijos de los cinco workflows con Postgres, uno a uno, y
      # no dejó nada que sostuviera la regla. El saas reestrenó la MISMA incidencia el 2026-09-02
      # (saas#1790): su job de migraciones seguía con `5432:5432`, y como bloquea el deploy dejó
      # tres despliegues a PRE sin salir en 21 h. Las ranuras de `ci-runner-1` comparten un solo
      # demonio Docker, así que el segundo job concurrente muere en «Initialize containers» sin
      # un solo `FAILED` que buscar. Este paso es lo que impide el tercer estreno: recorre TODOS
      # los workflows, así que uno nuevo no puede quedarse fuera por no estar apuntado.
      - name: Puertos de los service containers (hub#898)
        run: |
          set -euo pipefail
          bash ./scripts/tests/service-container-ports.test.sh

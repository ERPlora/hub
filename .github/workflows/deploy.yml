name: deploy

# Push to main -> test, then build the hub image (tag = commit SHA), publish the release
# hub-vYYYY.MM.DD.N and deploy it to ECS (ecs-deploy.sh; aws-next README, "Contrato").
# Manual run with a release -> redeploy that release's image, without test nor build.
# Back to the previous revisions without a release: rollback.yml.
# The release is created here on purpose: one made with GITHUB_TOKEN triggers no other workflow.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: Release to redeploy (e.g. hub-v2026.10.13.1); empty = test, release and deploy main
        type: string
        required: false
        default: ""

# Each job asks for what it needs: id-token only in deploy, because the OIDC token of any job of
# a push to main carries the sub that gha-deploy-hub trusts (repo:ERPlora/hub:ref:refs/heads/main),
# and the test job runs third-party code (pnpm and uv installs).
permissions:
  contents: read

# Deploys and rollbacks (rollback.yml) of this repo never overlap; none is cancelled halfway.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    if: inputs.release == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # DEBUG is off unless set: the suite runs with the development settings, like a local .env.
      DEBUG: "True"
      # The defaults of config/settings.py, spelled out; pytest creates test_hub_next.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: hub
      DB_USER: hub
      DB_PASSWORD: hub
    steps:
      # packages/live and packages/ui are public submodules (ERPlora/live, ERPlora/ui): no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint the scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh
      - name: Script tests
        run: for t in .github/scripts/*.test.sh; do bash "$t"; done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # --locked: uv.lock must match pyproject.toml.
      - run: uv sync --locked
      - run: uv run --locked pytest -q

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # the Dockerfile's PNPM_VERSION and package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: test
    # A redeploy (release given) skips test on purpose.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (inputs.release != '' && needs.test.result == 'skipped')) }}
    # hub is public: the arm64 image builds natively on GitHub's free ARM runner; BUILD_RUNNER may
    # pick an x86 one, which builds through QEMU.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    permissions:
      contents: write # the GitHub Release
      id-token: write # gha-deploy-hub (OIDC)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Check the repository variables and the branch
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          missing=""
          for var in AWS_REGION AWS_DEPLOY_ROLE_ARN ALB_DNS_NAME; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::empty repository variables:$missing (aws-next README, step 19)"
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::deploys run only from main, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and the history: the version and the release notes
          submodules: recursive # packages/live and packages/ui, public: no token
          persist-credentials: false

      - name: Pick the commit to deploy
        id: commit
        run: |
          if [ -z "$RELEASE" ]; then
            sha="$GITHUB_SHA"
          else
            if ! [[ "$RELEASE" =~ ^hub-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
              echo "::error::'$RELEASE' is not a hub release (hub-vYYYY.MM.DD.N)"
              exit 1
            fi
            if ! sha="$(git rev-list -n 1 "refs/tags/$RELEASE" 2> /dev/null)"; then
              echo "::error::there is no release $RELEASE"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying the hub at $sha"


      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # Only on an x86 BUILD_RUNNER: the default ARM runner builds linux/arm64 natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.release == '' && runner.arch != 'ARM64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.release == ''
      - name: Build and push the image (linux/arm64)
        if: inputs.release == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: |
          image="$REGISTRY/erplora/hub:$IMAGE_TAG"
          # ECR tags are immutable: a re-run of the same commit keeps its image.
          if found="$(aws ecr describe-images --repository-name erplora/hub --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)"; then
            echo "$image is already in ECR"
            exit 0
          fi
          if [[ "$found" != *ImageNotFoundException* ]]; then
            echo "::error::cannot check erplora/hub:$IMAGE_TAG in ECR: $found"
            exit 1
          fi
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push -t "$image" .

      - name: Tag and publish the release
        if: inputs.release == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run of the same commit keeps its release.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'hub-v*')"
          if [ -n "$existing" ]; then
            echo "already released as $existing"
            exit 0
          fi
          tag="$(git tag --list 'hub-v*' | bash .github/scripts/next-version.sh hub "$(date -u +%Y.%m.%d)")"
          previous="$(git tag --list 'hub-v*' --sort=-v:refname | head -1)"
          # Notes: the commits since the previous release (all of them on the first one).
          git log --format='- %s (%h)' "${previous:+$previous..}$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "hub ${tag#hub-v}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released $tag"

      # ECR keeps the last 10 images (aws-next stacks/shared/ecr.tf): an old release may be gone.
      - name: Check the image exists
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: |
          if ! aws ecr describe-images --repository-name erplora/hub --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" > /dev/null; then
            echo "::error::erplora/hub:$IMAGE_TAG is not in ECR (expired by the retention of 10?)"
            exit 1
          fi

      - name: Register revisions, migrate, update the services
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: bash .github/scripts/ecs-deploy.sh

      # Through the ALB by name, so it also works before the DNS cutover.
      - name: Check /readyz on hubs.erplora.com
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --connect-to "hubs.erplora.com:443:${ALB_DNS_NAME}:443" \
            https://hubs.erplora.com/readyz

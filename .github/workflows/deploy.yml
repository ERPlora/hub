name: deploy

# Push to main -> test (test.yml), then build the hub image (tag = commit SHA), publish the release
# hub-vYYYY.MM.DD.N and deploy it to prod (ecs-deploy.sh; aws-next README, "Contrato").
# Push to pre -> test, then build the image into pre's own ECR repository (erplora/hub-pre) and deploy
# it to pre, the team's pre-production (hub-pre and worker-pre, hubs.pre.erplora.com), waking it up if
# its evening stop had put it to sleep. No release: releases are prod's.
# The branch picks the environment (deploy-env.sh): main -> prod, pre -> pre, anything else nothing.
# Manual run: on main with environment prod (and optionally a release -> redeploy that release's
# image, without test nor build), or on pre with environment pre.
# Back to the previous revisions without a release: rollback.yml.
# The release is created here on purpose: one made with GITHUB_TOKEN triggers no other workflow.

on:
  push:
    branches: [main, pre]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment of the branch the run starts from (main = prod, pre = pre)
        type: choice
        options: [prod, pre]
        default: prod
      release:
        description: Release to redeploy to prod (e.g. hub-v2026.10.13.1); empty = test, release and deploy the branch
        type: string
        required: false
        default: ""

# Each job asks for what it needs: id-token only in deploy, because the OIDC token of any job of
# a push to main (pre) carries the sub that gha-deploy-hub (gha-deploy-hub-pre) trusts
# (repo:ERPlora/hub:ref:refs/heads/main, …/pre), and the test job runs third-party code (pnpm and
# uv installs).
permissions:
  contents: read

# Deploys and rollbacks (rollback.yml) of one branch, and so of one environment, never overlap and
# none is cancelled halfway; prod and pre do not wait for each other.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    if: inputs.release == ''
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # A redeploy (release given) skips test on purpose.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (inputs.release != '' && needs.test.result == 'skipped')) }}
    # hub is public: the arm64 image builds natively on GitHub's free ARM runner; BUILD_RUNNER may
    # pick an x86 one, which builds through QEMU.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    permissions:
      contents: write # the GitHub Release (prod)
      id-token: write # gha-deploy-hub or gha-deploy-hub-pre (OIDC)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Check the repository variables
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          missing=""
          for var in AWS_REGION ALB_DNS_NAME; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::empty repository variables:$missing (aws-next README, step 19)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and the history: the version and the release notes
          submodules: recursive # packages/live and packages/ui, public: no token
          persist-credentials: false

      # main -> prod, pre -> pre, any other branch fails here; also its ECR repository, the host of
      # its /readyz and its deploy role, checked non-empty (never the other environment's).
      - name: Pick the environment of the branch
        id: target
        env:
          PROJECT: hub
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_RELEASE: ${{ inputs.release }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN_PRE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRE }}
        run: bash .github/scripts/deploy-env.sh

      - name: Pick the commit to deploy
        id: commit
        run: |
          if [ -z "$RELEASE" ]; then
            sha="$GITHUB_SHA"
          else
            if ! [[ "$RELEASE" =~ ^hub-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
              echo "::error::'$RELEASE' is not a hub release (hub-vYYYY.MM.DD.N)"
              exit 1
            fi
            if ! sha="$(git rev-list -n 1 "refs/tags/$RELEASE" 2> /dev/null)"; then
              echo "::error::there is no release $RELEASE"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying the hub at $sha"


      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # Only on an x86 BUILD_RUNNER: the default ARM runner builds linux/arm64 natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.release == '' && runner.arch != 'ARM64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.release == ''
      - name: Build and push the image (linux/arm64)
        if: inputs.release == ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.target.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # ECR tags are immutable: a re-run of the same commit keeps its image.
          if found="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)"; then
            echo "$image is already in ECR"
            exit 0
          fi
          if [[ "$found" != *ImageNotFoundException* ]]; then
            echo "::error::cannot check $ECR_REPOSITORY:$IMAGE_TAG in ECR: $found"
            exit 1
          fi
          # The release register_apps writes (Dockerfile ARG APP_VERSION/APP_RELEASED_AT): the commit and its time.
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push -t "$image" \
            --build-arg "APP_VERSION=$IMAGE_TAG" \
            --build-arg "APP_RELEASED_AT=$(git show -s --format=%cI "$IMAGE_TAG")" .

      # Releases are prod's: pre deploys its branch's commit, without a tag.
      - name: Tag and publish the release
        if: inputs.release == '' && steps.target.outputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run of the same commit keeps its release.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'hub-v*')"
          if [ -n "$existing" ]; then
            echo "already released as $existing"
            exit 0
          fi
          tag="$(git tag --list 'hub-v*' | bash .github/scripts/next-version.sh hub "$(date -u +%Y.%m.%d)")"
          previous="$(git tag --list 'hub-v*' --sort=-v:refname | head -1)"
          # Notes: the commits since the previous release (all of them on the first one).
          git log --format='- %s (%h)' "${previous:+$previous..}$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "hub ${tag#hub-v}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released $tag"

      # ECR keeps the last 10 images (aws-next stacks/shared/ecr.tf): an old release may be gone.
      - name: Check the image exists
        env:
          ECR_REPOSITORY: ${{ steps.target.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" > /dev/null; then
            echo "::error::$ECR_REPOSITORY:$IMAGE_TAG is not in ECR (expired by the retention of 10?)"
            exit 1
          fi

      - name: Register revisions, migrate, update the services
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: bash .github/scripts/ecs-deploy.sh

      # Through the ALB by name (prod and pre share it), so it also works before the DNS cutover.
      - name: Check /readyz of the environment
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          READYZ_HOST: ${{ steps.target.outputs.readyz_host }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --connect-to "${READYZ_HOST}:443:${ALB_DNS_NAME}:443" \
            "https://${READYZ_HOST}/readyz"

# ==============================================================================
# ERPlora Bridge (desktop, Rust) — Build & Upload to S3
# ==============================================================================
#
# El bridge standalone (`apps/bridge`, binario `erplora-bridge`) sobre el crate
# `crates/peripherals`. Red-only ESC/POS (ARQUITECTURA.md §2.7).
#
# Pipeline (build pesado: Windows ×2 de facturación → NO en cada push, ADR-CI 2026-07-10):
#   push tag v*        ─► build (Windows + Linux) ─► S3 bridge/v{version}/ + latest/
#   workflow_dispatch  ─► build (Windows + Linux) ─► S3 bridge/latest/   (refresco manual de `latest/`)
#
# Object Storage layout (Hetzner, bucket `erplora-saas` (prefijo `downloads/`), mismo prefijo que el Android
#   y que espera el Cloud `apps/public/bridge/views.py`):
#   s3://erplora-saas/downloads/bridge/
#   ├── latest/
#   │   ├── erplora-bridge.exe      (Windows x64)
#   │   └── erplora-bridge-linux    (Linux x86_64, binario estático-ish)
#   └── v{version}/...
#
# macOS NO se construye aquí: es solo para desarrollo local (`cargo build`),
# no se distribuye.
#
# Almacenamiento: Hetzner Object Storage (S3-compatible, `fsn1.your-objectstorage.com`).
# Sustituye a AWS S3/OIDC (AWS apagado). Credenciales estáticas en secrets del repo:
#   HETZNER_S3_ACCESS_KEY · HETZNER_S3_SECRET_KEY · HETZNER_S3_ENDPOINT
# ==============================================================================

name: Build Bridge Desktop

on:
  # Antes corría en cada push a main Y develop (Windows factura ×2). Nadie descarga `bridge/latest/`
  # a diario pre-lanzamiento → solo se construye al etiquetar release o a mano.
  push:
    tags: ['v*']
  workflow_dispatch:

# Un push/tag nuevo cancela el build en curso del mismo ref: no apilar builds completos.
concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Build ${{ matrix.out_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out_name: erplora-bridge.exe
            bin_path: target/release/erplora-bridge.exe
          - os: ubuntu-latest
            out_name: erplora-bridge-linux
            bin_path: target/release/erplora-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release -p erplora-bridge

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.out_name }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}

      # ------------------------------------------------------------------------------
      # Canal Microsoft Store del BRIDGE (ADR-0136 · hub#120/#122): 2ª ficha «ERPlora
      # Bridge», MSIX SIN FIRMAR (la Store re-firma). Post-build sobre el exe que este
      # mismo leg acaba de compilar (0 builds nuevos). Gate: Variables BRIDGE_MSIX_* —
      # inerte hasta que Ioan reserve la ficha (hub#123). Publisher/Display se
      # REUTILIZAN de la misma cuenta de Partner Center.
      # SOLO en tag: el bridge no tiene versión propia (version.workspace = 0.0.0),
      # así que en dispatch no hay versión MSIX que valga — y la Store solo consume
      # releases etiquetadas (hub#123). El dispatch queda para refrescar S3 `latest/`.
      # ------------------------------------------------------------------------------
      - name: Install winapp CLI
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && vars.BRIDGE_MSIX_IDENTITY_NAME != ''
        run: winget install microsoft.winappcli --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Pack MSIX (Store, unsigned)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && vars.BRIDGE_MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          pwsh scripts/pack-msix.ps1 -Flavor bridge -Version '${{ github.ref_name }}' `
            -IdentityName '${{ vars.BRIDGE_MSIX_IDENTITY_NAME }}' `
            -Publisher '${{ vars.MSIX_PUBLISHER }}' `
            -PublisherDisplay '${{ vars.MSIX_PUBLISHER_DISPLAY }}' `
            -OutDir dist-msix

      - name: Upload MSIX artifact
        if: matrix.os == 'windows-latest' && vars.BRIDGE_MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: bridge-msix
          path: dist-msix/erplora-bridge.msix
          if-no-files-found: error

  # Publica el MSIX del bridge en Microsoft Store (producto GRATUITO). Requisitos
  # manuales (hub#123): ficha «ERPlora Bridge» publicada y live + los MISMOS 4 secrets
  # de la app (la app Entra con rol Manager es de cuenta, no por producto).
  # Gate por Variable BRIDGE_MICROSOFT_STORE_PRODUCT_ID (vacía = job saltado).
  publish-store:
    name: Publish Bridge to Microsoft Store
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.BRIDGE_MICROSOFT_STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: bridge-msix
          path: artifacts

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Authenticate with Partner Center
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Publish MSIX
        shell: pwsh
        run: msstore publish "${{ github.workspace }}/artifacts/erplora-bridge.msix" -id "${{ vars.BRIDGE_MICROSOFT_STORE_PRODUCT_ID }}"

  upload-s3:
    name: Upload to Object Storage
    needs: [build]
    # tag v* → v{version}/ + latest/ ; dispatch manual → refresca latest/.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: fsn1
      S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Hetzner Object Storage
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="latest"
          fi

          for f in erplora-bridge.exe erplora-bridge-linux; do
            if [ -f "artifacts/$f" ]; then
              aws s3 cp "artifacts/$f" "s3://erplora-saas/downloads/bridge/${VERSION}/$f" \
                --endpoint-url "$S3_ENDPOINT"
            fi
          done

          # En tag push, además refresca latest/.
          if [[ "$VERSION" != "latest" ]]; then
            for f in erplora-bridge.exe erplora-bridge-linux; do
              aws s3 cp "s3://erplora-saas/downloads/bridge/${VERSION}/$f" \
                "s3://erplora-saas/downloads/bridge/latest/$f" \
                --endpoint-url "$S3_ENDPOINT" 2>/dev/null || true
            done
          fi

          echo "Subido a s3://erplora-saas/downloads/bridge/${VERSION}/ (Hetzner Object Storage)"

# ==============================================================================
# Almacenamiento: Hetzner Object Storage (bucket `erplora-saas` (prefijo `downloads/`)), S3-compatible vía
# `aws s3 --endpoint-url $HETZNER_S3_ENDPOINT`. Credenciales en secrets del repo ERPlora/hub:
# HETZNER_S3_ACCESS_KEY · HETZNER_S3_SECRET_KEY · HETZNER_S3_ENDPOINT.
# `develop` compila pero NO publica (gate `if` arriba); coherente con "develop never deploys".
# ==============================================================================

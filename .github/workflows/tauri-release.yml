# ==============================================================================
# ERPlora Hub App (Tauri) — Build & Upload to S3
# ==============================================================================
#
# La app de escritorio/móvil del Hub (`apps/tauri`, front Vue `@erplora/web` empaquetado con
# Tauri v2). Espejo de `bridge-release.yml`: build por plataforma → S3 con el rol OIDC.
#
# Pipeline (build pesado: Windows ×2 de facturación → NO en cada push a main, ADR-CI 2026-07-10):
#   push tag v*        ─► build (Windows + Linux) ─► S3 app/v{version}/ + latest/
#   workflow_dispatch  ─► build (Windows + Linux) ─► S3 app/latest/   (refresco manual de `latest/`)
#
# S3 layout (mismo bucket que el bridge; lo consume el Cloud para la descarga):
#   s3://erplora-saas/downloads/app/
#   ├── latest/
#   │   ├── erplora-app-setup.exe   (Windows x64, instalador NSIS — SIN FIRMAR de momento)
#   │   ├── erplora-app.msi         (Windows x64, MSI — SIN FIRMAR)
#   │   ├── erplora-app.AppImage    (Linux x86_64, portable)
#   │   └── erplora-app.deb         (Linux x86_64, Debian/Ubuntu)
#   └── v{version}/...
#
# NO se construye aquí (decisión 2026-06-22):
#   - macOS  → build local (`cargo tauri build`); no hay cert Apple Developer ID.
#   - Android → diferido: la app Tauri aún no tiene `gen/android` (`tauri android init`) ni se
#     ha cableado el job; cuando se haga, se firma con el keystore de Android (único cert
#     disponible hoy, el mismo del bridge-android).
#
# Android (decisión 2026-07-16, plan tiendas Fase 1): el canal CLIENTE es Google Play (AAB,
# job `publish-play`, Play App Signing con la keystore como upload key); el APK de S3 queda
# SOLO como artefacto de QA interno (la landing ya no lo ofrece — redirect 302 a Play en el
# SaaS). Runbook: apps/tauri/GOOGLE-PLAY.md.
#
# Firma Windows (ADR-0136, 2026-07-16): el canal PRINCIPAL de Windows es Microsoft Store —
# MSIX sin firmar que la Store re-firma con su cert tras certificación (0€, sin SmartScreen,
# updates gestionadas por la Store). Ver job `publish-store` + apps/tauri/MICROSOFT-STORE.md.
# El NSIS/MSI de S3 queda como canal secundario SIN FIRMAR (aviso SmartScreen); si algún día
# hace falta firmarlo → Azure Artifact Signing (~10€/mes), decisión aplazada (lean).
#
# Almacenamiento: Hetzner Object Storage (S3-compatible, `fsn1.your-objectstorage.com`),
# bucket `erplora-saas` (prefijo `downloads/`), prefijo `app/`. Sustituye a AWS S3/OIDC (AWS apagado).
# Credenciales estáticas en secrets del repo:
#   HETZNER_S3_ACCESS_KEY · HETZNER_S3_SECRET_KEY · HETZNER_S3_ENDPOINT
# ==============================================================================

name: Build Hub App (Tauri)

on:
  # Compilar la app es caro (Windows factura ×2). Antes corría en cada push a `main` que tocara
  # apps/tauri, apps/web o crates → ~123 min/run, 13 runs/10d ≈ 1.595 min. Pre-lanzamiento nadie
  # descarga `latest/` a diario, así que solo se construye al etiquetar una release o a mano.
  push:
    tags: ['v*']
  workflow_dispatch:

# Un push/tag nuevo cancela el build en curso del mismo ref: no apilar builds completos.
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v4

      # Dependencias de sistema de Tauri en Linux (webkit2gtk, appindicator, rsvg, patchelf…).
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Sin `version`: la lee de `packageManager: pnpm@10` en package.json (evita el conflicto
      # ERR_PNPM_BAD_PM_VERSION que da fijar dos versiones).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # En tag push, fija la versión del bundle a partir del tag (`v1.2.3` → `1.2.3`) para que la
      # app reporte su versión. En main se queda con la de `tauri.conf.json` (build "latest").
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/tauri/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${V}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n');console.log('version →','${V}')"

      # tauri-action instala el CLI de Tauri, ejecuta `beforeBuildCommand` (build del front) y
      # genera los bundles. Sin `tagName` solo compila (no crea release de GitHub); subimos a S3.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri

      # Recoge los bundles (sus nombres llevan la versión; los renombramos a nombres estables que
      # el Cloud sirve desde `latest/`). El target es el del workspace Cargo (raíz del repo).
      - name: Stage artifacts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dist
          # $1 = patrón de nombre, $2 = nombre estable de destino.
          copy_one() {
            local found
            found=$(find . -path '*/release/bundle/*' -name "$1" 2>/dev/null | head -1)
            if [ -n "$found" ]; then cp "$found" "dist/$2"; echo "  $found -> dist/$2"; fi
          }
          echo "Artefactos encontrados:"
          copy_one '*.AppImage'  erplora-app.AppImage
          copy_one '*.deb'       erplora-app.deb
          copy_one '*-setup.exe' erplora-app-setup.exe
          copy_one '*.msi'       erplora-app.msi
          echo "--- dist/ ---"; ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

      # ------------------------------------------------------------------------------
      # Canal Microsoft Store (ADR-0136): MSIX SIN FIRMAR (la Store re-firma tras la
      # certificación → sin comprar cert Authenticode). Post-build puro sobre el exe que
      # este mismo job acaba de compilar (no duplica el build Windows, que factura ×2).
      # Gate: solo si el repo tiene la identidad de Partner Center en Variables
      # (MSIX_IDENTITY_NAME · MSIX_PUBLISHER · MSIX_PUBLISHER_DISPLAY) — hasta que Ioan
      # reserve «ERPlora» en Partner Center, estos pasos se saltan en silencio.
      # Runbook completo: apps/tauri/MICROSOFT-STORE.md
      # ------------------------------------------------------------------------------
      - name: Install winapp CLI
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        run: winget install microsoft.winappcli --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Pack MSIX (Store, unsigned)
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          $v = if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { '${{ github.ref_name }}' } else {
            (Get-Content apps/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          }
          pwsh scripts/pack-msix.ps1 -Version $v `
            -IdentityName '${{ vars.MSIX_IDENTITY_NAME }}' `
            -Publisher '${{ vars.MSIX_PUBLISHER }}' `
            -PublisherDisplay '${{ vars.MSIX_PUBLISHER_DISPLAY }}' `
            -OutDir dist-msix

      - name: Upload MSIX artifact
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-msix
          path: dist-msix/erplora-app.msix
          if-no-files-found: error

  # Publica el MSIX en Microsoft Store vía msstore CLI (solo productos GRATUITOS, que es
  # nuestro caso: app gratis + suscripción/módulos en erplora.com). Requisitos previos
  # (manuales, una vez): app publicada y LIVE en Partner Center + app Entra con rol Manager.
  # Gate por Variable MICROSOFT_STORE_PRODUCT_ID (vacía = job saltado). Solo en tag v*:
  # cada release etiquetada pasa la certificación de Microsoft (horas–3 días) y la Store
  # entrega la actualización sola a las instalaciones existentes.
  publish-store:
    name: Publish to Microsoft Store
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.MICROSOFT_STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: app-msix
          path: artifacts

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Authenticate with Partner Center
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Publish MSIX
        shell: pwsh
        run: msstore publish "${{ github.workspace }}/artifacts/erplora-app.msix" -id "${{ vars.MICROSOFT_STORE_PRODUCT_ID }}"

  # Gate: solo intentamos Android si el repo tiene el keystore configurado (los secrets no se
  # pueden leer en un `if` de job, así que se comprueba aquí y se expone como output).
  check-secrets:
    name: Check Android keystore
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.c.outputs.has_keystore }}
    steps:
      - id: c
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 no configurado en este repo — se omite el build de Android."
          fi

  build-android:
    name: Build android (APK)
    needs: check-secrets
    if: needs.check-secrets.outputs.has_keystore == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Solo arm64 (arm64-v8a): cubre ~todos los móviles modernos y mantiene el build viable en CI
      # (cada ABI = una compilación release completa del workspace; 4 ABIs en frío = +60 min).
      # Añadir armv7-linux-androideabi si hace falta soporte de 32-bit antiguos.
      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          # android-36: Google Play exige targetSdk 36 para apps nuevas/updates desde el 31-ago-2026.
          sdkmanager --install "ndk;${NDK_VERSION}" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # CLI nativo vía cargo (NO el npm global): con el npm global, el task gradle rustBuild invoca
      # `node .../tauri` con una ruta mal resuelta ("Cannot find module .../src-tauri/tauri").
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/tauri/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${V}';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"

      - name: Build Android app (APK + AAB)
        working-directory: apps/tauri
        run: |
          cargo tauri android init
          # Play exige targetSdk 36 (31-ago-2026). gen/android se regenera en cada run, así que
          # este patch es idempotente: si el CLI de Tauri ya emite 36, el sed no cambia nada.
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/; s/targetSdk = [0-9]+/targetSdk = 36/' \
            src-tauri/gen/android/app/build.gradle.kts
          # --aab = Google Play (canal cliente); --apk = SOLO QA interno en S3 (decisión 2026-07-16:
          # Android de cara al cliente va únicamente por Play). Un solo build produce ambos.
          cargo tauri android build --apk --aab --target aarch64

      - name: Sign APK + AAB
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          UNSIGNED=$(find apps/tauri -path '*/outputs/apk/*release*' -name '*.apk' | grep -i 'unsigned\|release' | head -1)
          echo "APK sin firmar: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias erplora \
            --key-pass "pass:${KS_PASS}" \
            --out dist/erplora-app.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs dist/erplora-app.apk
          # AAB para Google Play: los bundles se firman con jarsigner (jar signing), no apksigner.
          # Con Play App Signing esta keystore actúa de UPLOAD key; Google re-firma al distribuir.
          # El dir del bundle varía según targets (universalRelease vs aarch64Release) → glob.
          AAB=$(find apps/tauri -path '*/outputs/bundle/*' -name '*.aab' | head -1)
          echo "AAB: $AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${KS_PASS}" -keypass "${KS_PASS}" \
            "$AAB" erplora
          jarsigner -verify "$AAB"
          cp "$AAB" dist/erplora-app.aab
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*
          if-no-files-found: error

  # Publica el AAB en Google Play vía el service account (soportado solo para productos
  # GRATUITOS — nuestro caso). Requisitos previos (manuales, hub#125/#128/#129): cuenta de
  # ORGANIZACIÓN, app creada en Play Console con la PRIMERA subida hecha a mano, SA con
  # permisos por-app. Gate por Variable PLAY_PACKAGE_NAME_APP (vacía = job saltado).
  # Track por Variable PLAY_TRACK (default internal; production cuando haya confianza).
  publish-play:
    name: Publish to Google Play
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') && vars.PLAY_PACKAGE_NAME_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: app-android
          path: artifacts

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PLAY_PACKAGE_NAME_APP }}
          releaseFiles: artifacts/erplora-app.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed

  upload-s3:
    name: Upload to Object Storage
    # Espera a desktop + Android, pero NO bloquea si Android se salta (sin keystore) o falla:
    # `always()` + exigir solo que el desktop (`build`) haya ido bien.
    needs: [build, build-android]
    # tag v* → sube a v{version}/ + latest/ ; dispatch manual → refresca latest/.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Un `aws s3 cp` colgado (red/endpoint) no debe quedarse horas ocupando el run: mejor fallar
    # rápido y re-lanzar solo este job (`gh run rerun --failed`, los artifacts persisten). Visto
    # 2026-07-09: el upload del run de #82 se quedó colgado 15 min hasta que el run se canceló.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: fsn1
      S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Hetzner Object Storage
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="latest"
          fi

          FILES="erplora-app-setup.exe erplora-app.msi erplora-app.AppImage erplora-app.deb erplora-app.apk"
          for f in $FILES; do
            if [ -f "artifacts/$f" ]; then
              aws s3 cp "artifacts/$f" "s3://erplora-saas/downloads/app/${VERSION}/$f" \
                --endpoint-url "$S3_ENDPOINT"
            fi
          done

          # En tag push, además refresca latest/.
          if [[ "$VERSION" != "latest" ]]; then
            for f in $FILES; do
              aws s3 cp "s3://erplora-saas/downloads/app/${VERSION}/$f" \
                "s3://erplora-saas/downloads/app/latest/$f" \
                --endpoint-url "$S3_ENDPOINT" 2>/dev/null || true
            done
          fi

          echo "Subido a s3://erplora-saas/downloads/app/${VERSION}/ (Hetzner Object Storage)"

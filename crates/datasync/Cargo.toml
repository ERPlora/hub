# erplora-datasync — PRIMER BORRADOR del motor de sync local↔cloud (ADR-0031).
#
# ⚠️ NOMBRE PROVISIONAL + columna del humano: escrito por la IA bajo EXCEPCIÓN EXPLÍCITA
# (ciclo de aprendizaje: borrador feo → el humano compara → el humano reescribe la parte final).
# NO confundir con `crates/sync` (cliente WS de eventos en vivo, otra cosa).
#
# Reutiliza el trait `DatabaseAdapter` de `erplora-db`: el mismo motor sirve SQLite (local) y
# Postgres/Aurora (cloud) sin código de BD nuevo. Sync row-level con Last-Write-Wins por
# `updated_at` (autoridad = `:now` del servidor, ADR-0031) y cursores en `_sync_state`.
[package]
name = "erplora-datasync"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-db = { path = "../db" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "^1.52.3", features = ["macros", "rt-multi-thread"] }

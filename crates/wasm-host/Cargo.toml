[package]
name = "erplora-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Ejecución real de WASM vía Extism. Activada por defecto: en este entorno
# `extism = "1"` compila sin cmake. Desactívala (`--no-default-features`) para
# compilar solo el contrato (tests de (de)serialización) sin runtime WASM.
default = ["extism"]
extism = ["dep:extism"]

[dependencies]
extism = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
erplora-guest-sdk = { path = "../guest-sdk" }

[dev-dependencies]
# Compila los guests WAT de prueba (glotón / normal) a bytes wasm en el propio
# test, sin depender de un `.wasm` externo (ver los tests de `memory_max`).
wat = "1"

# Hereda `[workspace.lints]` del manifest raíz (hub#1242). Sin estas dos líneas el crate
# queda EXENTO del gate de clippy en silencio; `scripts/tests/clippy-lints.test.sh` lo vigila.
[lints]
workspace = true

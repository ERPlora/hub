# erplora-db — DatabaseAdapter + backends SQLite (rusqlite) y Postgres. ARQUITECTURA.md §8.
[package]
name = "erplora-db"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde_json = "1.0.150"
thiserror = "2.0.18"
async-trait="0.1"
sqlx={ version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
]}

[dev-dependencies]
tokio = { version ="^1.52.3", features = ["macros", "rt-multi-thread"] }
# erplora-db — DatabaseAdapter + backend Postgres (sqlx). ARQUITECTURA.md §8.
[package]
name = "erplora-db"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Helpers de test compartidos (esquema Postgres efímero por test, aislamiento en paralelo).
# Los activan otros crates en sus `[dev-dependencies]`: `erplora-db = { …, features = ["test-util"] }`.
test-util = ["dep:libc"]

[dependencies]
# testutil's dead-process probe (`kill(pid, 0)`) for the orphan-schema GC; test-util builds only.
libc = { version = "0.2", optional = true }
serde_json = "1.0.150"
thiserror = "2.0.18"
async-trait="0.1"
sqlx={ version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    # §8/§9 — tipos fiscales/dinero de Postgres: NUMERIC (bigdecimal), TIMESTAMPTZ/DATE/TIME
    # (chrono), UUID y JSONB/JSON (json). Sin estas features caían al brazo string y, en
    # formato binario, fallaban a `null`.
    "bigdecimal",
    "chrono",
    "uuid",
    "json",
]}

[dev-dependencies]
tokio = { version ="^1.52.3", features = ["macros", "rt-multi-thread"] }
# testutil also compiles under plain `cfg(test)` (this crate's own tests), without the feature.
libc = "0.2"

# Hereda `[workspace.lints]` del manifest raíz (hub#1242). Sin estas dos líneas el crate
# queda EXENTO del gate de clippy en silencio; `scripts/tests/clippy-lints.test.sh` lo vigila.
[lints]
workspace = true

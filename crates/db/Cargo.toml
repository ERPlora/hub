# erplora-db — DatabaseAdapter + backends SQLite (rusqlite) y Postgres. ARQUITECTURA.md §8.
[package]
name = "erplora-db"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde_json = "1.0.150"
thiserror = "2.0.18"
async-trait="0.1"
sqlx={ version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    # §8/§9 — tipos fiscales/dinero de Postgres: NUMERIC (bigdecimal), TIMESTAMPTZ/DATE/TIME
    # (chrono), UUID y JSONB/JSON (json). Sin estas features caían al brazo string y, en
    # formato binario, fallaban a `null`.
    "bigdecimal",
    "chrono",
    "uuid",
    "json",
]}

[dev-dependencies]
tokio = { version ="^1.52.3", features = ["macros", "rt-multi-thread"] }
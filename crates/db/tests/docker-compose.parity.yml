# Arnés reproducible para los tests de paridad SQLite↔Postgres de `erplora-db` (tarea B4).
#
# Levanta un Postgres efímero igual al que usa Aurora (cloud) y exporta la URL que los tests leen.
# SQLite no necesita nada (va en memoria). Postgres es OPCIONAL: sin él, la suite corre solo la rama
# SQLite y marca la de Postgres como "pendiente de entorno".
#
# Uso:
#   docker compose -f crates/db/tests/docker-compose.parity.yml up -d
#   ERPLORA_TEST_PG_URL='postgres://erplora:erplora@localhost:55432/erplora_test' \
#     cargo test -p erplora-db --test parity
#   docker compose -f crates/db/tests/docker-compose.parity.yml down -v
#
# (También se acepta DATABASE_URL como alias de ERPLORA_TEST_PG_URL.)
#
# Cada test usa su propio SCHEMA aislado dentro de esta misma BD (search_path en el DSN), así que los
# tests corren en paralelo sin pisarse. La versión 16 empareja la familia de Aurora PostgreSQL del
# producto Cloud (ajústala si el aura sube de major).

services:
  postgres:
    image: postgres:16-alpine
    container_name: erplora-db-parity
    environment:
      POSTGRES_USER: erplora
      POSTGRES_PASSWORD: erplora
      POSTGRES_DB: erplora_test
    ports:
      - "55432:5432"
    # tmpfs: la BD vive en RAM (efímera, rápida; se descarta al `down`).
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erplora -d erplora_test"]
      interval: 2s
      timeout: 3s
      retries: 15

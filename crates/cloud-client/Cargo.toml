# erplora-cloud-client — cliente del Cloud Portal (auth, marketplace, descarga). §2.2, §2.3.
[package]
name = "erplora-cloud-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
jsonwebtoken = "9"
# ed25519 detached signature verification de módulos (hub#239). ring ya es dependencia
# transitiva del workspace (lo usa erplora-runtime); reusarlo evita arrastrar un crate nuevo y
# aporta crypto auditada (ring::signature::Ed25519KeyPair / UnparsedPublicKey).
ring = "0.17"
base64 = "0.22"

[dev-dependencies]

# Hereda `[workspace.lints]` del manifest raíz (hub#1242). Sin estas dos líneas el crate
# queda EXENTO del gate de clippy en silencio; `scripts/tests/clippy-lints.test.sh` lo vigila.
[lints]
workspace = true

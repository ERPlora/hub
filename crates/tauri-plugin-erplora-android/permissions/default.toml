# Concedidos por defecto: preguntar y pedir permisos NUNCA es peligroso —lo peligroso es no poder
# pedirlos y que el hardware quede muerto sin que nadie sepa por qué. `allow-leave-app` (hub#1906)
# manda la app al fondo, lo mismo que el Atrás del sistema en la pantalla raíz: no hay nada que
# proteger detrás. `allow-open-app-settings` (hub#1886) solo abre la ficha de la app en los ajustes
# del sistema: quien decide sigue siendo la persona.
"$schema" = "schemas/schema.json"

[default]
description = "Consultar y solicitar los permisos de runtime que el TPV necesita en Android, salir de la app con el botón Atrás y abrir la ficha de la app en los ajustes del sistema."
permissions = ["allow-check-permissions", "allow-request-permissions", "allow-leave-app", "allow-open-app-settings"]

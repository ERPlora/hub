[package]
name = "erplora-guest-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-guest contract (Input/Operation/Event/Output) and exact money helpers for ERPlora Hub module handlers compiled to WASM (Tier 2)."
homepage = "https://erplora.com"
keywords = ["erplora", "wasm", "plugin", "sdk", "extism"]
categories = ["wasm", "api-bindings"]
# Published to crates.io on every `v*` tag by the `publish-guest-sdk` job of build-hub.yml
# (hub#2119), with the tag's version. A module handler — ERPlora's own or a third party's —
# declares it by version:
#
#   erplora-guest-sdk = "X.Y.Z"
#
# ERPlora/hub is private, so the `{ git = …, tag = … }` route (hub#1236) never reached a vendor,
# and the `path = "../../../../hub/crates/guest-sdk"` of the in-house handlers only exists on a
# machine with both repos cloned side by side. `scripts/package-guest-sdk.sh` emits the same
# normalised crate crates.io receives, and `scripts/tests/guest-sdk-standalone.test.sh` proves a
# handler builds against it with no ERPlora repo next to it (hub#2115).
#
# 🔴 crates.io ONLY: a version there can be yanked but never deleted, so the list pins the one
# registry this crate may go to. `scripts/tests/publish-sdks.test.sh` guards it.
publish = ["crates-io"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Aritmética decimal EXACTA para el dinero (ADR-0123). Sustituye al `f64` que 5 handlers usaban
# para redondear céntimos. No cuesta tamaño: el wasm de `pricing` CON rust_decimal (191 KB) pesa
# menos que el de `sales` CON f64 (263 KB).
rust_decimal = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
rust_decimal_macros = "1"

# Hereda `[workspace.lints]` del manifest raíz (hub#1242). Sin estas dos líneas el crate
# queda EXENTO del gate de clippy en silencio; `scripts/tests/clippy-lints.test.sh` lo vigila.
[lints]
workspace = true

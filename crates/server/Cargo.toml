# erplora-server — servidor Axum del runtime del tenant (modo cloud). ARQUITECTURA.md §7.5.
[package]
name = "erplora-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-runtime = { path = "../runtime" }
erplora-db = { path = "../db" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

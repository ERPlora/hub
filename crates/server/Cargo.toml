# erplora-server — servidor Axum del runtime del tenant (modo cloud). ARQUITECTURA.md §7.5.
[package]
name = "erplora-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-runtime = { path = "../runtime" }
erplora-db = { path = "../db" }
# Plugin nativo first-party (ADR-0009): motor fiscal VeriFactu horneado en el runtime.
erplora-verifactu = { path = "../verifactu" }
# Cliente del Cloud Portal: construye las peticiones (versions/ download/ mark_installed/ +
# assistant stream) y verifica SHA256. `source` aporta el verify+unzip seguro (anti zip-slip).
cloud_client = { package = "erplora-cloud-client", path = "../cloud-client" }
source = { package = "erplora-source", path = "../source" }
# Vector store local (RAG): ingestión de descripciones `ai:`/`agent` al instalar un módulo.
erplora-vector = { path = "../vector" }
# `multipart`: subida de ficheros a la carpeta media (`POST /api/media/upload`, pantalla /files).
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5"
# Servir el frontend estático (dist de Vite) con fallback SPA para el combo cloud + web-PWA (§3).
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
# Logging del hub → consola + fichero rotado diario en `media/_logs/` (retención 6 meses, ADR-0047).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Para implementar el trait async `BackupTransport` del runtime (transporte real de backup) y el
# `Embedder` trait (proxy de embeddings del Cloud) dyn-compatible para inyectar mocks en test.
async-trait = "0.1"
# Cliente HTTP async (rustls): descarga de módulos + proxy SSE del asistente hacia el Cloud.
# `rustls-tls-native-roots`: confía en el trust store del SO (como curl), no solo en los
# `webpki-roots` empaquetados. Necesario tras proxies de inspección TLS corporativos (CA propia
# en el llavero del SO, no en webpki) y prod-safe (en ECS carga el bundle de CAs del sistema).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "rustls-tls-native-roots"] }
futures-util = "0.3"
# Métricas del SO para `/api/system` en el combo LOCAL (single/Tauri): CPU + memoria reales del
# equipo. En cloud (ECS) NO se usa: ahí las métricas salen del ECS Task Metadata Endpoint v4 (HTTP).
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
# Export/import de blueprints (ADR-0113): empaquetado/inspección del `.blueprint.zip` en memoria
# (mismo crate que usa `erplora-source` para descomprimir módulos), sha256 del manifest,
# `created_at` ISO-8601 del export y decodificación del `.p12` (`_hub_certificate.pkcs12_b64`).
zip = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"

[dev-dependencies]
# `test-util` = helper de esquema Postgres efímero por test (ADR-0154): los tests del server
# corren contra un Postgres real (aislamiento por esquema, en paralelo).
erplora-db = { path = "../db", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Fixtures del test de progreso de instalación (`tests/install_progress.rs`): zips de módulo
# reales en memoria + su SHA256 (la verificación ADR-0015 es obligatoria, el mock no la salta).
zip = "2"
sha2 = "0.10"
# Firma de JWT RS256 de prueba para el gate de presencia de `auth_cloud` (ADR-0157,
# `tests/auth_cloud_presence.rs`): el test emula al SaaS emitiendo el claim `hubs`.
jsonwebtoken = "9"
# Firma ed25519 de prueba para el flujo del marketplace firmado (hub#239,
# `tests/install_surface.rs`): el test genera un par efímero y firma el zip del mock cloud.
ring = "0.17"
hex = "0.4"
# Cliente WebSocket REAL para `tests/print_drain_ws.rs` (hub#343): el canal del host de impresión
# es el primer WS cliente→servidor del hub, así que su transporte se prueba contra un servidor
# atado de verdad, no solo el manejador de frames. Misma versión que ya trae `axum` con `ws`, así
# que no añade nada al árbol de dependencias.
tokio-tungstenite = "0.24"
# El ESC/POS del DISPOSITIVO, para el test manual contra la impresora real
# (`tests/print_to_real_printer.rs`, hub#501). El servidor NO depende de este crate en producción —
# el hub no toca hardware (ARQUITECTURA.md §2.7)—: aquí el test hace de host de impresión, que es
# justamente quien sí lo usa, y sin él «sale por papel» seguiría sin poder comprobarse.
erplora-peripherals = { path = "../peripherals" }

# erplora-verifactu — motor fiscal VeriFactu (RD 1007/2023) como **plugin nativo
# first-party** (ADR-0009): cadena SHA-256, XML SOAP y transmisión AEAT con TLS mutua
# (certificado PKCS#12). Horneado en el runtime; el SQL/UI del módulo `verifactu`
# siguen el modelo declarativo normal.
[package]
name = "erplora-verifactu"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-runtime = { path = "../runtime" }
erplora-db = { path = "../db" }
# Tipos del contrato de intenciones (Output/Operation), compartidos con el WASM Tier 2.
erplora-wasm-host = { path = "../wasm-host", default-features = false }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
# `NumeroInstalacion` must be the hub UUID (ADR-0202 §4.2): the guard parses it before any
# record is built.
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# POST TLS-mutua a la AEAT con **rustls**. La identidad cliente (`reqwest::Identity`) ya NO la
# construye este módulo: la entrega el **core** vía `NativeHost::certificate_*` (ADR-0079) — toda
# la cripto PKCS#12/OpenSSL vive en `erplora-runtime::certificate`, verifactu solo PIDE la firma.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# base64: decodifica los bytes del .p12 (`certificate_pkcs12`) antes de pedírselos al host.
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
# Runtime mínimo para los tests async de los handlers (validate_chain / recover_manual).
tokio = { version = "1", features = ["macros", "rt"] }

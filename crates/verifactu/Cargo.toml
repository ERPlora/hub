# erplora-verifactu — motor fiscal VeriFactu (RD 1007/2023) como **plugin nativo
# first-party** (ADR-0009): cadena SHA-256, XML SOAP y transmisión AEAT con TLS mutua
# (certificado PKCS#12). Horneado en el runtime; el SQL/UI del módulo `verifactu`
# siguen el modelo declarativo normal.
[package]
name = "erplora-verifactu"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-runtime = { path = "../runtime" }
erplora-db = { path = "../db" }
# Tipos del contrato de intenciones (Output/Operation), compartidos con el WASM Tier 2.
erplora-wasm-host = { path = "../wasm-host", default-features = false }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# POST TLS-mutua a la AEAT con **rustls** (sin tocar el Llavero del SO). La identidad cliente
# entra como PEM (clave + cadena), extraída del PKCS#12 por OpenSSL (abajo).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# OpenSSL (vendored: compila su propio libcrypto, sin dependencia del sistema) SOLO para PARSEAR
# el .p12 en memoria: acepta los .p12 BER reales (FNMT/Windows) que un parser DER puro rechaza,
# y a diferencia de native-tls NO importa la clave al Llavero de macOS (sin popups).
openssl = { version = "0.10", features = ["vendored"] }
# base64: decodifica los bytes del .p12 guardados en BD (certificate_pkcs12).
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
# Runtime mínimo para los tests async de los handlers (validate_chain / recover_manual).
tokio = { version = "1", features = ["macros", "rt"] }

# erplora-runtime — host genérico de módulos (ARQUITECTURA.md §4).
[package]
name = "erplora-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-db = { path = "../db" }
erplora-wasm-host = { path = "../wasm-host" }
# Traits async del contrato de plugins nativos first-party (ADR-0009, native.rs).
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
# Async test harness for the integration tests/example (db + runtime are async now).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

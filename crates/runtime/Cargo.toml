# erplora-runtime — host genérico de módulos (ARQUITECTURA.md §4).
[package]
name = "erplora-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-db = { path = "../db" }
erplora-guest-sdk = { path = "../guest-sdk" }
erplora-wasm-host = { path = "../wasm-host" }
# Traits async del contrato de plugins nativos first-party (ADR-0009, native.rs).
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# PIN hashing con argon2id + string PHC estándar (`$argon2id$v=19$...`). Decisión humano hub#15:
# se mantiene `sha2` para verificar (y rehashear perezosamente) los PINs viejos `salt:hash`.
argon2 = "0.5"
# (ADR-0040, opción B 2026-06-13) El backup ya NO cifra en cliente: el cifrado es SSE en el Cloud,
# así que se quitó `aes-gcm` (no hay master key ni AES-GCM en el hub). Ver `host_backup.rs`.
# Validación del payload contra el JSON Schema declarado por cada query/command (§5.2).
# Sin resolución de $ref externos (offline): los schemas de módulo son autocontenidos.
jsonschema = { version = "0.33", default-features = false }
# Capacidad de host `certificate` (ADR-0079): el core posee el `.p12` del negocio y hace TODA la
# cripto PKCS#12 en UN solo sitio (`certificate.rs`), entregando una `reqwest::Identity` (mTLS) a los
# módulos sin exponerles la clave. `reqwest` (rustls) construye la identidad desde PEM; `base64`
# decodifica el `.p12`. (OpenSSL — solo non-Android, ver `[target...]` abajo.)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

# OpenSSL parsea los `.p12` BER reales (FNMT/Windows) que un parser DER puro rechaza — pero
# `openssl-sys` (vendored) NO cross-compila para Android (el NDK r23+ no trae los wrappers
# `aarch64-linux-android-ranlib` que su build de OpenSSL espera). Como el shell **Android** aún no
# hace la transmisión fiscal (la firma vive en Hub Cloud/Local), se **excluye openssl del target
# Android**: el primitivo `certificate_*` devuelve `host.certificate` no-disponible allí (stub en
# `certificate.rs`), y el resto del workspace (rustls/ring) sí compila para Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Async test harness for the integration tests/example (db + runtime are async now).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `test-util` = helper de esquema Postgres efímero por test (ADR-0154): todos los tests del
# runtime corren contra un Postgres real (aislamiento por esquema, en paralelo).
erplora-db = { path = "../db", features = ["test-util"] }
erplora-guest-sdk = { path = "../guest-sdk" }
serde_json = "1"

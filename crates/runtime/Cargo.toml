# erplora-runtime — host genérico de módulos (ARQUITECTURA.md §4).
[package]
name = "erplora-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
erplora-db = { path = "../db" }
erplora-guest-sdk = { path = "../guest-sdk" }
erplora-wasm-host = { path = "../wasm-host" }
# Traits async del contrato de plugins nativos first-party (ADR-0009, native.rs).
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA time zone rules (hub#731). A flow's cron is the BUSINESS clock: «cierra la caja a las 21:00»
# has to be 21:00 in the shop, and the offset moves twice a year on its own. DST rules are not
# something to hand-roll — the two cases that matter (an hour that does not exist and one that
# happens twice) are exactly where a hand-written rule loses a cash close or runs it twice. The
# whole tzdb is compiled in (~500 KB): a hub can be in any country, and filtering by regex would
# turn "your zone is not in the binary" into a silent fallback to UTC, which is the bug being fixed.
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
# PIN hashing con argon2id + string PHC estándar (`$argon2id$v=19$...`). Decisión humano hub#15:
# se mantiene `sha2` para verificar (y rehashear perezosamente) los PINs viejos `salt:hash`.
argon2 = "0.5"
# (ADR-0040, opción B 2026-06-13) El backup ya NO cifra en cliente: el cifrado es SSE en el Cloud,
# así que se quitó `aes-gcm` (no hay master key ni AES-GCM en el hub). Ver `host_backup.rs`.
# Cifrado at-rest de secretos del Hub (ERPlora/hub#114, `secret_box.rs`): `_hub_certificate`
# (.p12 fiscal + password) ya NO se guarda en claro. `ring` (AES-256-GCM) ya estaba resuelto en
# `Cargo.lock` de forma transitiva (rustls/reqwest más abajo) — se declara directo en vez de sumar
# una dependencia de cripto nueva al árbol (p.ej. `aes-gcm`/`fernet`).
ring = "0.17"
# Validación del payload contra el JSON Schema declarado por cada query/command (§5.2).
# Sin resolución de $ref externos (offline): los schemas de módulo son autocontenidos.
jsonschema = { version = "0.33", default-features = false }
# Capacidad de host `certificate` (ADR-0079): el core posee el `.p12` del negocio y hace TODA la
# cripto PKCS#12 en UN solo sitio (`certificate.rs`), entregando una `reqwest::Identity` (mTLS) a los
# módulos sin exponerles la clave. `reqwest` (rustls) construye la identidad desde PEM; `base64`
# decodifica el `.p12`. (OpenSSL — solo non-Android, ver `[target...]` abajo.)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# El parser WHATWG de URLs (hub#728/#729, `flows/net.rs`). Es **el mismo crate y la misma versión**
# que usa `reqwest` por dentro, así que `url::Url` y `reqwest::Url` son EL MISMO tipo: la URL que
# el kernel juzga es literalmente el objeto que el cliente HTTP marca, no una cadena que se vuelve
# a parsear. Ya estaba en `Cargo.lock` de forma transitiva; aquí solo se declara la arista.
url = "2"
base64 = "0.22"
# Ejecución del handler WASM FUERA del worker async (hub#241): `spawn_blocking` + `timeout`. La
# llamada a wasmtime es bloqueante; hacerla en el propio worker de Tokio dejaba colgado el runtime
# entero cuando un handler no terminaba. Solo se usan `rt` (spawn_blocking) y `time` (timeout).
tokio = { version = "1", features = ["rt", "sync", "time"] }

# OpenSSL parsea los `.p12` BER reales (FNMT/Windows) que un parser DER puro rechaza — pero
# `openssl-sys` (vendored) NO cross-compila para Android (el NDK r23+ no trae los wrappers
# `aarch64-linux-android-ranlib` que su build de OpenSSL espera). Como el shell **Android** aún no
# hace la transmisión fiscal (la firma vive en Hub Cloud/Local), se **excluye openssl del target
# Android**: el primitivo `certificate_*` devuelve `host.certificate` no-disponible allí (stub en
# `certificate.rs`), y el resto del workspace (rustls/ring) sí compila para Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# El e2e de hub#470 (`tests/certificate_type_e2e.rs`) construye certificados de PRUEBA con la forma
# real de un sello de entidad y de un certificado de representante (extensión `qcStatements` de
# eIDAS incluida). Se generan en el test a propósito: en este repo NO vive ningún `.p12`, y menos el
# de verdad de ERPlora, que es la clave privada con la que la empresa se identifica ante la AEAT.
# Mismo `cfg` que la dependencia normal, por el mismo motivo (openssl-sys no cross-compila a Android).
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Async test harness for the integration tests/example (db + runtime are async now).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `test-util` = helper de esquema Postgres efímero por test (ADR-0154): todos los tests del
# runtime corren contra un Postgres real (aislamiento por esquema, en paralelo).
erplora-db = { path = "../db", features = ["test-util"] }
erplora-guest-sdk = { path = "../guest-sdk" }
# E2E of the fiscal breakdown (hub#296): the `<Desglose>` is built by `erplora-verifactu`, so the
# only way to test the chain end to end — invoice's WASM handler writes the `tax_breakdown`, the
# AEAT record reads it — is to reach the XML from a test that also drives the runtime. It is a
# DEV-dependency only (Cargo allows the dev cycle: verifactu depends on runtime, runtime's tests
# depend on verifactu), so nothing ships in the runtime library itself.
erplora-verifactu = { path = "../verifactu" }
serde_json = "1"

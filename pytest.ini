[pytest]
DJANGO_SETTINGS_MODULE = config.settings_pytest
pythonpath = .
testpaths = base control config apps shared tests
# packages/ holds the live and ui submodules, whose suites run on their own
# (`cd packages/live && uv run pytest`); the rest are pytest's defaults.
norecursedirs = packages node_modules .* *.egg _darcs build CVS dist venv {arch}
asyncio_mode = auto
markers =
    outbound_threads: the test runs base.outbound's real threads (conftest.py), on committed data
    worker_slow_passes: the test lets the worker's loop run its slow passes, the data copies and the nightly measurement, in their threads (conftest.py)
    production_worker: the worker's loop as production runs it, without the suite's phase 1 pass (conftest.py, legacy_worker)
filterwarnings =
    # WhiteNoise warns that STATIC_ROOT does not exist until `collectstatic` has run.
    ignore:No directory at.*staticfiles:UserWarning

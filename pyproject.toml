"tests/test_guardrails_permissions.py" = ["F601"]

# complexipy (`uv run complexipy`; tests/test_guardrails_complexity.py runs it): no function's cognitive complexity
# goes over 15, and no ignore comment switches that off. complexipy-snapshot.json froze the functions over it when it
# came in: it only shrinks. Migrations are generated, and the live and ui submodules are checked in their own repos.
[tool.complexipy]
paths = ["."]
exclude = ["**/migrations/**", "packages/**"]
max-complexity-allowed = 15
no-ignore = true

# import-linter (`uv run lint-imports`; tests/test_guardrails_imports.py runs it): each app imports only itself, base,
# live and the apps its LiveAppConfig requires, base imports no app, and no sibling modules import each other in a
# circle. The app contracts follow the requires, and that test says what to change when they do not. Tests are out of
# every contract. The rest of each ignore_imports froze what broke a contract when it came in: it only shrinks.
[tool.importlinter]
root_packages = ["apps", "base", "config", "control", "shared"]

[[tool.importlinter.contracts]]
id = "base-imports-no-app"
name = "base imports no app"
type = "forbidden"
source_modules = ["base"]
forbidden_modules = ["apps"]
allow_indirect_imports = true
ignore_imports = [
    "**.tests.** -> **",
    "base.internal -> apps.invoice.pdf",
]

[[tool.importlinter.contracts]]
id = "no-sibling-cycles"
name = "No sibling modules import each other in a circle"
type = "acyclic_siblings"
ancestors = [
    "base", "base.tenancy", "base.services", "base.queries", "base.schemas", "control", "control.services",
    "control.queries", "apps.*", "apps.*.services", "apps.*.queries", "apps.*.schemas",
]
depth = 0
ignore_imports = [
    "**.tests.** -> **",
    "apps.flow.recipes -> apps.flow.queries",
    "apps.verifactu.queries.country -> apps.verifactu.apps",
    "base.activation -> base.queries",
    "base.activation -> base.services",
    "base.activation -> base.services.provisioning",
    "base.activation -> base.tenancy.context",
    "base.api_keys -> base.services",
    "base.approvals -> base.operations",
    "base.business -> base.tenancy.context",
    "base.entitlement -> base.tenancy.context",
    "base.images -> base.queries.catalog_images",
    "base.images -> base.queries.files",
    "base.meter -> base.services",
    "base.operations -> base.services.devices",
    "base.permissions -> base.tenancy.context",
    "base.services.devices -> base.middleware",
    "base.services.sessions -> base.middleware",
    "base.tenancy.context -> base.tenancy.connections",
    "base.tenancy.cut -> base.services.photo",
    "base.tenancy.cut -> base.services.provisioning",
    "base.tenancy.dumps -> base.services",
    "base.tenancy.move -> base.services",
    "base.tenancy.offboarding -> base.services",
    "base.tenancy.offboarding -> base.services.provisioning",
    "base.tenancy.provision -> base.services.demos",
    "base.tenancy.provision -> base.services.hub_registry",
    "base.tenancy.provision -> base.services.photo",
    "base.tenancy.provision -> base.services.provisioning",
    "base.tenancy.recovery -> base.services.provisioning",
    "base.tenancy.restore -> base.services",
    "base.tenancy.restore -> base.services.provisioning",
    "base.usage -> base.services",
]

[[tool.importlinter.contracts]]
id = "base-blueprint-no-relay"
name = "base.blueprint does not import base.relay, which loads base.services, which loads base.blueprint"
type = "forbidden"
source_modules = ["base.blueprint"]
forbidden_modules = ["base.relay"]
allow_indirect_imports = true
ignore_imports = ["**.tests.** -> **"]


[project]
name = "hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "django-ses>=4.8.2",
    "pycountry>=26.2.16",
    "phonenumbers>=9.0.41",
    "babel>=2.18",
    "python-stdnum>=2.2",
    "python-dateutil>=2.9",
    "xmlschema>=4.3",
    "qrcode>=8.2",
    "httpx>=0.28",
    "cryptography>=50.0",
    "croniter>=6",
    "weasyprint>=66",
    "geopy>=2.5",
    "django-storages[s3]>=1.14.6",
    "pillow>=12.3.0",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "anthropic>=1.13.0",
    "respx>=0.23",
    "pytest-xdist>=3.8.0",
    # The S3 of the tests: moto in server mode (ThreadedMotoServer: flask and flask-cors) behind boto3, never a mock.
    "moto[s3]>=5.2",
    "flask>=3.1",
    "flask-cors>=6",
    # The CI runs the suite in shards (.github/scripts/pytest-shard.sh, hub#1185).
    "pytest-split>=0.11",
    "ruff>=0.17.5",
]

# ruff only checks how big and how branchy each function is (tests/test_guardrails_lint.py runs it): none of its default
# rules, and it is not the project's formatter. Migrations are generated, and packages/ holds the live and ui submodules,
# checked in their own repos.
[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations", "packages"]
force-exclude = true

# The code keeps its own layout: `ruff format` (an editor's format on save, say) finds nothing to format.
[tool.ruff.format]
exclude = ["*"]

[tool.ruff.lint]
select =["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF100"]
# Rules of other linters that the code's older `# noqa` markers name: RUF100 keeps those markers instead of reporting
# them as unused.
external = ["A002", "B018", "BLE001", "E402", "E731", "F401", "F403", "F405", "F811", "N801", "N802", "N803"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# pytest hands fixtures over as arguments, so a test's argument count says nothing about its size.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0913", "PLR0917"]
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]

[tool.uv]
package = false

# erplora-live is the packages/live submodule (`git submodule update --init`); editable locally,
# the Dockerfile installs it with --no-editable.
[tool.uv.sources]
erplora-live = { path = "packages/live", editable = true }

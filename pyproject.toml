[project]
name = "hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "django-ses>=4.8.2",
    "pycountry>=26.2.16",
    "phonenumbers>=9.0.41",
    "babel>=2.18",
    "python-stdnum>=2.2",
    "python-dateutil>=2.9",
    "xmlschema>=4.3",
    "qrcode>=8.2",
    "httpx>=0.28",
    "cryptography>=50.0",
    "croniter>=6",
    "weasyprint>=66",
    "geopy>=2.5",
    "django-storages[s3]>=1.14.6",
    "pillow>=12.3.0",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "anthropic>=1.13.0",
    "respx>=0.23",
    "pytest-xdist>=3.8.0",
    # The S3 of the tests: moto in server mode (ThreadedMotoServer: flask and flask-cors) behind boto3, never a mock.
    "moto[s3]>=5.2",
    "flask>=3.1",
    "flask-cors>=6",
    # The CI runs the suite in shards (.github/scripts/pytest-shard.sh, hub#1185).
    "pytest-split>=0.11",
    "ruff>=0.17.5",
    "import-linter>=2.16",
]

# ruff only checks how big and how branchy each function is (tests/test_guardrails_lint.py runs it): none of its default
# rules, and it is not the project's formatter. Migrations are generated, and packages/ holds the live and ui submodules,
# checked in their own repos.
[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations", "packages"]
force-exclude = true

# The code keeps its own layout: `ruff format` (an editor's format on save, say) finds nothing to format.
[tool.ruff.format]
exclude = ["*"]

[tool.ruff.lint]
select =["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF100"]
# Rules of other linters that the code's older `# noqa` markers name: RUF100 keeps those markers instead of reporting
# them as unused.
external = ["A002", "B018", "BLE001", "E402", "E731", "F401", "F403", "F405", "F811", "N801", "N802", "N803"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# pytest hands fixtures over as arguments, so a test's argument count says nothing about its size.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0913", "PLR0917"]
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]

# import-linter (`uv run lint-imports`; tests/test_guardrails_imports.py runs it): each app imports only itself, base,
# live and the apps its LiveAppConfig requires, base imports no app, and no sibling modules import each other in a
# circle. The app contracts follow the requires, and that test says what to change when they do not. Tests are out of
# every contract. The rest of each ignore_imports froze what broke a contract when it came in: it only shrinks.
[tool.importlinter]
root_packages = ["apps", "base", "config", "control", "shared"]

[[tool.importlinter.contracts]]
id = "base-imports-no-app"
name = "base imports no app"
type = "forbidden"
source_modules = ["base"]
forbidden_modules = ["apps"]
allow_indirect_imports = true
ignore_imports = [
    "**.tests.** -> **",
    "base.internal -> apps.invoice.pdf",
]

[[tool.importlinter.contracts]]
id = "no-sibling-cycles"
name = "No sibling modules import each other in a circle"
type = "acyclic_siblings"
ancestors = [
    "base", "base.tenancy", "base.services", "base.queries", "control", "control.services", "control.queries",
    "apps.*", "apps.*.services", "apps.*.queries",
]
depth = 0
ignore_imports = [
    "**.tests.** -> **",
    "apps.flow.recipes -> apps.flow.queries",
    "apps.verifactu.queries -> apps.verifactu.apps",
    "base.activation -> base.queries",
    "base.activation -> base.services",
    "base.activation -> base.services.provisioning",
    "base.activation -> base.tenancy.context",
    "base.api_keys -> base.services",
    "base.approvals -> base.operations",
    "base.business -> base.tenancy.context",
    "base.entitlement -> base.tenancy.context",
    "base.images -> base.queries",
    "base.meter -> base.services",
    "base.operations -> base.services",
    "base.permissions -> base.tenancy.context",
    "base.registry -> base.tenancy.context",
    "base.relay -> base.services.relay_runs",
    "base.services -> base.middleware",
    "base.services.sessions -> base.middleware",
    "base.tenancy.context -> base.tenancy.connections",
    "base.tenancy.cut -> base.services.photo",
    "base.tenancy.cut -> base.services.provisioning",
    "base.tenancy.dumps -> base.services",
    "base.tenancy.move -> base.services",
    "base.tenancy.offboarding -> base.services",
    "base.tenancy.offboarding -> base.services.provisioning",
    "base.tenancy.provision -> base.services.demos",
    "base.tenancy.provision -> base.services.hub_registry",
    "base.tenancy.provision -> base.services.photo",
    "base.tenancy.provision -> base.services.provisioning",
    "base.tenancy.recovery -> base.services.provisioning",
    "base.tenancy.restore -> base.services",
    "base.tenancy.restore -> base.services.provisioning",
    "base.usage -> base.services",
]

[[tool.importlinter.contracts]]
id = "app-appointment"
name = "apps.appointment imports only itself, base, live and the apps it requires"
type = "forbidden"
source_modules = ["apps.appointment"]
forbidden_modules = [
    "apps.attendance", "apps.cart_checkout", "apps.cash_register", "apps.combo", "apps.demo", "apps.flow",
    "apps.inventory", "apps.invoice", "apps.kitchen", "apps.modifier", "apps.online_booking", "apps.payment",
    "apps.pricing", "apps.printing", "apps.reservation", "apps.sale", "apps.table", "apps.task", "apps.tax",
    "apps.verifactu", "apps.website", "apps.whatsapp_inbox", "config", "control", "shared",
]
allow_indirect_imports = true
ignore_imports = ["**.tests.** -> **"]


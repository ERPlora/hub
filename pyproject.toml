[project]
name = "hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "django-ses>=4.8.2",
    "pycountry>=26.2.16",
    "phonenumbers>=9.0.41",
    "babel>=2.18",
    "python-stdnum>=2.2",
    "python-dateutil>=2.9",
    "xmlschema>=4.3",
    "qrcode>=8.2",
    "httpx>=0.28",
    "cryptography>=50.0",
    "croniter>=6",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "anthropic>=1.13.0",
    "respx>=0.23",
]

[tool.uv]
package = false

# erplora-live is the packages/live submodule (`git submodule update --init`); editable locally,
# the Dockerfile installs it with --no-editable.
[tool.uv.sources]
erplora-live = { path = "packages/live", editable = true }
